  <text x="48" y="42" font-size="18" font-weight="700" fill="#111827">What goes on the slip — and where it comes from</text>
  <text x="48" y="64" font-size="12" fill="#6b7280">Wording lives in Branches → Receipt details. The sale fills in the rest. The printer only draws what Kiosk sends.</text>

