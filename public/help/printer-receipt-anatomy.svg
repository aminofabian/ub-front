    <text x="112" y="135" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">YOU SET THIS</text>
    <text x="64" y="160" font-size="13" font-weight="700" fill="#111827">Shop name &amp; branch line</text>
    <text x="64" y="178" font-size="10.5" fill="#4b5563">The header customers read first.</text>
    <text x="64" y="194" font-size="10.5" fill="#4b5563">Use the name they already know.</text>
  </g>
  <g>
