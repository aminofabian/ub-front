  <rect x="48" y="520" width="912" height="60" rx="14" fill="#111827"/>
  <text x="504" y="546" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Change the wording in Branches → Receipt details, then Save — the printer only draws what Kiosk sends.</text>
  <text x="504" y="566" font-size="11" fill="#d1d5db" text-anchor="middle">Reprints from Sales history carry a REPRINT mark, so cashiers can spot duplicates at a glance.</text>
  <text x="48" y="606" font-size="11" fill="#9ca3af">Illustrated walkthrough · Kiosk Help · Kenya shop counters</text>
