<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="960" height="640" fill="#FBF9F5"/>
  <text x="48" y="42" font-size="18" font-weight="700" fill="#111827">Step 7  Take a test sale and watch the paper</text>
  <text x="48" y="64" font-size="12" fill="#6b7280">A real receipt is the only proof. Digital still works if paper jams  never stop the queue.</text>

  <!-- Printer with paper -->
  <rect x="72" y="100" width="280" height="200" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="104" y="120" width="216" height="88" rx="8" fill="#111827"/>
  <rect x="168" y="148" width="88" height="12" rx="6" fill="#28a745"/>
  <rect x="132" y="208" width="160" height="18" rx="4" fill="#e5e7eb"/>
  <!-- receipt hanging -->
  <rect x="148" y="226" width="128" height="280" rx="4" fill="#fffef8" stroke="#e5e7eb"/>
  <text x="212" y="252" font-size="11" font-weight="800" fill="#111827" text-anchor="middle">SUNRISE GROCERIES</text>
  <text x="212" y="270" font-size="8" fill="#6b7280" text-anchor="middle">yourshop.kiosk.ke</text>
  <line x1="160" y1="280" x2="264" y2="280" stroke="#e5e7eb"/>
  <text x="160" y="300" font-size="8" fill="#374151">Milk 500ml</text>
  <text x="264" y="300" font-size="8" fill="#374151" text-anchor="end">85.00</text>
  <text x="160" y="316" font-size="8" fill="#374151">White loaf</text>
  <text x="264" y="316" font-size="8" fill="#374151" text-anchor="end">70.00</text>
  <line x1="160" y1="328" x2="264" y2="328" stroke="#e5e7eb"/>
  <text x="160" y="348" font-size="9" font-weight="700" fill="#111827">TOTAL</text>
  <text x="264" y="348" font-size="9" font-weight="700" fill="#111827" text-anchor="end">155.00</text>
  <text x="212" y="372" font-size="8" fill="#15803d" text-anchor="middle">M-PESA  ·  TILL 3502582</text>
  <text x="212" y="392" font-size="8" fill="#9ca3af" text-anchor="middle">Thank you  karibu tena</text>
  <text x="212" y="430" font-size="7" fill="#d1d5db" text-anchor="middle">|||||||||| |||| ||||||</text>
  <text x="212" y="448" font-size="7" fill="#9ca3af" text-anchor="middle">INV-1042</text>
  <text x="212" y="488" font-size="10" font-weight="700" fill="#28a745" text-anchor="middle">CUT · DONE</text>

  <!-- Checklist -->
  <rect x="392" y="100" width="520" height="480" rx="18" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="392" y="100" width="520" height="52" rx="18" fill="#28a745"/>
  <rect x="392" y="136" width="520" height="16" fill="#28a745"/>
  <text x="416" y="134" font-size="15" font-weight="700" fill="#ffffff">The first-shift checklist</text>

  <g font-size="13" fill="#111827">
    <text x="416" y="188">1. Cashier chip shows the printer name, not Receipts on screen.</text>
    <text x="416" y="228">2. Ring a KSh 10 test item (or void it after).</text>
    <text x="416" y="268">3. Complete the sale  paper should feed and cut.</text>
    <text x="416" y="308">4. Shop name, till number, and footer match Branches.</text>
    <text x="416" y="348">5. If it fails, do not resend automatically  check the slip first.</text>
  </g>

  <rect x="416" y="380" width="472" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="436" y="410" font-size="13" font-weight="700" fill="#92400e">Paper came out blank?</text>
  <text x="436" y="432" font-size="12" fill="#78350f">Thermal paper has a shiny side. Flip the roll. Reprint from Sales history.</text>
  <text x="436" y="448" font-size="12" fill="#78350f">Never heat-gun a jam  open the lid, pull, reseat.</text>

  <rect x="416" y="480" width="472" height="72" rx="12" fill="#f7fdf9" stroke="rgba(40,167,69,0.35)"/>
  <text x="436" y="508" font-size="13" font-weight="700" fill="#15803d">Still selling without paper?</text>
  <text x="436" y="530" font-size="12" fill="#374151">WhatsApp receipt stays on. Paper is an upgrade, not a gate.</text>
</svg>
