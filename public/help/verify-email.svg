<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Ambient background -->
  <rect width="960" height="640" fill="#ffffff"/>
  <circle cx="160" cy="90" r="250" fill="#28a745" opacity="0.1"/>
  <circle cx="840" cy="570" r="230" fill="#0d9488" opacity="0.09"/>

  <!-- Card -->
  <rect x="26" y="26" width="908" height="588" rx="32" fill="#ffffff" stroke="rgba(40,167,69,0.25)"/>

  <!-- Left rail -->
  <rect x="26" y="26" width="470" height="588" rx="32" fill="#ffffff"/>
  <circle cx="58" cy="58" r="14" fill="#28a745"/>
  <path d="M51 63 l5 5 l10 -12" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="54" font-size="15" font-weight="700" fill="#0a0a0a">Kiosk</text>
  <text x="80" y="68" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">RETAIL PLATFORM</text>

  <!-- Success state -->
  <circle cx="268" cy="150" r="34" fill="#dcfce7"/>
  <path d="M250 150 l13 13 l24 -28" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="268" y="230" font-size="21" font-weight="700" fill="#0a0a0a" text-anchor="middle">You're almost done</text>
  <text x="268" y="254" font-size="12" fill="#737373" text-anchor="middle">We sent a link to jane@company.com.</text>
  <text x="268" y="270" font-size="12" fill="#737373" text-anchor="middle">Open it to verify — we'll take you straight to</text>
  <text x="268" y="286" font-size="12" fill="#737373" text-anchor="middle">your account.</text>

  <rect x="100" y="310" width="336" height="92" rx="12" fill="#f7fdf9" stroke="#bbe7c3"/>
  <text x="116" y="334" font-size="11.5" font-weight="700" fill="#0a0a0a">Verification link</text>
  <text x="116" y="356" font-size="10.5" fill="#166534" text-decoration="underline">https://kiosk.ke/verify?token=…</text>
  <text x="116" y="386" font-size="9.5" font-family="ui-monospace, Menlo, monospace" fill="#737373">Open in this browser</text>

  <rect x="100" y="416" width="336" height="40" rx="10" fill="#ffffff" stroke="#28a745" stroke-width="1.6"/>
  <text x="268" y="441" font-size="12.5" font-weight="700" fill="#28a745" text-anchor="middle">Open verification page</text>

  <text x="268" y="486" font-size="11.5" fill="#737373" text-anchor="middle">Already verified?</text>
  <text x="268" y="504" font-size="11.5" font-weight="700" fill="#28a745" text-anchor="middle">Continue to your account →</text>

  <!-- Right hero -->
  <rect x="496" y="26" width="438" height="588" rx="32" fill="#1c2a24"/>
  <circle cx="715" cy="150" r="70" fill="#ffffff" opacity="0.12"/>
  <circle cx="600" cy="220" r="90" fill="#ffffff" opacity="0.08"/>
  <rect x="655" y="170" width="120" height="120" rx="16" fill="#ffffff" opacity="0.1"/>
  <rect x="620" y="420" width="190" height="120" rx="14" fill="rgba(255,255,255,0.94)"/>
  <text x="636" y="446" font-size="12" font-weight="700" fill="#0a0a0a">Your operations hub</text>
  <text x="636" y="464" font-size="10" fill="#737373">Branded for Kiosk · sunrise-groceries</text>
  <circle cx="642" cy="492" r="14" fill="#28a745"/>
  <circle cx="668" cy="492" r="14" fill="#0d9488" opacity="0.8"/>
  <circle cx="694" cy="492" r="14" fill="#f59e0b" opacity="0.85"/>
  <circle cx="720" cy="492" r="14" fill="#6366f1" opacity="0.8"/>
  <text x="746" y="496" font-size="10" fill="#737373">Team ready</text>

  <!-- Callout -->
  <rect x="500" y="60" width="228" height="80" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="516" y="86" font-size="11.5" font-weight="700" fill="#92400e">Check the inbox (and spam)</text>
  <text x="516" y="104" font-size="10.5" fill="#737373">Click the link in this same browser.</text>
  <text x="516" y="120" font-size="10.5" fill="#737373">No need to sign in again after.</text>
</svg>
