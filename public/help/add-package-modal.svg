<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="640" fill="#f4f4f5"/>
  <rect x="16" y="72" width="330" height="552" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <g fill="#f5f5f5">
    <rect x="28" y="86" width="306" height="34" rx="4"/>
    <rect x="28" y="130" width="306" height="34" rx="4"/>
    <rect x="28" y="174" width="306" height="34" rx="4"/>
  </g>
  <rect x="28" y="130" width="6" height="34" fill="#28a745"/>
  <rect x="356" y="72" width="588" height="552" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="356" y="72" width="588" height="40" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="650" y="96" font-size="11" fill="#737373" text-anchor="middle">Products — Coca-Cola</text>
  <rect width="960" height="640" fill="rgba(0,0,0,0.32)"/>

  <!-- Modal -->
  <rect x="200" y="56" width="560" height="528" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- Header -->
  <rect x="216" y="74" width="30" height="30" fill="#f5f5f5" stroke="#e5e5e5"/>
  <rect x="224" y="82" width="14" height="14" fill="none" stroke="#28a745" stroke-width="1.6"/>
  <path d="M228 89 l3 3 l5 -5" stroke="#28a745" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="258" y="96" font-size="15" font-weight="600" fill="#0a0a0a">Package sales</text>
  <rect x="722" y="70" width="24" height="24" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M727 75 L741 89 M741 75 L727 89" stroke="#737373" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="200" y1="112" x2="760" y2="112" stroke="#e5e5e5"/>
  <text x="216" y="132" font-size="12" fill="#737373">Creates a new variant SKU for</text>
  <text x="216" y="148" font-size="12" fill="#737373"><tspan font-weight="600" fill="#0a0a0a">Coca-Cola 500 ml</tspan> (e.g. tray of 30).</text>
  <text x="216" y="164" font-size="12" fill="#737373">Stock stays on the base product — selling</text>
  <text x="216" y="180" font-size="12" fill="#737373">one package deducts that many base units.</text>

  <!-- Package card -->
  <text x="216" y="214" font-size="10.5" font-weight="600" letter-spacing="1" fill="#737373">PACKAGE 01</text>
  <rect x="216" y="224" width="528" height="252" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="228" y="252" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">PACKAGE NAME</text>
  <rect x="228" y="258" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="240" y="279" font-size="13" font-weight="600" fill="#0a0a0a">Tray of 30</text>
  <text x="496" y="252" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">CONVERSION · PIECES PER UNIT</text>
  <rect x="496" y="258" width="236" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="508" y="279" font-size="13" fill="#0a0a0a">30</text>

  <text x="228" y="322" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">PRICE PER PACKAGE · KES</text>
  <rect x="228" y="328" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="240" y="349" font-size="13" fill="#0a0a0a">1,500.00</text>
  <text x="496" y="322" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SKU · OPTIONAL</text>
  <rect x="496" y="328" width="236" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="508" y="349" font-size="12" fill="#a3a3a3">Auto</text>

  <text x="228" y="392" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BARCODE · OPTIONAL</text>
  <rect x="228" y="398" width="504" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="240" y="419" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a3a3a3">8992741030456</text>

  <rect x="228" y="444" width="504" height="24" fill="#f0fdf4"/>
  <text x="240" y="460" font-size="11" fill="#166534">Selling 1× Tray of 30 deducts 30 pieces from stock.</text>

  <!-- Footer -->
  <line x1="200" y1="528" x2="760" y2="528" stroke="#e5e5e5"/>
  <rect x="200" y="528" width="560" height="56" fill="#fafafa"/>
  <rect x="548" y="542" width="80" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="588" y="560" font-size="11.5" fill="#0a0a0a" text-anchor="middle">Cancel</text>
  <rect x="636" y="542" width="110" height="28" fill="#28a745"/>
  <text x="691" y="560" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Add package</text>
</svg>
