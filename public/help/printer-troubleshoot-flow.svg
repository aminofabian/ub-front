<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="960" height="640" fill="#FBF9F5"/>
  <text x="48" y="42" font-size="18" font-weight="700" fill="#111827">Nothing printed? Work down this list</text>
  <text x="48" y="64" font-size="12" fill="#6b7280">Stop at the first row that fails. Nine times out of ten it is paper, power, or the cable — not software.</text>

  <!-- Row 1 -->
  <g>
    <rect x="48" y="96" width="400" height="72" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <circle cx="76" cy="132" r="14" fill="#111827"/>
    <text x="76" y="136" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="100" y="126" font-size="13" font-weight="700" fill="#111827">Do the lights come on?</text>
    <text x="100" y="146" font-size="11" fill="#6b7280">Check the power switch and the wall socket.</text>
    <text x="502" y="122" font-size="9" font-weight="700" fill="#9ca3af" text-anchor="middle">IF NOT</text>
    <line x1="456" y1="132" x2="544" y2="132" stroke="#9ca3af" stroke-width="2"/>
    <polygon points="552,132 540,126 540,138" fill="#9ca3af"/>
    <rect x="560" y="96" width="352" height="72" rx="12" fill="#f7fdf9" stroke="rgba(40,167,69,0.35)"/>
    <rect x="576" y="106" width="34" height="16" rx="8" fill="#28a745"/>
    <text x="593" y="118" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">FIX</text>
    <text x="576" y="140" font-size="11" fill="#374151">Reseat the power adapter at both ends and try a</text>
    <text x="576" y="156" font-size="11" fill="#374151">different socket. No lights means no printing.</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="48" y="178" width="400" height="72" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <circle cx="76" cy="214" r="14" fill="#111827"/>
    <text x="76" y="218" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="100" y="208" font-size="13" font-weight="700" fill="#111827">Does the self-test print?</text>
    <text x="100" y="228" font-size="11" fill="#6b7280">Hold FEED while you switch the power on.</text>
    <text x="502" y="214" font-size="9" font-weight="700" fill="#9ca3af" text-anchor="middle">IF NOT</text>
    <line x1="456" y1="214" x2="544" y2="214" stroke="#9ca3af" stroke-width="2"/>
    <polygon points="552,214 540,208 540,220" fill="#9ca3af"/>
    <rect x="560" y="178" width="352" height="72" rx="12" fill="#f7fdf9" stroke="rgba(40,167,69,0.35)"/>
    <rect x="576" y="188" width="34" height="16" rx="8" fill="#28a745"/>
    <text x="593" y="200" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">FIX</text>
    <text x="576" y="222" font-size="11" fill="#374151">No slip means paper backwards or the lid open.</text>
    <text x="576" y="240" font-size="11" fill="#374151">Flip the roll — shiny side to the print head.</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="48" y="260" width="400" height="72" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <circle cx="76" cy="296" r="14" fill="#111827"/>
    <text x="76" y="300" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="100" y="290" font-size="13" font-weight="700" fill="#111827">Does the system list the printer?</text>
    <text x="100" y="310" font-size="11" fill="#6b7280">Windows, macOS Printers &amp; Scanners, or CUPS.</text>
    <text x="502" y="296" font-size="9" font-weight="700" fill="#9ca3af" text-anchor="middle">IF NOT</text>
    <line x1="456" y1="296" x2="544" y2="296" stroke="#9ca3af" stroke-width="2"/>
    <polygon points="552,296 540,290 540,302" fill="#9ca3af"/>
    <rect x="560" y="260" width="352" height="72" rx="12" fill="#f7fdf9" stroke="rgba(40,167,69,0.35)"/>
    <rect x="576" y="270" width="34" height="16" rx="8" fill="#28a745"/>
    <text x="593" y="282" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">FIX</text>
    <text x="576" y="304" font-size="11" fill="#374151">Swap any charger lead for the square data USB-B</text>
    <text x="576" y="322" font-size="11" fill="#374151">cable, and keep the Print Spooler service running.</text>
  </g>

  <!-- Row 4 -->
  <g>
    <rect x="48" y="342" width="400" height="72" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <circle cx="76" cy="378" r="14" fill="#111827"/>
    <text x="76" y="382" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="100" y="372" font-size="13" font-weight="700" fill="#111827">Does Detect printers find it?</text>
    <text x="100" y="392" font-size="11" fill="#6b7280">Cashier → Receipts chip → Connect a printer.</text>
    <text x="502" y="378" font-size="9" font-weight="700" fill="#9ca3af" text-anchor="middle">IF NOT</text>
    <line x1="456" y1="378" x2="544" y2="378" stroke="#9ca3af" stroke-width="2"/>
    <polygon points="552,378 540,372 540,384" fill="#9ca3af"/>
    <rect x="560" y="342" width="352" height="72" rx="12" fill="#f7fdf9" stroke="rgba(40,167,69,0.35)"/>
    <rect x="576" y="352" width="34" height="16" rx="8" fill="#28a745"/>
    <text x="593" y="364" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">FIX</text>
    <text x="576" y="386" font-size="11" fill="#374151">Run the Print Bridge installer once on THIS till PC —</text>
    <text x="576" y="404" font-size="11" fill="#374151">not a phone, not the back office — then Detect again.</text>
  </g>

  <!-- Row 5 -->
  <g>
    <rect x="48" y="424" width="400" height="72" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <circle cx="76" cy="460" r="14" fill="#111827"/>
    <text x="76" y="464" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
    <text x="100" y="454" font-size="13" font-weight="700" fill="#111827">Is the thermal (receipt) queue picked?</text>
    <text x="100" y="474" font-size="11" fill="#6b7280">The chip in Cashier should show its name.</text>
    <text x="502" y="460" font-size="9" font-weight="700" fill="#9ca3af" text-anchor="middle">IF NOT</text>
    <line x1="456" y1="460" x2="544" y2="460" stroke="#9ca3af" stroke-width="2"/>
    <polygon points="552,460 540,454 540,466" fill="#9ca3af"/>
    <rect x="560" y="424" width="352" height="72" rx="12" fill="#f7fdf9" stroke="rgba(40,167,69,0.35)"/>
    <rect x="576" y="434" width="34" height="16" rx="8" fill="#28a745"/>
    <text x="593" y="446" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">FIX</text>
    <text x="576" y="468" font-size="11" fill="#374151">Never Print to PDF or Fax. Pick the row marked</text>
    <text x="576" y="486" font-size="11" fill="#374151">(receipt), then Save on the branch.</text>
  </g>

  <rect x="48" y="512" width="912" height="64" rx="14" fill="#111827"/>
  <text x="504" y="538" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Slip came out blank grey? Flip the roll and reprint from Sales history — don't tap print twice.</text>
  <text x="504" y="560" font-size="11" fill="#d1d5db" text-anchor="middle">A timed-out job may already be spooled. Look at the printer before you print again.</text>
  <text x="48" y="604" font-size="11" fill="#9ca3af">Illustrated walkthrough · Kiosk Help · Kenya shop counters</text>
</svg>