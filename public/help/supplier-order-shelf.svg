  <text x="750" y="440" font-size="10" fill="rgba(21,35,31,0.5)">Saving creates a purchase order (PO).</text>
  <text x="750" y="455" font-size="10" fill="rgba(21,35,31,0.5)">Confirm the delivery when goods arrive</text>
  <text x="750" y="470" font-size="10" fill="rgba(21,35,31,0.5)">to post the supply and raise stock.</text>
