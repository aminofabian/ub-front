  <text x="830" y="376" font-size="10.5" fill="rgba(21,35,31,0.25)">·</text>
  <text x="840" y="376" font-size="10.5" font-weight="500" fill="rgba(21,35,31,0.6)">WhatsApp</text>
  <text x="902" y="376" font-size="10.5" fill="rgba(21,35,31,0.25)">·</text>
