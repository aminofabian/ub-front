<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="640" fill="#f4f4f5"/>

  <!-- Header -->
  <rect x="16" y="16" width="928" height="48" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="28" y="46" font-size="12" font-weight="600" fill="#0a0a0a">Products</text>
  <rect x="858" y="26" width="74" height="28" rx="4" fill="#28a745"/>
  <text x="895" y="44" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">+ New</text>

  <!-- List column -->
  <rect x="16" y="72" width="330" height="552" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <g fill="#f5f5f5">
    <rect x="28" y="86" width="306" height="34" rx="4"/>
    <rect x="28" y="130" width="306" height="34" rx="4"/>
    <rect x="28" y="174" width="306" height="34" rx="4"/>
    <rect x="28" y="218" width="306" height="34" rx="4"/>
  </g>
  <rect x="28" y="130" width="6" height="34" fill="#28a745"/>
  <text x="44" y="151" font-size="12" font-weight="600" fill="#0a0a0a">Coca-Cola</text>
  <text x="44" y="169" font-size="10" fill="#737373">Group · Soft drinks</text>

  <!-- Detail panel -->
  <rect x="356" y="72" width="588" height="552" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="356" y="72" width="4" height="552" fill="#28a745"/>

  <!-- Hero -->
  <rect x="376" y="88" width="44" height="44" fill="#fafafa" stroke="#d4d4d4" stroke-dasharray="4 3"/>
  <path d="M391 104 v12 M385 110 h12" stroke="#a3a3a3" stroke-width="1.4" stroke-linecap="round"/>
  <text x="432" y="106" font-size="16" font-weight="700" fill="#0a0a0a">Coca-Cola</text>
  <rect x="432" y="114" width="56" height="18" fill="#f0fdf4" stroke="#bbe7c3"/>
  <text x="460" y="127" font-size="9.5" font-weight="600" fill="#166534" text-anchor="middle">GROUP</text>
  <text x="496" y="126" font-size="11" fill="#737373">Soft drinks · 3 variants</text>
  <path d="M850 92 l5 10 l11 1.5 l-8 8 l2 11 l-10 -5.5 l-10 5.5 l2 -11 l-8 -8 l11 -1.5 z" fill="#d4a017" opacity="0.9"/>

  <!-- Metric strip -->
  <rect x="376" y="148" width="128" height="52" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="388" y="168" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SELL PRICE</text>
  <text x="388" y="190" font-size="14" font-weight="700" fill="#0a0a0a">KES 60.00</text>
  <rect x="504" y="148" width="128" height="52" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="516" y="168" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BUY COST</text>
  <text x="516" y="190" font-size="14" font-weight="700" fill="#0a0a0a">KES 48.00</text>
  <rect x="632" y="148" width="128" height="52" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="644" y="168" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">MARGIN</text>
  <text x="644" y="190" font-size="14" font-weight="700" fill="#166534">20.0%</text>
  <rect x="760" y="148" width="168" height="52" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="772" y="168" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">ON HAND</text>
  <text x="772" y="190" font-size="14" font-weight="700" fill="#0a0a0a">32</text>

  <!-- Quick edit rows -->
  <text x="376" y="230" font-size="11" font-weight="600" fill="#0a0a0a">Quick edit</text>
  <rect x="376" y="240" width="552" height="36" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="388" y="262" font-size="12" fill="#737373">Sell price</text>
  <text x="800" y="262" font-size="12" font-weight="600" fill="#0a0a0a">KES 60.00</text>
  <path d="M898 250 l8 -8 l4 4 l-8 8 z M900 252 l-4 -4" stroke="#28a745" stroke-width="1.3" fill="none"/>
  <rect x="376" y="280" width="552" height="36" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="388" y="302" font-size="12" fill="#737373">On hand · Main branch</text>
  <text x="800" y="302" font-size="12" font-weight="600" fill="#0a0a0a">32</text>
  <path d="M898 290 l8 -8 l4 4 l-8 8 z M900 292 l-4 -4" stroke="#28a745" stroke-width="1.3" fill="none"/>

  <!-- Actions -->
  <rect x="376" y="328" width="120" height="30" fill="#0a0a0a"/>
  <path d="M388 343 h12 M394 337 v12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="410" y="347" font-size="11" font-weight="600" fill="#ffffff">Variant</text>
  <rect x="500" y="328" width="128" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="512" y="336" width="14" height="14" fill="none" stroke="#0a0a0a" stroke-width="1.4"/>
  <text x="534" y="347" font-size="11" font-weight="500" fill="#0a0a0a">Package sales</text>
  <rect x="632" y="328" width="76" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="670" y="347" font-size="11" font-weight="500" fill="#0a0a0a">Edit</text>
  <rect x="712" y="328" width="76" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="750" y="347" font-size="11" font-weight="500" fill="#0a0a0a">Photos</text>

  <!-- Variants -->
  <text x="376" y="390" font-size="11" font-weight="600" fill="#0a0a0a">Variants · 3</text>
  <rect x="376" y="400" width="552" height="40" fill="#ffffff" stroke="#e5e5e5"/>
  <circle cx="394" cy="420" r="8" fill="#f5f5f5" stroke="#d4d4d4"/>
  <text x="394" y="423" font-size="9" fill="#737373" text-anchor="middle">300</text>
  <text x="412" y="424" font-size="12" font-weight="600" fill="#0a0a0a">300 ml</text>
  <text x="800" y="424" font-size="11.5" fill="#0a0a0a">60.00 · on hand 12</text>
  <rect x="376" y="440" width="552" height="40" fill="#ffffff" stroke="#e5e5e5"/>
  <circle cx="394" cy="460" r="8" fill="#f5f5f5" stroke="#d4d4d4"/>
  <text x="394" y="463" font-size="9" fill="#737373" text-anchor="middle">500</text>
  <text x="412" y="464" font-size="12" font-weight="600" fill="#0a0a0a">500 ml</text>
  <text x="800" y="464" font-size="11.5" fill="#0a0a0a">80.00 · on hand 8</text>
  <rect x="376" y="480" width="552" height="40" fill="#ffffff" stroke="#e5e5e5"/>
  <circle cx="394" cy="500" r="8" fill="#f5f5f5" stroke="#d4d4d4"/>
  <text x="394" y="503" font-size="9" fill="#737373" text-anchor="middle">1 L</text>
  <text x="412" y="504" font-size="12" font-weight="600" fill="#0a0a0a">1 L</text>
  <text x="800" y="504" font-size="11.5" fill="#0a0a0a">150.00 · on hand 12</text>

  <text x="376" y="548" font-size="10.5" fill="#737373">Tap any variant to open its own detail — each keeps its own price, barcode, and stock.</text>

  <!-- Sticky bar -->
  <line x1="356" y1="592" x2="944" y2="592" stroke="#e5e5e5"/>
  <rect x="376" y="600" width="96" height="28" fill="#0a0a0a"/>
  <text x="424" y="618" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Edit</text>
  <rect x="476" y="600" width="120" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="536" y="618" font-size="11" font-weight="500" fill="#0a0a0a" text-anchor="middle">Quick edit all</text>

  <!-- Callout -->
  <rect x="540" y="8" width="200" height="30" rx="6" fill="#ffffff" stroke="#28a745" stroke-width="1.5"/>
  <path d="M640 38 l0 8 l10 -8 z" fill="#ffffff" stroke="#28a745" stroke-width="1.5"/>
  <text x="640" y="27" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">Manage from here</text>
</svg>
