<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Full-screen questionnaire -->
  <rect width="960" height="640" fill="#FBF9F5"/>

  <!-- Header -->
  <circle cx="36" cy="34" r="12" fill="#28a745"/>
  <path d="M30 38 l4 4 l9 -10" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="56" y="31" font-size="13" font-weight="700" fill="#0a0a0a">Kiosk</text>
  <text x="56" y="44" font-size="8.5" font-weight="600" letter-spacing="1" fill="#737373">SETUP</text>
  <text x="760" y="38" font-size="11" font-weight="600" fill="#374151">50% done</text>
  <text x="920" y="38" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#9CA3AF" text-anchor="end">3 / 6</text>
  <rect x="580" y="48" width="364" height="6" rx="3" fill="#e5e5e5"/>
  <rect x="580" y="48" width="182" height="6" rx="3" fill="#28a745"/>

  <!-- Step heading -->
  <text x="300" y="118" font-size="24" font-weight="700" fill="#1F2937" text-anchor="middle">What kind of shop is this?</text>
  <text x="300" y="142" font-size="12" fill="#6b7280" text-anchor="middle">Select all that apply — a mini mart can also include a butchery.</text>
  <text x="300" y="158" font-size="12" fill="#6b7280" text-anchor="middle">Mini mart and mixed shop can import starter products at the end.</text>

  <!-- Store type options -->
  <g>
    <rect x="180" y="180" width="240" height="76" rx="14" fill="#ffffff" stroke="#28a745" stroke-width="2"/>
    <rect x="196" y="196" width="22" height="22" rx="6" fill="#28a745"/>
    <path d="M202 207 l5 5 l8 -9" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="206" font-size="13" font-weight="700" fill="#0a0a0a">Mini mart</text>
    <text x="228" y="224" font-size="10.5" fill="#737373">Snacks, drinks, everyday staples</text>
    <text x="228" y="240" font-size="10" fill="#166534">Imports starter products</text>

    <rect x="440" y="180" width="240" height="76" rx="14" fill="#ffffff" stroke="#28a745" stroke-width="2"/>
    <rect x="456" y="196" width="22" height="22" rx="6" fill="#28a745"/>
    <path d="M462 207 l5 5 l8 -9" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="488" y="206" font-size="13" font-weight="700" fill="#0a0a0a">Butchery</text>
    <text x="488" y="224" font-size="10.5" fill="#737373">Meat, poultry, fish, eggs</text>

    <rect x="180" y="268" width="240" height="64" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="196" y="284" width="22" height="22" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="228" y="294" font-size="13" font-weight="600" fill="#0a0a0a">Full grocery</text>
    <text x="228" y="312" font-size="10.5" fill="#737373">Wide range across departments</text>

    <rect x="440" y="268" width="240" height="64" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="456" y="284" width="22" height="22" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="488" y="294" font-size="13" font-weight="600" fill="#0a0a0a">Fresh market</text>
    <text x="488" y="312" font-size="10.5" fill="#737373">Produce, dairy, protein focus</text>

    <rect x="180" y="344" width="240" height="64" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="196" y="360" width="22" height="22" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="228" y="370" font-size="13" font-weight="600" fill="#0a0a0a">Mixed shop</text>
    <text x="228" y="388" font-size="10.5" fill="#737373">Groceries plus general retail</text>

    <rect x="440" y="344" width="240" height="64" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="456" y="360" width="22" height="22" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="488" y="370" font-size="13" font-weight="600" fill="#0a0a0a">Other</text>
    <text x="488" y="388" font-size="10.5" fill="#737373">A different kind of shop</text>
  </g>

  <!-- Progress steps -->
  <text x="220" y="452" font-size="10" font-weight="600" fill="#9CA3AF">1 · Locations</text>
  <text x="320" y="452" font-size="10" font-weight="700" fill="#28a745">2 · Shop type</text>
  <text x="420" y="452" font-size="10" font-weight="600" fill="#9CA3AF">3 · Sections</text>
  <text x="516" y="452" font-size="10" font-weight="600" fill="#9CA3AF">4 · Online</text>
  <text x="592" y="452" font-size="10" font-weight="600" fill="#9CA3AF">5 · Brand</text>
  <text x="664" y="452" font-size="10" font-weight="600" fill="#9CA3AF">6 · Shelves</text>

  <!-- Footer -->
  <line x1="40" y1="560" x2="920" y2="560" stroke="#ece5db"/>
  <text x="60" y="592" font-size="12" font-weight="500" fill="#737373" text-decoration="underline">Skip for now</text>
  <rect x="760" y="574" width="84" height="38" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="802" y="597" font-size="12" font-weight="600" fill="#0a0a0a" text-anchor="middle">Back</text>
  <rect x="852" y="574" width="68" height="38" rx="10" fill="#28a745"/>
  <text x="886" y="597" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Continue</text>
</svg>
