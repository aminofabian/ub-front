<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop: Users page -->
  <rect width="960" height="640" fill="#f4f4f5"/>
  <rect x="16" y="16" width="928" height="44" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="28" y="32" font-size="9" font-weight="700" letter-spacing="1.2" fill="#737373">TEAM</text>
  <text x="28" y="50" font-size="15" font-weight="700" fill="#0a0a0a">Users</text>
  <text x="76" y="46" font-size="10.5" fill="#737373">Invite staff, assign roles, and manage sign-in credentials.</text>
  <rect x="810" y="26" width="96" height="28" rx="4" fill="#28a745"/>
  <text x="858" y="44" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">+ Invite user</text>
  <rect x="804" y="20" width="108" height="40" rx="6" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="916" cy="22" r="7" fill="#28a745"/>
  <text x="916" y="26" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="16" y="70" width="928" height="60" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="28" y="92" font-size="10" font-weight="700" fill="#0a0a0a">Directory</text>
  <text x="120" y="92" font-size="10" fill="#737373">5 users</text>
  <text x="28" y="114" font-size="9" font-weight="600" letter-spacing="0.8" fill="#737373">STATUS</text>
  <rect x="28" y="118" width="120" height="0" fill="none"/>
  <rect x="16" y="142" width="928" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <circle cx="36" cy="157" r="10" fill="#e0e7ff"/>
  <text x="36" y="161" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">JW</text>
  <text x="54" y="154" font-size="11" font-weight="600" fill="#0a0a0a">Jane Doe</text>
  <text x="54" y="166" font-size="9.5" fill="#737373">jane@company.com</text>
  <rect x="300" y="149" width="56" height="16" fill="#f3f4f6" stroke="#e5e5e5"/>
  <text x="328" y="160" font-size="9" font-weight="600" fill="#0a0a0a" text-anchor="middle">Cashier</text>
  <rect x="16" y="172" width="928" height="30" fill="#fafbfd" stroke="#e5e5e5"/>
  <rect width="960" height="640" fill="rgba(0,0,0,0.32)"/>

  <!-- Drawer -->
  <rect x="400" y="0" width="560" height="640" fill="#ffffff"/>
  <rect x="400" y="0" width="4" height="640" fill="#28a745"/>

  <rect x="424" y="14" width="70" height="20" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="459" y="28" font-size="9" font-weight="600" letter-spacing="1.2" fill="#0a0a0a" text-anchor="middle">TEAM</text>
  <text x="424" y="52" font-size="15" font-weight="600" fill="#0a0a0a">Invite user</text>
  <text x="424" y="70" font-size="11" fill="#737373">Creates the account and sends them through your configured onboarding flow.</text>
  <rect x="922" y="16" width="24" height="24" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M927 21 L941 35 M941 21 L927 35" stroke="#737373" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="400" y1="86" x2="960" y2="86" stroke="#e5e5e5"/>

  <!-- Account section -->
  <text x="424" y="112" font-size="10.5" font-weight="700" fill="#0a0a0a">ACCOUNT</text>
  <text x="424" y="128" font-size="10.5" fill="#737373">Email must be unique in your workspace.</text>

  <text x="424" y="154" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">FULL NAME</text>
  <rect x="424" y="160" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="181" font-size="13" fill="#0a0a0a">Jane Doe</text>
  <text x="688" y="154" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">EMAIL</text>
  <rect x="688" y="160" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="181" font-size="13" fill="#0a0a0a">jane@company.com</text>

  <text x="424" y="218" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">ROLE</text>
  <rect x="424" y="224" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="245" font-size="12.5" font-weight="600" fill="#0a0a0a">Cashier</text>
  <path d="M648 234 l8 6 l8 -6" stroke="#737373" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <text x="688" y="218" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BRANCH</text>
  <rect x="688" y="224" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="245" font-size="12.5" fill="#0a0a0a">Main branch</text>
  <path d="M912 234 l8 6 l8 -6" stroke="#737373" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Sign-in method -->
  <text x="424" y="284" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SIGN-IN METHOD</text>
  <rect x="424" y="290" width="512" height="34" fill="#ffffff" stroke="#28a745" stroke-width="1.4"/>
  <text x="436" y="311" font-size="12.5" fill="#0a0a0a">Email invite (sets own password)</text>
  <path d="M912 300 l8 6 l8 -6" stroke="#28a745" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Dropdown -->
  <rect x="424" y="324" width="512" height="76" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M424 324 h512 v2 h-512 z" fill="#f5f5f5"/>
  <circle cx="440" cy="346" r="9" fill="#eff6ff"/>
  <text x="440" y="350" font-size="7.5" fill="#2563eb" text-anchor="middle">@</text>
  <text x="458" y="350" font-size="12" font-weight="600" fill="#0a0a0a">Email invite (sets own password)</text>
  <circle cx="440" cy="378" r="9" fill="#f0fdf4"/>
  <text x="440" y="382" font-size="7.5" fill="#16a34a" text-anchor="middle">#</text>
  <text x="458" y="382" font-size="12" font-weight="600" fill="#0a0a0a">PIN (kiosk / cashier)</text>

  <!-- Hint -->
  <rect x="424" y="416" width="512" height="36" fill="#f5f5f5"/>
  <text x="436" y="432" font-size="11" fill="#737373">We'll email this person a secure link to set their own password.</text>
  <text x="436" y="446" font-size="11" fill="#737373">They can sign in once they've set it.</text>

  <!-- Footer -->
  <line x1="400" y1="600" x2="960" y2="600" stroke="#e5e5e5"/>
  <rect x="756" y="606" width="80" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="796" y="624" font-size="11.5" fill="#0a0a0a" text-anchor="middle">Cancel</text>
  <rect x="844" y="606" width="92" height="28" fill="#28a745"/>
  <path d="M858 620 h12 M864 614 v12" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="878" y="624" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Create user</text>
</svg>
