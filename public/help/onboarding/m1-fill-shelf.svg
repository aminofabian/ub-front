<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop: Products page -->
  <rect width="960" height="640" fill="#f4f4f5"/>

  <!-- Page header card -->
  <rect x="16" y="16" width="928" height="48" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="28" y="30" width="64" height="20" rx="4" fill="#f5f5f5" stroke="#e5e5e5"/>
  <rect x="100" y="30" width="64" height="20" rx="4" fill="#f5f5f5" stroke="#e5e5e5"/>
  <rect x="176" y="30" width="64" height="20" rx="4" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="176" y="44" font-size="10" fill="#737373" text-anchor="middle">Categories</text>
  <text x="100" y="44" font-size="10" fill="#737373" text-anchor="middle">Suppliers</text>
  <text x="60" y="44" font-size="10" fill="#737373" text-anchor="middle">Pricing</text>

  <!-- New button (highlighted) -->
  <rect x="858" y="26" width="74" height="28" rx="4" fill="#28a745"/>
  <text x="895" y="44" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">+ New</text>
  <rect x="852" y="20" width="86" height="40" rx="6" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="942" cy="22" r="7" fill="#28a745"/>
  <text x="942" y="26" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <!-- List column -->
  <rect x="16" y="72" width="330" height="552" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <g fill="#f5f5f5">
    <rect x="28" y="86" width="306" height="34" rx="4"/>
    <rect x="28" y="130" width="306" height="34" rx="4"/>
    <rect x="28" y="174" width="306" height="34" rx="4"/>
    <rect x="28" y="218" width="306" height="34" rx="4"/>
    <rect x="28" y="262" width="306" height="34" rx="4"/>
    <rect x="28" y="306" width="306" height="34" rx="4"/>
  </g>

  <!-- Right detail hint -->
  <rect x="356" y="72" width="588" height="552" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="356" y="72" width="588" height="40" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="650" y="96" font-size="11" fill="#737373" text-anchor="middle">Products — Catalog</text>

  <!-- Scrim -->
  <rect width="960" height="640" fill="rgba(0,0,0,0.32)"/>

  <!-- Drawer panel -->
  <rect x="400" y="0" width="560" height="640" fill="#ffffff"/>
  <rect x="400" y="0" width="4" height="640" fill="#28a745"/>

  <!-- Header -->
  <rect x="424" y="14" width="70" height="20" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="459" y="28" font-size="9" font-weight="600" letter-spacing="1.2" fill="#0a0a0a" text-anchor="middle">CATALOG</text>
  <text x="424" y="52" font-size="15" font-weight="600" fill="#0a0a0a">Add product</text>
  <rect x="922" y="16" width="24" height="24" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M927 21 L941 35 M941 21 L927 35" stroke="#737373" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="400" y1="60" x2="960" y2="60" stroke="#e5e5e5"/>

  <!-- Toggle -->
  <rect x="424" y="72" width="256" height="28" fill="#0a0a0a"/>
  <text x="552" y="90" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Single product</text>
  <rect x="680" y="72" width="256" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="808" y="90" font-size="11" font-weight="600" fill="#737373" text-anchor="middle">Group</text>

  <!-- Name -->
  <text x="424" y="126" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">PRODUCT NAME</text>
  <rect x="424" y="134" width="32" height="32" fill="#ffffff" stroke="#d4d4d4" stroke-dasharray="4 3"/>
  <path d="M439 142 v16 M431 150 h16" stroke="#a3a3a3" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="464" y="134" width="472" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="476" y="154" font-size="13" fill="#0a0a0a">Sunbest Cooking Oil 1 L</text>

  <!-- Department / Category -->
  <text x="424" y="190" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">DEPARTMENT</text>
  <text x="706" y="190" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">CATEGORY · OPTIONAL</text>
  <rect x="424" y="198" width="266" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="218" font-size="12" fill="#0a0a0a">Grocery</text>
  <path d="M668 208 l8 6 l8 -6" stroke="#737373" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <rect x="706" y="198" width="230" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="718" y="218" font-size="12" fill="#0a0a0a">Cooking oils</text>
  <path d="M914 208 l8 6 l8 -6" stroke="#737373" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Pricing -->
  <text x="424" y="254" font-size="11" font-weight="600" fill="#0a0a0a">Pricing</text>
  <text x="424" y="274" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BUYING PRICE · KES</text>
  <text x="706" y="274" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SELL PRICE · KES</text>
  <rect x="424" y="282" width="266" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="303" font-size="12.5" fill="#0a0a0a">450.00</text>
  <rect x="706" y="282" width="230" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="718" y="303" font-size="12.5" font-weight="600" fill="#0a0a0a">520.00</text>
  <text x="424" y="336" font-size="11" fill="#737373">Margin 13.5% · profit KES 70.00</text>

  <!-- Codes -->
  <line x1="424" y1="356" x2="936" y2="356" stroke="#f0f0f0"/>
  <text x="424" y="382" font-size="11" font-weight="600" fill="#0a0a0a">Codes</text>
  <text x="424" y="402" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BARCODE · SCAN OR TYPE</text>
  <rect x="424" y="410" width="300" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="430" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0a0a0a">8992741023456</text>
  <rect x="700" y="410" width="24" height="32" fill="#fafafa" stroke="#e5e5e5"/>
  <rect x="706" y="420" width="12" height="9" rx="1.5" fill="none" stroke="#737373" stroke-width="1.3"/>
  <circle cx="712" cy="424.5" r="2.4" fill="none" stroke="#737373" stroke-width="1.3"/>
  <text x="736" y="402" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SKU · AUTO IF BLANK</text>
  <rect x="736" y="410" width="200" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="748" y="430" font-size="12" fill="#a3a3a3">Auto-generated</text>

  <!-- Stock -->
  <line x1="424" y1="462" x2="936" y2="462" stroke="#f0f0f0"/>
  <text x="424" y="488" font-size="11" font-weight="600" fill="#0a0a0a">Stock</text>
  <text x="424" y="508" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BRANCH</text>
  <text x="706" y="508" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">OPENING QTY</text>
  <rect x="424" y="516" width="266" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="536" font-size="12" fill="#0a0a0a">Main branch</text>
  <path d="M668 526 l8 6 l8 -6" stroke="#737373" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <rect x="706" y="516" width="230" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="718" y="536" font-size="12" fill="#0a0a0a">24</text>

  <!-- Toggles -->
  <rect x="424" y="560" width="126" height="24" fill="#0a0a0a"/>
  <path d="M433 571 l4 4 l7 -7" stroke="#28a745" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="448" y="576" font-size="10.5" font-weight="500" fill="#ffffff">Track stock</text>
  <rect x="556" y="560" width="96" height="24" fill="#0a0a0a"/>
  <path d="M565 571 l4 4 l7 -7" stroke="#28a745" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="580" y="576" font-size="10.5" font-weight="500" fill="#ffffff">Sellable</text>
  <rect x="658" y="560" width="120" height="24" fill="#ffffff" stroke="#e5e5e5"/>
  <circle cx="674" cy="572" r="5" fill="none" stroke="#a3a3a3" stroke-width="1.3"/>
  <text x="690" y="576" font-size="10.5" fill="#737373">Sell by weight</text>

  <!-- Footer -->
  <line x1="400" y1="600" x2="960" y2="600" stroke="#e5e5e5"/>
  <rect x="424" y="610" width="12" height="12" fill="#ffffff" stroke="#d4d4d4"/>
  <text x="442" y="620" font-size="11" fill="#737373">Keep open</text>
  <rect x="748" y="606" width="80" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="788" y="624" font-size="11.5" fill="#0a0a0a" text-anchor="middle">Cancel</text>
  <rect x="836" y="606" width="100" height="28" fill="#28a745"/>
  <path d="M850 620 h12 M856 614 v12" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="876" y="624" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Create</text>
</svg>
