<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop: dashboard home -->
  <rect width="960" height="640" fill="#f8fafc"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="180" height="640" fill="#ffffff" stroke="#e5e5e5"/>
  <circle cx="30" cy="30" r="11" fill="#28a745"/>
  <path d="M24 34 l4 4 l8 -9" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="28" font-size="13" font-weight="700" fill="#0a0a0a">Kiosk</text>
  <text x="48" y="42" font-size="8.5" font-weight="600" letter-spacing="1" fill="#737373">SUNRISE GROCERIES</text>
  <g fill="#f3f4f6">
    <rect x="16" y="70" width="148" height="26" fill="#e8f5ee" stroke="#bbe7c3"/>
    <text x="30" y="87" font-size="10.5" font-weight="600" fill="#166534">Business</text>
    <rect x="16" y="104" width="148" height="26"/>
    <text x="30" y="121" font-size="10.5" fill="#737373">Products</text>
    <rect x="16" y="138" width="148" height="26"/>
    <text x="30" y="155" font-size="10.5" fill="#737373">Suppliers</text>
    <rect x="16" y="172" width="148" height="26"/>
    <text x="30" y="189" font-size="10.5" fill="#737373">Sales</text>
    <rect x="16" y="206" width="148" height="26"/>
    <text x="30" y="223" font-size="10.5" fill="#737373">Users</text>
  </g>

  <!-- Header -->
  <rect x="180" y="0" width="780" height="52" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="200" y="32" font-size="13" font-weight="700" fill="#0a0a0a">Business</text>
  <circle cx="924" cy="26" r="12" fill="#dcfce7"/>
  <text x="924" y="31" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">JD</text>

  <!-- Dashboard content (dimmed) -->
  <rect x="200" y="68" width="340" height="120" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="216" y="84" width="120" height="12" rx="4" fill="#f3f4f6"/>
  <rect x="216" y="104" width="200" height="10" rx="4" fill="#f3f4f6"/>
  <rect x="216" y="122" width="160" height="10" rx="4" fill="#f3f4f6"/>
  <rect x="560" y="68" width="200" height="120" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="576" y="84" width="100" height="12" rx="4" fill="#f3f4f6"/>
  <rect x="576" y="104" width="160" height="10" rx="4" fill="#f3f4f6"/>
  <rect x="200" y="204" width="340" height="120" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="216" y="220" width="90" height="12" rx="4" fill="#f3f4f6"/>
  <rect x="216" y="240" width="240" height="10" rx="4" fill="#f3f4f6"/>
  <rect x="560" y="204" width="200" height="120" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="576" y="220" width="90" height="12" rx="4" fill="#f3f4f6"/>

  <!-- Scrim -->
  <rect width="960" height="640" fill="rgba(15,23,42,0.18)"/>

  <!-- Welcome drawer -->
  <rect x="520" y="0" width="440" height="640" fill="#ffffff"/>
  <rect x="520" y="0" width="4" height="640" fill="#28a745"/>

  <rect x="540" y="16" width="112" height="22" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="596" y="31" font-size="9" font-weight="700" letter-spacing="1.4" fill="#28a745" text-anchor="middle">GETTING STARTED</text>
  <text x="540" y="62" font-size="19" font-weight="700" fill="#0a0a0a">Welcome to your shop</text>
  <text x="540" y="82" font-size="12" fill="#737373">Sunrise Groceries is ready — add a few products</text>
  <text x="540" y="98" font-size="12" fill="#737373">and you can start selling at the till and online.</text>
  <rect x="936" y="16" width="24" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M941 21 L955 35 M955 21 L941 35" stroke="#737373" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Mini steps -->
  <g>
    <rect x="540" y="120" width="400" height="72" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="556" y="136" width="36" height="36" fill="#f5f5f5" stroke="#e5e5e5"/>
    <rect x="568" y="148" width="12" height="12" fill="none" stroke="#737373" stroke-width="1.4"/>
    <path d="M572 152 l2 2 l4 -4" stroke="#737373" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <text x="602" y="150" font-size="13" font-weight="700" fill="#0a0a0a"><tspan font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#737373">01</tspan>  Pick Single or Group</text>
    <text x="602" y="168" font-size="11" fill="#737373">One-off item → Single. Same brand in sizes → Group,</text>
    <text x="602" y="182" font-size="11" fill="#737373">then add variants.</text>

    <rect x="540" y="200" width="400" height="72" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="556" y="216" width="36" height="36" fill="#f5f5f5" stroke="#e5e5e5"/>
    <rect x="566" y="224" width="16" height="20" rx="2" fill="none" stroke="#737373" stroke-width="1.4"/>
    <path d="M570 234 h8" stroke="#737373" stroke-width="1.2"/>
    <text x="602" y="230" font-size="13" font-weight="700" fill="#0a0a0a"><tspan font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#737373">02</tspan>  Set prices &amp; barcodes</text>
    <text x="602" y="248" font-size="11" fill="#737373">Buying and sell price, scan or type the barcode —</text>
    <text x="602" y="262" font-size="11" fill="#737373">SKU fills itself.</text>

    <rect x="540" y="280" width="400" height="72" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <rect x="556" y="296" width="36" height="36" fill="#f5f5f5" stroke="#e5e5e5"/>
    <rect x="566" y="304" width="16" height="16" fill="none" stroke="#737373" stroke-width="1.4"/>
    <path d="M570 310 l3 3 l5 -6" stroke="#737373" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <text x="602" y="310" font-size="13" font-weight="700" fill="#0a0a0a"><tspan font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#737373">03</tspan>  Add stock &amp; packages</text>
    <text x="602" y="328" font-size="11" fill="#737373">Opening quantity, or trays/crates via</text>
    <text x="602" y="342" font-size="11" fill="#737373">Sell in different units.</text>
  </g>

  <!-- Tip -->
  <rect x="540" y="364" width="400" height="48" rx="8" fill="#f0fdf4" stroke="#bbe7c3"/>
  <text x="556" y="384" font-size="11.5" fill="#166534"><tspan font-weight="700">Tip:</tspan> selling the same brand in several sizes</text>
  <text x="556" y="400" font-size="11.5" fill="#166534">(Coca-Cola → 300 ml, 500 ml, 1 L)? Use a <tspan font-weight="700">Group</tspan>.</text>

  <!-- Footer -->
  <line x1="520" y1="572" x2="960" y2="572" stroke="#e5e5e5"/>
  <rect x="540" y="584" width="400" height="40" rx="8" fill="#28a745"/>
  <path d="M556 602 h14 M563 595 v14" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="586" y="608" font-size="12.5" font-weight="700" fill="#ffffff">Add your first product</text>
  <path d="M916 602 h10 l3 3 l4 -4" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="540" y="630" width="196" height="0" fill="none"/>
  <rect x="540" y="632" width="196" height="0" fill="none"/>
</svg>
