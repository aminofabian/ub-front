<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop: Supplies page -->
  <rect width="960" height="640" fill="#f4f4f5"/>
  <rect x="16" y="16" width="928" height="44" fill="#e8eef5"/>
  <rect x="24" y="26" width="26" height="24" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M32 34 l4 4 l8 -8" stroke="#28a745" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="38" font-size="9" font-weight="700" letter-spacing="1.2" fill="#737373">PURCHASING</text>
  <text x="58" y="52" font-size="14" font-weight="600" fill="#0a0a0a">Supplies</text>
  <text x="116" y="44" font-size="10.5" fill="#737373">· Main branch</text>
  <text x="700" y="44" font-size="11" fill="#737373">AP aging · Pay open · Suppliers</text>
  <rect x="848" y="26" width="84" height="26" fill="#28a745"/>
  <text x="890" y="43" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">+ New supply</text>
  <rect width="960" height="640" fill="rgba(0,0,0,0.32)"/>

  <!-- Drawer -->
  <rect x="330" y="0" width="630" height="640" fill="#ffffff"/>
  <rect x="330" y="0" width="4" height="640" fill="#28a745"/>

  <!-- Header -->
  <rect x="348" y="14" width="92" height="20" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="394" y="28" font-size="9" font-weight="600" letter-spacing="1.2" fill="#0a0a0a" text-anchor="middle">PURCHASING</text>
  <text x="348" y="52" font-size="15" font-weight="600" fill="#0a0a0a">New supply</text>
  <rect x="918" y="16" width="24" height="24" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M923 21 L937 35 M937 21 L923 35" stroke="#737373" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="330" y1="60" x2="960" y2="60" stroke="#e5e5e5"/>

  <!-- Workflow rail -->
  <rect x="342" y="68" width="616" height="30" fill="#eef2f7"/>
  <rect x="342" y="68" width="616" height="30" fill="#28a745" opacity="0.22"/>
  <circle cx="360" cy="83" r="9" fill="#28a745"/>
  <text x="360" y="87" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="374" y="87" font-size="10" font-weight="600" fill="#0a0a0a">Supplier</text>
  <circle cx="448" cy="83" r="9" fill="#28a745"/>
  <text x="448" y="87" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="462" y="87" font-size="10" font-weight="600" fill="#0a0a0a">Branch &amp; date</text>
  <circle cx="570" cy="83" r="9" fill="#28a745"/>
  <text x="570" y="87" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="584" y="87" font-size="10" font-weight="600" fill="#0a0a0a">Lines</text>
  <circle cx="648" cy="83" r="9" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="648" y="87" font-size="8" font-weight="700" fill="#737373" text-anchor="middle">4</text>
  <text x="662" y="87" font-size="10" font-weight="500" fill="#737373">Post</text>
  <text x="920" y="87" font-size="9.5" font-weight="500" fill="#737373" text-anchor="end">Ready to post</text>

  <!-- Context strip -->
  <text x="348" y="124" font-size="12.5" font-weight="700" fill="#0a0a0a">Sunrise Fresh Produce Ltd</text>
  <text x="560" y="124" font-size="11.5" fill="#737373">· Main branch</text>
  <text x="920" y="124" font-size="9.5" font-weight="700" letter-spacing="1" fill="#737373" text-anchor="end">PAYABLE</text>
  <text x="920" y="140" font-size="15" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#0a0a0a" text-anchor="end">KES 12,480</text>
  <rect x="860" y="128" width="52" height="16" fill="#28a745" opacity="0.12" stroke="#28a745" stroke-width="0.8"/>
  <text x="886" y="139" font-size="8" font-weight="700" letter-spacing="0.8" fill="#28a745" text-anchor="middle">READY</text>
  <line x1="348" y1="152" x2="948" y2="152" stroke="#e5e5e5"/>

  <!-- Lines header -->
  <text x="348" y="176" font-size="10.5" font-weight="700" fill="#0a0a0a">LINES</text>
  <rect x="880" y="164" width="68" height="22" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="914" y="179" font-size="10" font-weight="500" fill="#737373" text-anchor="middle">+ Add line</text>

  <!-- Line 1 -->
  <rect x="348" y="194" width="600" height="56" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="360" y="216" font-size="12" font-weight="600" fill="#0a0a0a">Fresh Tomatoes</text>
  <text x="360" y="232" font-size="10" fill="#737373">Linked · supplier SKU TOM-1 · cost KES 120</text>
  <rect x="672" y="202" width="64" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="704" y="221" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">12</text>
  <text x="740" y="216" font-size="9.5" fill="#737373">qty</text>
  <rect x="796" y="202" width="76" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="834" y="221" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">120.00</text>
  <text x="876" y="216" font-size="9.5" fill="#737373">unit cost</text>
  <text x="944" y="222" font-size="11.5" font-weight="700" fill="#0a0a0a" text-anchor="end">1,440</text>

  <!-- Line 2 -->
  <rect x="348" y="254" width="600" height="56" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="360" y="276" font-size="12" font-weight="600" fill="#0a0a0a">Red Onions 1 kg</text>
  <text x="360" y="292" font-size="10" fill="#737373">Linked · supplier SKU ONI-R · cost KES 90</text>
  <rect x="672" y="262" width="64" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="704" y="281" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">6</text>
  <text x="740" y="276" font-size="9.5" fill="#737373">qty</text>
  <rect x="796" y="262" width="76" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="834" y="281" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">90.00</text>
  <text x="876" y="276" font-size="9.5" fill="#737373">unit cost</text>
  <text x="944" y="282" font-size="11.5" font-weight="700" fill="#0a0a0a" text-anchor="end">540</text>

  <!-- Line 3 -->
  <rect x="348" y="314" width="600" height="56" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="360" y="336" font-size="12" font-weight="600" fill="#0a0a0a">Eggs Tray (30)</text>
  <text x="360" y="352" font-size="10" fill="#737373">Linked · supplier SKU EGG-T30 · cost KES 450</text>
  <rect x="672" y="322" width="64" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="704" y="341" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">4</text>
  <text x="740" y="336" font-size="9.5" fill="#737373">qty</text>
  <rect x="796" y="322" width="76" height="30" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="834" y="341" font-size="11.5" font-weight="600" fill="#0a0a0a" text-anchor="middle">450.00</text>
  <text x="876" y="336" font-size="9.5" fill="#737373">unit cost</text>
  <text x="944" y="342" font-size="11.5" font-weight="700" fill="#0a0a0a" text-anchor="end">1,800</text>

  <!-- Summary -->
  <rect x="348" y="382" width="600" height="84" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="362" y="404" font-size="11" fill="#737373">Extras · freight, tax</text>
  <text x="920" y="404" font-size="11" fill="#737373" text-anchor="end">+ KES 8,700</text>
  <line x1="362" y1="416" x2="934" y2="416" stroke="#e5e5e5"/>
  <text x="362" y="442" font-size="12" font-weight="700" fill="#0a0a0a">Subtotal</text>
  <text x="920" y="442" font-size="13" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#0a0a0a" text-anchor="end">KES 12,480</text>

  <!-- Hint -->
  <rect x="348" y="478" width="600" height="40" fill="#f0fdf4" stroke="#bbe7c3"/>
  <path d="M360 494 l3 4 l6 -7" stroke="#28a745" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="376" y="502" font-size="11" fill="#166534">Posting raises stock for every line — no separate stock edit needed.</text>

  <!-- Footer -->
  <line x1="330" y1="600" x2="960" y2="600" stroke="#e5e5e5"/>
  <rect x="768" y="606" width="84" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="810" y="624" font-size="11.5" fill="#0a0a0a" text-anchor="middle">Cancel</text>
  <rect x="860" y="606" width="76" height="28" fill="#28a745"/>
  <text x="898" y="624" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Post</text>
</svg>
