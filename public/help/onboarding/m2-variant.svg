  <text x="472" y="28" font-size="9" font-weight="600" letter-spacing="1.2" fill="#0a0a0a" text-anchor="middle">PARENT GROUP</text>
  <text x="424" y="52" font-size="15" font-weight="600" fill="#0a0a0a">Add variants to Coca-Cola</text>
  <rect x="922" y="16" width="24" height="24" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M927 21 L941 35 M941 21 L927 35" stroke="#737373" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="400" y1="60" x2="960" y2="60" stroke="#e5e5e5"/>

  <!-- Variant row 1 -->
  <rect x="424" y="76" width="512" height="196" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="102" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">VARIANT NAME</text>
  <rect x="424" y="108" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="128" font-size="12.5" font-weight="600" fill="#0a0a0a">300 ml</text>
  <text x="700" y="102" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SELL PRICE · KES</text>
  <rect x="688" y="108" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="128" font-size="12.5" font-weight="600" fill="#0a0a0a">60.00</text>

  <text x="436" y="162" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BUY PRICE · KES</text>
  <rect x="424" y="168" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="188" font-size="12" fill="#0a0a0a">48.00</text>
  <text x="700" y="162" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BARCODE</text>
  <rect x="688" y="168" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="188" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0a0a0a">8992730145612</text>
  <text x="436" y="222" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SKU · AUTO</text>
  <text x="700" y="222" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">OPENING QTY</text>
  <rect x="424" y="228" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="248" font-size="12" fill="#a3a3a3">Auto</text>
  <rect x="688" y="228" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="248" font-size="12" fill="#0a0a0a">12</text>

  <!-- Variant row 2 -->
  <rect x="424" y="288" width="512" height="196" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="314" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">VARIANT NAME</text>
  <rect x="424" y="320" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="340" font-size="12.5" font-weight="600" fill="#0a0a0a">500 ml</text>
  <text x="700" y="314" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SELL PRICE · KES</text>
  <rect x="688" y="320" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="340" font-size="12.5" font-weight="600" fill="#0a0a0a">80.00</text>

  <text x="436" y="374" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BUY PRICE · KES</text>
  <rect x="424" y="380" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="400" font-size="12" fill="#0a0a0a">62.00</text>
  <text x="700" y="374" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">BARCODE</text>
  <rect x="688" y="380" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="400" font-size="11.5" font-family="ui-sans-serif, system-ui, sans-serif" fill="#0a0a0a">8992730145629</text>
  <text x="436" y="434" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SKU · AUTO</text>
  <text x="700" y="434" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">OPENING QTY</text>
  <rect x="424" y="440" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="460" font-size="12" fill="#a3a3a3">Auto</text>
  <rect x="688" y="440" width="248" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="460" font-size="12" fill="#0a0a0a">8</text>

  <!-- Add another variant -->
  <rect x="424" y="500" width="512" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-dasharray="4 3"/>
  <path d="M652 517 h16 M660 509 v16" stroke="#737373" stroke-width="1.4" stroke-linecap="round"/>
  <text x="680" y="521" font-size="11.5" font-weight="500" fill="#0a0a0a">Add another variant</text>

  <!-- Footer -->
  <line x1="400" y1="600" x2="960" y2="600" stroke="#e5e5e5"/>
  <rect x="748" y="606" width="80" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="788" y="624" font-size="11.5" fill="#0a0a0a" text-anchor="middle">Cancel</text>
  <rect x="836" y="606" width="100" height="28" fill="#28a745"/>
  <text x="886" y="624" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Create 2 variants</text>
