<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop: Products page -->
  <rect width="960" height="640" fill="#f4f4f5"/>
  <rect x="16" y="16" width="928" height="48" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="28" y="30" width="64" height="20" rx="4" fill="#f5f5f5" stroke="#e5e5e5"/>
  <rect x="100" y="30" width="64" height="20" rx="4" fill="#f5f5f5" stroke="#e5e5e5"/>
  <rect x="176" y="30" width="64" height="20" rx="4" fill="#f5f5f5" stroke="#e5e5e5"/>
  <rect x="858" y="26" width="74" height="28" rx="4" fill="#28a745"/>
  <text x="895" y="44" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">+ New</text>
  <rect x="16" y="72" width="330" height="552" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <g fill="#f5f5f5">
    <rect x="28" y="86" width="306" height="34" rx="4"/>
    <rect x="28" y="130" width="306" height="34" rx="4"/>
    <rect x="28" y="174" width="306" height="34" rx="4"/>
    <rect x="28" y="218" width="306" height="34" rx="4"/>
  </g>
  <rect x="356" y="72" width="588" height="552" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="356" y="72" width="588" height="40" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="650" y="96" font-size="11" fill="#737373" text-anchor="middle">Products — Catalog</text>
  <rect width="960" height="640" fill="rgba(0,0,0,0.32)"/>

  <!-- Drawer -->
  <rect x="400" y="0" width="560" height="640" fill="#ffffff"/>
  <rect x="400" y="0" width="4" height="640" fill="#28a745"/>

  <!-- Header -->
  <rect x="424" y="14" width="70" height="20" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="459" y="28" font-size="9" font-weight="600" letter-spacing="1.2" fill="#0a0a0a" text-anchor="middle">CATALOG</text>
  <text x="424" y="52" font-size="15" font-weight="600" fill="#0a0a0a">New product group</text>
  <rect x="922" y="16" width="24" height="24" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M927 21 L941 35 M941 21 L927 35" stroke="#737373" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="400" y1="60" x2="960" y2="60" stroke="#e5e5e5"/>

  <!-- Toggle -->
  <rect x="424" y="72" width="256" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="552" y="90" font-size="11" font-weight="600" fill="#737373" text-anchor="middle">Single product</text>
  <rect x="680" y="72" width="256" height="28" fill="#0a0a0a"/>
  <text x="808" y="90" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Group</text>

  <!-- Name -->
  <text x="424" y="126" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">GROUP NAME</text>
  <rect x="424" y="134" width="512" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="154" font-size="13" font-weight="600" fill="#0a0a0a">Coca-Cola</text>

  <!-- Department / Category -->
  <text x="424" y="196" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">DEPARTMENT</text>
  <text x="706" y="196" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">CATEGORY</text>
  <rect x="424" y="204" width="266" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="224" font-size="12" fill="#0a0a0a">Soft drinks</text>
  <path d="M668 214 l8 6 l8 -6" stroke="#737373" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <rect x="706" y="204" width="230" height="32" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="718" y="224" font-size="12" fill="#0a0a0a">Soft drinks</text>
  <path d="M914 214 l8 6 l8 -6" stroke="#737373" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <text x="424" y="260" font-size="11" fill="#737373">Variants under this group inherit its category.</text>

  <!-- Variants placeholder -->
  <rect x="424" y="286" width="512" height="170" fill="#fafafa" stroke="#d4d4d4" stroke-dasharray="5 4"/>
  <rect x="624" y="310" width="112" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M650 324 h60 M680 308 v32" stroke="#737373" stroke-width="1.2" stroke-linecap="round"/>
  <text x="680" y="362" font-size="12" font-weight="600" fill="#0a0a0a" text-anchor="middle">No variants yet</text>
  <text x="680" y="382" font-size="11" fill="#737373" text-anchor="middle">After you create the group, add sizes</text>
  <text x="680" y="398" font-size="11" fill="#737373" text-anchor="middle">here — e.g. 300 ml · 500 ml · 1 L.</text>
  <text x="680" y="438" font-size="10.5" fill="#28a745" text-anchor="middle">Groups are not sold at the till — variants are.</text>

  <!-- Footer -->
  <line x1="400" y1="600" x2="960" y2="600" stroke="#e5e5e5"/>
  <rect x="748" y="606" width="80" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="788" y="624" font-size="11.5" fill="#0a0a0a" text-anchor="middle">Cancel</text>
  <rect x="836" y="606" width="100" height="28" fill="#28a745"/>
  <text x="886" y="624" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Create group</text>
</svg>
