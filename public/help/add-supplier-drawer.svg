<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop: Suppliers page -->
  <rect width="960" height="640" fill="#f4f4f5"/>
  <rect x="16" y="16" width="928" height="48" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="28" y="46" font-size="12" font-weight="600" fill="#0a0a0a">Suppliers</text>
  <text x="96" y="45" font-size="10.5" fill="#737373">Related · Supplies · Products · Categories · Intelligence</text>
  <rect x="810" y="26" width="96" height="28" rx="4" fill="#28a745"/>
  <text x="858" y="44" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">+ New supplier</text>
  <rect x="804" y="20" width="108" height="40" rx="6" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="916" cy="22" r="7" fill="#28a745"/>
  <text x="916" y="26" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="16" y="72" width="330" height="552" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <g fill="#f5f5f5">
    <rect x="28" y="86" width="306" height="34" rx="4"/>
    <rect x="28" y="130" width="306" height="34" rx="4"/>
    <rect x="28" y="174" width="306" height="34" rx="4"/>
  </g>
  <rect x="356" y="72" width="588" height="552" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="356" y="72" width="588" height="40" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="650" y="96" font-size="11" fill="#737373" text-anchor="middle">Suppliers — Directory</text>
  <rect width="960" height="640" fill="rgba(0,0,0,0.32)"/>

  <!-- Drawer -->
  <rect x="400" y="0" width="560" height="640" fill="#ffffff"/>
  <rect x="400" y="0" width="4" height="640" fill="#28a745"/>

  <rect x="424" y="14" width="92" height="20" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="470" y="28" font-size="9" font-weight="600" letter-spacing="1.2" fill="#0a0a0a" text-anchor="middle">PURCHASING</text>
  <text x="424" y="52" font-size="15" font-weight="600" fill="#0a0a0a">New supplier</text>
  <rect x="922" y="16" width="24" height="24" rx="4" fill="#ffffff" stroke="#e5e5e5"/>
  <path d="M927 21 L941 35 M941 21 L927 35" stroke="#737373" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="400" y1="60" x2="960" y2="60" stroke="#e5e5e5"/>

  <!-- Marketplace banner -->
  <rect x="424" y="76" width="512" height="58" fill="#f0fdf9" stroke="#0f766e" stroke-dasharray="5 4"/>
  <rect x="436" y="88" width="26" height="26" fill="#ffffff" stroke="#0f766e"/>
  <path d="M444 98 h10 M449 93 v10" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="472" y="98" font-size="11.5" font-weight="600" fill="#0f3b2e">Browse the marketplace catalog</text>
  <text x="472" y="114" font-size="10.5" fill="#0f766e">Import an existing vendor + their product list, or create a private supplier below.</text>
  <rect x="820" y="88" width="104" height="24" fill="#0f766e"/>
  <text x="872" y="104" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">Browse catalog</text>

  <!-- Section: Identity -->
  <text x="424" y="160" font-size="10.5" font-weight="700" fill="#0a0a0a">IDENTITY &amp; STATUS</text>
  <text x="424" y="174" font-size="10" fill="#737373">How this vendor appears in your directory and records.</text>

  <text x="424" y="200" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">LEGAL / DISPLAY NAME *</text>
  <rect x="424" y="206" width="512" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="227" font-size="13" fill="#0a0a0a">Sunrise Fresh Produce Ltd</text>

  <text x="424" y="260" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">PRIMARY CONTACT PHONE</text>
  <rect x="424" y="266" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="287" font-size="12.5" fill="#0a0a0a">0712 345 678</text>
  <text x="688" y="260" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">PRIMARY CONTACT EMAIL</text>
  <rect x="688" y="266" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="287" font-size="12.5" fill="#0a0a0a">orders@sunrise.co.ke</text>

  <text x="424" y="322" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">VENDOR CODE · OPTIONAL</text>
  <rect x="424" y="328" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="349" font-size="12" fill="#a3a3a3">Optional reference</text>
  <text x="688" y="322" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">SUPPLIER TYPE</text>
  <rect x="688" y="328" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="349" font-size="12" fill="#0a0a0a">distributor</text>

  <line x1="424" y1="384" x2="936" y2="384" stroke="#f0f0f0"/>

  <!-- Section: Commercial -->
  <text x="424" y="412" font-size="10.5" font-weight="700" fill="#0a0a0a">COMMERCIAL &amp; PAYMENTS</text>
  <text x="424" y="426" font-size="10" fill="#737373">Credit, tax, and how you settle invoices with this supplier.</text>

  <text x="424" y="452" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">VAT / TAX ID · HELPS MATCH EXISTING VENDORS</text>
  <rect x="424" y="458" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="479" font-size="12.5" fill="#0a0a0a">A012345678Z</text>
  <text x="688" y="452" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">CREDIT TERMS · DAYS</text>
  <rect x="688" y="458" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="479" font-size="12.5" fill="#0a0a0a">30</text>

  <text x="424" y="514" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">CREDIT LIMIT</text>
  <rect x="424" y="520" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="436" y="541" font-size="12.5" fill="#0a0a0a">100,000.00</text>
  <text x="688" y="514" font-size="9.5" font-weight="600" letter-spacing="1" fill="#737373">PREFERRED PAYMENT METHOD</text>
  <rect x="688" y="520" width="248" height="34" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="700" y="541" font-size="12" fill="#0a0a0a">Bank transfer, card on file…</text>

  <!-- Footer -->
  <line x1="400" y1="600" x2="960" y2="600" stroke="#e5e5e5"/>
  <rect x="748" y="606" width="80" height="28" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="788" y="624" font-size="11.5" fill="#0a0a0a" text-anchor="middle">Cancel</text>
  <rect x="836" y="606" width="100" height="28" fill="#28a745"/>
  <text x="886" y="624" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Save supplier</text>
</svg>
