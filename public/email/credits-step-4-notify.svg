<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" role="img" aria-label="Shop owner gets SMS when customer pays">
  <rect width="560" height="260" fill="#F4F5F4"/>
  <rect x="40" y="40" width="240" height="180" fill="#FFFFFF" stroke="#E8EAE8"/>
  <text x="60" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">ON TAB</text>
  <text x="60" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414">Wanjiru</text>
  <text x="60" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Was owing KES 1,850</text>
  <rect x="60" y="144" width="100" height="24" fill="#ECFDF5" stroke="#99F6E4"/>
  <text x="74" y="161" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f766e">Paid · 0 owed</text>
  <text x="60" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">Updated automatically</text>

  <rect x="320" y="48" width="200" height="164" rx="16" fill="#14201A"/>
  <rect x="336" y="68" width="168" height="120" rx="4" fill="#FFFFFF"/>
  <text x="352" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#141414">SMS</text>
  <text x="352" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#134E4A">Wanjiru paid</text>
  <text x="352" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#134E4A">KES 1,850 on tab.</text>
  <text x="352" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#0f766e">Balance is clear.</text>
  <text x="340" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#9AA39D">Your phone</text>
</svg>
