<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" role="img" aria-label="Customer pays and money arrives with you">
  <rect width="560" height="260" fill="#F4F5F4"/>
  <rect x="40" y="50" width="140" height="160" rx="14" fill="#FFFFFF" stroke="#E8EAE8"/>
  <text x="62" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#141414">Customer</text>
  <text x="62" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Gets PIN prompt</text>
  <text x="62" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">KES 450</text>
  <text x="62" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#9CA3AF">Confirms on phone</text>

  <path d="M200 130 H240" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="198" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#0f766e">instant</text>

  <rect x="260" y="50" width="140" height="160" rx="14" fill="#ECFDF5" stroke="#99F6E4"/>
  <text x="282" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#134E4A">Your till / bank</text>
  <text x="282" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0F766E">Money lands here</text>
  <text x="282" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">+450</text>
  <text x="282" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0F766E">No Kiosk fee</text>

  <rect x="420" y="70" width="100" height="120" fill="#FFFFFF" stroke="#E8EAE8"/>
  <text x="436" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#141414">Kiosk</text>
  <text x="436" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">Sends</text>
  <text x="436" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">prompt</text>
  <text x="436" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#0f766e">0 cut</text>

  <text x="40" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B63">Customer pays ’ prompt on their phone ’ money to your till or bank. Instantly.</text>
</svg>
