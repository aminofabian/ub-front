<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Enter KES amount, quantity auto-calculates">
  <rect width="560" height="320" fill="#F4F5F4"/>
  <text x="40" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141414">Cashier · Scale panel</text>
  <text x="40" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Type the money — litres fill in live</text>

  <!-- Panel card -->
  <rect x="40" y="68" width="340" height="220" fill="#FFFFFF" stroke="#E8EAE8"/>
  <text x="60" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414">Cooking oil</text>
  <text x="60" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">KES 280.00 / litre</text>

  <!-- Twin readouts -->
  <rect x="60" y="132" width="130" height="64" fill="#F8FAF9" stroke="#E5E7EB"/>
  <text x="72" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#6B7280" letter-spacing="1.5">WEIGHT</text>
  <text x="72" y="180" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#0f766e">0.50</text>
  <text x="148" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280">L</text>

  <!-- live arrow -->
  <text x="198" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0f766e">?</text>
  <text x="194" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#6B7280">LIVE</text>

  <!-- Spend side highlighted -->
  <rect x="230" y="132" width="130" height="64" fill="#ECFDF5" stroke="#0f766e" stroke-width="2"/>
  <text x="242" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0f766e" letter-spacing="1.5">SPEND</text>
  <text x="242" y="180" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#141414">140</text>
  <text x="310" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f766e">KES</text>

  <!-- Input hint -->
  <rect x="60" y="212" width="300" height="52" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="76" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E">You type: KES 140</text>
  <text x="76" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#78350F">Kiosk fills: 0.50 L  ·  stock 20 ? 19.5 L</text>

  <!-- Side callout -->
  <rect x="400" y="88" width="130" height="180" fill="#ECFDF5" stroke="#99F6E4"/>
  <text x="418" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#134E4A">Auto maths</text>
  <text x="418" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e">140 ÷ 280</text>
  <text x="418" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">= 0.5 L</text>
  <text x="418" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">Line total</text>
  <text x="418" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414">KES 140</text>
  <text x="418" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0F766E">Exact charge</text>
</svg>
