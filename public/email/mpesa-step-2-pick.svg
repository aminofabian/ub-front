  <text x="40" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Choose a till, paybill, or bank. Well send KES 1 so you know it works.</text>

  <rect x="40" y="78" width="480" height="64" fill="#FFFFFF" stroke="#0f766e" stroke-width="2"/>
  <circle cx="68" cy="110" r="8" fill="#0f766e"/>
  <circle cx="68" cy="110" r="3" fill="#FFFFFF"/>
  <rect x="92" y="94" width="32" height="32" rx="8" fill="#F3F4F6"/>
  <text x="136" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414">Till number</text>
  <text x="136" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">Lipa Na M-Pesa Buy Goods  money arrives when they enter PIN</text>

  <rect x="40" y="154" width="480" height="64" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="68" cy="186" r="8" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="92" y="170" width="32" height="32" rx="8" fill="#F3F4F6"/>
  <text x="136" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414">Paybill</text>
  <text x="136" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">Business number + account number</text>

  <rect x="40" y="230" width="480" height="64" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="68" cy="262" r="8" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="92" y="246" width="32" height="32" rx="8" fill="#F3F4F6"/>
  <text x="136" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414">Bank account</text>
  <text x="136" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">Equity, KCB, NCBA, and other banks</text>
