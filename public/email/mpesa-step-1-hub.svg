<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="Payment method card on Business">
  <rect width="560" height="280" fill="#F4F5F4"/>
  <rect x="40" y="36" width="480" height="208" fill="#FFFFFF" stroke="#E8EAE8" stroke-width="1"/>
  <rect x="40" y="36" width="4" height="208" fill="#0f766e"/>
  <rect x="64" y="60" width="44" height="44" fill="#ECFDF5" stroke="#99F6E4" stroke-width="1"/>
  <rect x="76" y="72" width="20" height="28" rx="2" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="124" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="0.08em">PAYMENT METHOD</text>
  <rect x="250" y="60" width="64" height="16" fill="#ECFDF5" stroke="#99F6E4"/>
  <text x="258" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0f766e">REQUIRED</text>
  <text x="124" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">Set where customers pay</text>
  <text x="124" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Add your till, paybill, or bank. Checkout sends M-Pesa here.</text>
  <rect x="124" y="144" width="44" height="22" fill="#FAFAF8" stroke="#E5E7EB"/>
  <text x="132" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#141414">Till</text>
  <rect x="174" y="144" width="58" height="22" fill="#FAFAF8" stroke="#E5E7EB"/>
  <text x="182" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#141414">Paybill</text>
  <rect x="238" y="144" width="48" height="22" fill="#FAFAF8" stroke="#E5E7EB"/>
  <text x="246" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#141414">Bank</text>
  <rect x="400" y="72" width="96" height="36" fill="#0f766e"/>
  <text x="418" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Add method</text>
  <text x="64" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">Business ’ Payment method</text>
</svg>
