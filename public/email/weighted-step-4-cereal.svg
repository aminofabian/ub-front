<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Cereals: enter amount, kg auto-calculates">
  <rect width="560" height="300" fill="#F4F5F4"/>
  <text x="40" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141414">Same scale · cereals in kg</text>
  <text x="40" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Enter the shillings — kilos appear automatically</text>

  <rect x="40" y="72" width="230" height="190" fill="#FFFFFF" stroke="#E8EAE8"/>
  <text x="60" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414">Rice (loose)</text>
  <text x="60" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">Stocked as 20 kg · KES 100 / kg</text>
  <rect x="60" y="138" width="48" height="28" fill="#ECFDF5" stroke="#0f766e"/>
  <line x1="84" y1="146" x2="84" y2="154" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="74" y1="154" x2="94" y2="154" stroke="#0f766e" stroke-width="1.5"/>
  <text x="120" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f766e">Scale on</text>
  <text x="60" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">You type</text>
  <text x="60" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">KES 250</text>
  <text x="60" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e">? auto 2.50 kg · stock 17.5 kg</text>

  <rect x="290" y="72" width="230" height="190" fill="#FFFFFF" stroke="#E8EAE8"/>
  <text x="310" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#141414">Beans (loose)</text>
  <text x="310" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">Stocked as 20 kg · KES 160 / kg</text>
  <rect x="310" y="138" width="48" height="28" fill="#ECFDF5" stroke="#0f766e"/>
  <line x1="334" y1="146" x2="334" y2="154" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="324" y1="154" x2="344" y2="154" stroke="#0f766e" stroke-width="1.5"/>
  <text x="370" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f766e">Scale on</text>
  <text x="310" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">You type</text>
  <text x="310" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">KES 200</text>
  <text x="310" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e">? auto 1.25 kg · stock 18.75 kg</text>

  <text x="40" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B63">Oil = litres · Cereals / sugar = kg · Same scale · Same spend ? qty flow</text>
</svg>
