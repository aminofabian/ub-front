<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="Stock 20 litres of cooking oil">
  <rect width="560" height="280" fill="#F4F5F4"/>
  <rect x="40" y="28" width="320" height="224" fill="#FFFFFF" stroke="#E8EAE8"/>
  <text x="60" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">PRODUCT · STOCK</text>
  <text x="60" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#141414">Cooking oil</text>
  <text x="60" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">On-hand quantity</text>
  <rect x="60" y="128" width="120" height="40" fill="#FFFFFF" stroke="#0f766e" stroke-width="2"/>
  <text x="78" y="154" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#141414">20</text>
  <rect x="190" y="128" width="80" height="40" fill="#ECFDF5" stroke="#99F6E4"/>
  <text x="208" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">litres</text>
