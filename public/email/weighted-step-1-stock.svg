  <text x="60" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Same idea for rice: 20 kg</text>

  <rect x="390" y="56" width="130" height="170" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="418" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400E">20 L</text>
  <text x="408" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#B45309">Cooking oil</text>
  <text x="412" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#B45309">jerrycan</text>
  <text x="400" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#92400E">Full stock in</text>
