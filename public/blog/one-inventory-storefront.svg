<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Same product, same number — counter and web</text>

  <!-- ============ LEFT: the counter ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="16" y="82" width="440" height="22" fill="#15803d"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">At the counter · 09:12</text>

  <!-- till cart -->
  <rect x="40" y="130" width="392" height="210" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="60" y="158" font-size="11.5" font-weight="700" fill="#374151">Sunbest Cooking Oil 1 L</text>
  <text x="60" y="176" font-size="11" fill="#6b7280">1 × KES 520.00</text>
  <text x="408" y="176" font-size="12" font-weight="700" fill="#1F2937" text-anchor="end">520.00</text>
  <line x1="60" y1="190" x2="408" y2="190" stroke="#e5e7eb"/>
  <text x="60" y="218" font-size="13" font-weight="800" fill="#1F2937">Total</text>
  <text x="408" y="218" font-size="16" font-weight="800" fill="#15803d" text-anchor="end">KES 520.00</text>
  <rect x="60" y="240" width="160" height="40" rx="8" fill="#28a745"/>
  <text x="140" y="265" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Charge M-Pesa</text>
  <text x="408" y="258" font-size="10" fill="#6b7280" text-anchor="end">Paid · 09:13</text>
  <rect x="220" y="296" width="188" height="28" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="314" y="315" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Stock: 24 → 23 ✓</text>

  <!-- stock strip -->
  <rect x="40" y="366" width="392" height="66" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="392" font-size="11" font-weight="700" fill="#1F2937">One shared count, live in both places</text>
  <text x="60" y="410" font-size="10.5" fill="#6b7280">The web shop sees 23 the instant this sale closes —</text>
  <text x="60" y="426" font-size="10.5" fill="#6b7280">no sync job, no manual update, no wait.</text>

  <text x="236" y="474" font-size="10.5" fill="#6b7280" text-anchor="middle">Same number the storefront shows on the right ↓</text>
  <path d="M236 470 L236 452" stroke="#A8842C" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#dn)"/>
  <defs>
    <marker id="dn" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 6 L4 0 L8 6 Z" fill="#A8842C"/>
    </marker>
  </defs>

  <!-- ============ RIGHT: the storefront ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#1F2937"/>
  <rect x="504" y="82" width="440" height="22" fill="#1F2937"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">On the web · 09:13, same second</text>

  <!-- product card -->
  <rect x="548" y="130" width="352" height="180" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="568" y="150" width="96" height="96" rx="10" fill="#fff7ed"/>
  <text x="616" y="208" font-size="34" text-anchor="middle">🥫</text>
  <text x="684" y="180" font-size="14" font-weight="700" fill="#1F2937">Sunbest Cooking Oil 1 L</text>
  <text x="684" y="200" font-size="12" fill="#6b7280">Grocery · Cooking oils</text>
  <text x="684" y="226" font-size="16" font-weight="800" fill="#15803d">KES 520.00</text>
  <rect x="684" y="244" width="110" height="22" rx="11" fill="#f0fdf4"/>
  <circle cx="698" cy="255" r="4" fill="#28a745"/>
  <text x="710" y="259" font-size="9.5" font-weight="600" fill="#15803d">In stock · 23</text>
  <rect x="800" y="244" width="76" height="22" rx="11" fill="#fef2f2"/>
  <text x="838" y="259" font-size="9.5" font-weight="600" fill="#b91c1c" text-anchor="middle">was 24</text>
  <rect x="568" y="262" width="308" height="30" rx="8" fill="#28a745"/>
  <text x="722" y="282" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Add to basket</text>

  <!-- live badge -->
  <rect x="548" y="330" width="352" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="572" cy="363" r="8" fill="#28a745"/>
  <text x="588" y="356" font-size="11" font-weight="700" fill="#15803d">Live stock, straight from the till</text>
  <text x="588" y="374" font-size="10.5" fill="#374151">What the shelf shows is what the website shows —</text>
  <text x="588" y="390" font-size="10.5" fill="#374151">a customer can't order what you just sold.</text>

  <!-- web order card -->
  <rect x="548" y="416" width="352" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="568" y="442" font-size="11.5" font-weight="700" fill="#1F2937">Web order for pickup, 14:30</text>
  <g font-size="10.5" fill="#374151">
    <text x="568" y="464">· Sunbest Oil 1 L × 1 → stock 23 → 22</text>
    <text x="568" y="484">· Fulfils from the same count as the counter</text>
    <text x="568" y="504" fill="#6b7280">One number. No double-counting. No surprises.</text>
  </g>
</svg>
