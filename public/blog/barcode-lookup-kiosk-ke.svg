<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The Kiosk.ke barcode lookup tool</text>

  <!-- URL pill -->
  <rect x="300" y="52" width="360" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="324" cy="69" r="5" fill="#28a745"/>
  <text x="336" y="74" font-size="12.5" font-weight="600" fill="#1F2937">kiosk.ke/barcode</text>

  <!-- ============ LEFT: search flow ============ -->
  <rect x="16" y="108" width="440" height="428" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="40" y="142" font-size="13" font-weight="700" fill="#1F2937">1 · Type or scan</text>

  <!-- Search bar -->
  <rect x="40" y="158" width="392" height="56" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="66" cy="186" r="10" fill="#f3f4f6"/>
  <path d="M60 180 l14 14 M71 173 a8 8 0 1 1 -2 14" stroke="#6b7280" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="84" y="190" font-size="12.5" fill="#9ca3af">Enter a barcode or product name…</text>
  <rect x="334" y="170" width="80" height="32" rx="8" fill="#A8842C"/>
  <text x="374" y="191" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Search</text>

  <text x="40" y="252" font-size="13" font-weight="700" fill="#1F2937">2 · The auto-detection</text>
  <rect x="40" y="268" width="392" height="56" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="60" y="290" font-size="11.5" font-weight="700" fill="#15803d">6168901234567 → digits only</text>
  <text x="60" y="308" font-size="10.5" fill="#374151">Kiosk.ke treats it as a barcode and looks it up.</text>
  <rect x="40" y="334" width="392" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="356" font-size="11.5" font-weight="700" fill="#1F2937">"sunbest cooking oil" → words</text>
  <text x="60" y="374" font-size="10.5" fill="#6b7280">Kiosk.ke treats it as a name and searches products.</text>

  <text x="40" y="428" font-size="13" font-weight="700" fill="#1F2937">3 · The result</text>
  <rect x="40" y="444" width="392" height="72" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="56" y="460" width="40" height="40" rx="8" fill="#fff7ed"/>
  <text x="76" y="486" font-size="14" text-anchor="middle">🥫</text>
  <text x="108" y="476" font-size="12" font-weight="700" fill="#1F2937">Sunbest Cooking Oil 1 L</text>
  <text x="108" y="494" font-size="10" fill="#6b7280">KES 520 · In stock at 3 stores</text>
  <rect x="356" y="466" width="60" height="24" rx="6" fill="#28a745"/>
  <text x="386" y="483" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Copy</text>

  <!-- ============ RIGHT: who it's for ============ -->
  <rect x="504" y="108" width="440" height="428" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="528" y="142" font-size="13" font-weight="700" fill="#1F2937">Who it's built for</text>

  <rect x="528" y="158" width="392" height="64" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="548" y="180" font-size="11.5" font-weight="700" fill="#1F2937">🛒 Shoppers checking a price</text>
  <text x="548" y="200" font-size="10.5" fill="#6b7280">Scan before you buy — see typical prices and stock.</text>

  <rect x="528" y="232" width="392" height="64" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="548" y="254" font-size="11.5" font-weight="700" fill="#1F2937">🏪 Shopkeepers building a catalog</text>
  <text x="548" y="274" font-size="10.5" fill="#6b7280">Match a barcode to a product name in seconds — no typing.</text>

  <rect x="528" y="306" width="392" height="64" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="548" y="328" font-size="11.5" font-weight="700" fill="#1F2937">📦 Suppliers verifying an order</text>
  <text x="548" y="348" font-size="10.5" fill="#6b7280">Confirm you're receiving the exact item, not a lookalike.</text>

  <rect x="528" y="380" width="392" height="64" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="548" y="402" font-size="11.5" font-weight="700" fill="#1F2937">🧾 Accountants reconciling stock</text>
  <text x="548" y="422" font-size="10.5" fill="#6b7280">Trace a sale back to its barcode when the numbers don't add up.</text>

  <rect x="528" y="464" width="392" height="48" rx="10" fill="#fefce8" stroke="#fde68a"/>
  <text x="724" y="484" font-size="11" font-weight="700" fill="#A8842C" text-anchor="middle">Free to use · no sign-up · works on any phone</text>
  <text x="724" y="502" font-size="10" fill="#6b7280" text-anchor="middle">The same lookup runs inside Kiosk POS at your counter.</text>
</svg>
