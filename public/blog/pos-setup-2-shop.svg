<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Step 2 · Claim your shop &amp; storefront</text>

  <!-- Step badge -->
  <circle cx="42" cy="34" r="16" fill="#A8842C"/>
  <text x="42" y="39" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

  <!-- ============ LEFT: Business setup form ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="40" y="92" font-size="13" font-weight="700" fill="#1F2937">Tell us about your business</text>
  <text x="40" y="110" font-size="11" fill="#6b7280">This powers your storefront and your invoices.</text>

  <text x="40" y="142" font-size="9" font-weight="700" letter-spacing="1.2" fill="#6b7280">BUSINESS NAME</text>
  <rect x="40" y="150" width="392" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="52" y="173" font-size="12.5" fill="#1F2937">Wanjiku's Mini-Mart</text>

  <text x="40" y="206" font-size="9" font-weight="700" letter-spacing="1.2" fill="#6b7280">TYPE OF BUSINESS</text>
  <rect x="40" y="214" width="392" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="52" y="237" font-size="12" fill="#1F2937">Retail shop / grocery</text>
  <path d="M412 230 l8 6 l8 -6" stroke="#6b7280" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <text x="40" y="270" font-size="9" font-weight="700" letter-spacing="1.2" fill="#6b7280">YOUR STOREFRONT ADDRESS</text>
  <rect x="40" y="278" width="120" height="36" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="52" y="301" font-size="12" fill="#6b7280">wanjiku.</text>
  <rect x="160" y="278" width="272" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="172" y="301" font-size="12" fill="#1F2937">minimart.kiosk.ke</text>
  <text x="40" y="334" font-size="10" fill="#15803d">✓ Available — yours to claim</text>

  <text x="40" y="366" font-size="9" font-weight="700" letter-spacing="1.2" fill="#6b7280">M-PESA TILL / PAYBILL</text>
  <rect x="40" y="374" width="392" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="52" y="397" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1F2937">5225 33 · WANJIKU MINI-MART</text>

  <rect x="40" y="434" width="392" height="42" rx="10" fill="#28a745"/>
  <text x="236" y="460" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Create shop</text>

  <!-- ============ RIGHT: Welcome drawer ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="504" y="82" width="440" height="22" fill="#15803d"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">Welcome to your shop</text>

  <!-- Storefront URL pill -->
  <rect x="532" y="128" width="384" height="54" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="556" y="150" font-size="10.5" font-weight="700" letter-spacing="1" fill="#15803d">YOUR STOREFRONT</text>
  <text x="556" y="170" font-size="13" font-weight="700" fill="#1F2937">wanjiku.minimart.kiosk.ke</text>
  <rect x="800" y="138" width="96" height="26" rx="13" fill="#28a745"/>
  <circle cx="812" cy="151" r="4" fill="#ffffff"/>
  <text x="822" y="155" font-size="10" font-weight="700" fill="#ffffff">LIVE</text>

  <!-- Next steps mini-list -->
  <text x="556" y="222" font-size="11.5" font-weight="700" fill="#1F2937">Your shop is ready. Next up:</text>
  <g font-size="11" fill="#374151">
    <circle cx="566" cy="248" r="10" fill="#f3f4f6"/>
    <text x="566" y="253" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">1</text>
    <text x="588" y="253" font-size="11">Add your products — search, scan, or type</text>
    <circle cx="566" cy="278" r="10" fill="#f3f4f6"/>
    <text x="566" y="283" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">2</text>
    <text x="588" y="283" font-size="11">Set buying &amp; sell prices and opening stock</text>
    <circle cx="566" cy="308" r="10" fill="#f3f4f6"/>
    <text x="566" y="313" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">3</text>
    <text x="588" y="313" font-size="11">Ring up your first sale at the till</text>
  </g>

  <!-- Storefront preview -->
  <rect x="532" y="336" width="384" height="170" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="556" y="360" font-size="11" font-weight="700" fill="#1F2937">Preview: what customers will see</text>
  <rect x="556" y="374" width="104" height="78" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="562" y="380" width="92" height="38" rx="6" fill="#f5f5f5"/>
  <text x="608" y="401" font-size="8.5" fill="#a3a3a3" text-anchor="middle">🥫</text>
  <text x="608" y="424" font-size="8" fill="#374151" text-anchor="middle">Sunbest Oil 1L</text>
  <text x="608" y="438" font-size="8.5" font-weight="800" fill="#15803d" text-anchor="middle">KES 520</text>
  <rect x="668" y="374" width="104" height="78" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="674" y="380" width="92" height="38" rx="6" fill="#f5f5f5"/>
  <text x="720" y="401" font-size="8.5" fill="#a3a3a3" text-anchor="middle">🍚</text>
  <text x="720" y="424" font-size="8" fill="#374151" text-anchor="middle">Pishori Rice 2kg</text>
  <text x="720" y="438" font-size="8.5" font-weight="800" fill="#15803d" text-anchor="middle">KES 460</text>
  <rect x="780" y="374" width="112" height="78" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="786" y="380" width="100" height="38" rx="6" fill="#f5f5f5"/>
  <text x="836" y="401" font-size="8.5" fill="#a3a3a3" text-anchor="middle">🧼</text>
  <text x="836" y="424" font-size="8" fill="#374151" text-anchor="middle">Omo Detergent</text>
  <text x="836" y="438" font-size="8.5" font-weight="800" fill="#15803d" text-anchor="middle">KES 180</text>
  <text x="556" y="476" font-size="10" fill="#6b7280">Products you add in Step 3 appear here automatically.</text>
  <rect x="556" y="488" width="336" height="10" rx="5" fill="#f3f4f6"/>
</svg>
