<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Know before you pay</text>

  <!-- ============ LEFT: the old way ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#374151"/>
  <rect x="16" y="82" width="440" height="22" fill="#374151"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">The old way · guessing</text>

  <!-- shelf -->
  <rect x="40" y="130" width="392" height="200" rx="12" fill="#f3f4f6" stroke="#e5e7eb"/>
  <line x1="40" y1="230" x2="432" y2="230" stroke="#e5e7eb"/>
  <rect x="56" y="150" width="104" height="68" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="108" y="176" font-size="9" fill="#a3a3a3" text-anchor="middle">🥫</text>
  <text x="108" y="194" font-size="8" fill="#6b7280" text-anchor="middle">Oil 1L</text>
  <text x="108" y="208" font-size="7.5" fill="#b91c1c" text-anchor="middle">KES 560 ?</text>
  <rect x="172" y="150" width="104" height="68" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="224" y="176" font-size="9" fill="#a3a3a3" text-anchor="middle">🥫</text>
  <text x="224" y="194" font-size="8" fill="#6b7280" text-anchor="middle">Oil 1L</text>
  <text x="224" y="208" font-size="7.5" fill="#b91c1c" text-anchor="middle">KES 545 ?</text>
  <rect x="288" y="150" width="104" height="68" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="340" y="176" font-size="9" fill="#a3a3a3" text-anchor="middle">🥫</text>
  <text x="340" y="194" font-size="8" fill="#6b7280" text-anchor="middle">Oil 1L</text>
  <text x="340" y="208" font-size="7.5" fill="#b91c1c" text-anchor="middle">KES 520 ✓</text>

  <!-- confusion card -->
  <rect x="40" y="352" width="392" height="76" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="378" font-size="11.5" font-weight="700" fill="#b91c1c">Three shops, three prices — which is fair?</text>
  <text x="60" y="398" font-size="10.5" fill="#7f1d1d">Same bottle, same look, different numbers.</text>
  <text x="60" y="416" font-size="10.5" fill="#7f1d1d">Without a lookup you pay whatever the sticker says.</text>

  <text x="236" y="468" font-size="11.5" fill="#6b7280" text-anchor="middle">You can't compare what you can't identify.</text>

  <!-- ============ RIGHT: the barcode way ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="504" y="82" width="440" height="22" fill="#15803d"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">The barcode way · knowing</text>

  <!-- scan -->
  <rect x="528" y="130" width="392" height="150" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="552" y="150" width="90" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <g stroke="#1F2937" stroke-width="1.8">
    <line x1="562" y1="162" x2="562" y2="198"/><line x1="567" y1="162" x2="567" y2="198"/>
    <line x1="570" y1="162" x2="570" y2="198"/><line x1="577" y1="162" x2="577" y2="198"/>
    <line x1="580" y1="162" x2="580" y2="198"/><line x1="587" y1="162" x2="587" y2="198"/>
    <line x1="590" y1="162" x2="590" y2="198"/><line x1="597" y1="162" x2="597" y2="198"/>
    <line x1="602" y1="162" x2="602" y2="198"/><line x1="609" y1="162" x2="609" y2="198"/>
    <line x1="614" y1="162" x2="614" y2="198"/><line x1="621" y1="162" x2="621" y2="198"/>
    <line x1="626" y1="162" x2="626" y2="198"/><line x1="633" y1="162" x2="633" y2="198"/>
  </g>
  <text x="597" y="212" font-size="7.5" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6168901234567</text>

  <path d="M648 190 L700 190" stroke="#28a745" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="716" cy="190" r="14" fill="#28a745"/>
  <path d="M709 190 l5 5 l10 -11" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="744" y="176" font-size="11.5" font-weight="700" fill="#15803d">Sunbest Cooking Oil 1 L</text>
  <text x="744" y="196" font-size="10.5" fill="#374151">Typical price: KES 520 · In stock</text>
  <text x="744" y="212" font-size="10" fill="#6b7280">Found across 3 Kiosk stores</text>

  <!-- comparison list -->
  <rect x="528" y="300" width="392" height="160" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="552" y="326" font-size="11.5" font-weight="700" fill="#1F2937">Same barcode, honest comparison</text>
  <g font-size="10.5" fill="#374151">
    <rect x="552" y="340" width="344" height="30" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="568" y="360">Store A — listed at</text>
    <text x="880" y="360" font-weight="700" fill="#b91c1c" text-anchor="end">KES 560</text>
    <rect x="552" y="378" width="344" height="30" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="568" y="398">Store B — listed at</text>
    <text x="880" y="398" font-weight="700" fill="#b45309" text-anchor="end">KES 545</text>
    <rect x="552" y="416" width="344" height="30" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="568" y="436" font-weight="600" fill="#15803d">Store C — listed at</text>
    <text x="880" y="436" font-weight="800" fill="#15803d" text-anchor="end">KES 520 ✓</text>
  </g>

  <rect x="528" y="480" width="392" height="32" rx="8" fill="#15803d"/>
  <text x="724" y="501" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Know the fair price before your money leaves your pocket</text>
</svg>
