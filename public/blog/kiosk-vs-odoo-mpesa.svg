<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">How M-Pesa reaches the till</text>

  <!-- Center VS badge -->
  <circle cx="480" cy="300" r="30" fill="#A8842C"/>
  <text x="480" y="307" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">VS</text>

  <!-- ============ LEFT PANEL: Kiosk.ke — native STK ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="16" y="82" width="440" height="22" fill="#15803d"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">Kiosk.ke till — M-Pesa built in</text>

  <!-- Till window -->
  <rect x="40" y="124" width="392" height="268" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="40" y="124" width="392" height="34" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
  <circle cx="60" cy="141" r="5" fill="#ef4444"/><circle cx="76" cy="141" r="5" fill="#f59e0b"/><circle cx="92" cy="141" r="5" fill="#22c55e"/>
  <text x="276" y="146" font-size="11" fill="#6b7280" text-anchor="middle">Cashier · Kiosk POS</text>

  <!-- Cart -->
  <text x="58" y="188" font-size="11" font-weight="700" fill="#374151">Sunbest Cooking Oil 1 L</text>
  <text x="58" y="205" font-size="11" fill="#6b7280">2 × KES 520.00</text>
  <text x="398" y="205" font-size="12" font-weight="700" fill="#1F2937" text-anchor="end">1,040.00</text>
  <line x1="58" y1="218" x2="414" y2="218" stroke="#e5e7eb"/>
  <text x="58" y="240" font-size="11.5" font-weight="700" fill="#1F2937">Total</text>
  <text x="398" y="240" font-size="14" font-weight="800" fill="#15803d" text-anchor="end">KES 1,040.00</text>

  <!-- M-Pesa chip -->
  <rect x="58" y="256" width="122" height="34" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <circle cx="78" cy="273" r="10" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1.2"/>
  <path d="M71 273 h14 M78 266 v14" stroke="#a3a3a3" stroke-width="1" fill="none"/>
  <text x="140" y="271" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">M-PESA</text>
  <text x="140" y="284" font-size="8.5" fill="#6b7280" text-anchor="middle">BUY GOODS</text>

  <!-- STK sent notification -->
  <rect x="196" y="256" width="236" height="34" rx="8" fill="#ecfdf5" stroke="#28a745"/>
  <circle cx="216" cy="273" r="9" fill="#28a745"/>
  <path d="M211 273 l3.5 3.5 l7 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="234" y="270" font-size="10.5" font-weight="700" fill="#15803d">STK Push sent to 07XX XXX 214</text>
  <text x="234" y="283" font-size="9.5" fill="#6b7280">Waiting for customer PIN…</text>

  <!-- Phone mock -->
  <rect x="96" y="306" width="120" height="72" rx="12" fill="#0a0a0a"/>
  <rect x="102" y="312" width="108" height="60" rx="8" fill="#ffffff"/>
  <text x="156" y="332" font-size="9" font-weight="700" fill="#1F2937" text-anchor="middle">M-PESA</text>
  <text x="156" y="346" font-size="8.5" fill="#374151" text-anchor="middle">Confirm payment of</text>
  <text x="156" y="358" font-size="11" font-weight="800" fill="#15803d" text-anchor="middle">KES 1,040.00</text>
  <text x="156" y="370" font-size="7.5" fill="#9ca3af" text-anchor="middle">to KIOSK KE · 1-Click</text>
  <rect x="120" y="326" width="20" height="4" rx="2" fill="#0a0a0a"/>

  <!-- Left footer -->
  <text x="236" y="424" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">✓ Till auto-credits on confirmation</text>
  <text x="236" y="444" font-size="11.5" fill="#6b7280" text-anchor="middle">No plugin to install · no gateway to configure</text>
  <text x="236" y="460" font-size="11.5" fill="#6b7280" text-anchor="middle">No API keys · no sandbox · no monthly payment fee</text>
  <text x="236" y="504" font-size="12.5" fill="#6b7280" text-anchor="middle">Works out of the box from the first till ring 🔔</text>

  <!-- ============ RIGHT PANEL: Odoo ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#374151"/>
  <rect x="504" y="82" width="440" height="22" fill="#374151"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">Odoo — payments are your problem</text>

  <!-- Module / plugin card -->
  <rect x="528" y="124" width="392" height="268" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="528" y="124" width="392" height="34" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="724" y="146" font-size="11" fill="#6b7280" text-anchor="middle">Apps · Install payment provider</text>

  <rect x="548" y="176" width="352" height="46" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="572" cy="199" r="11" fill="#fef2f2"/>
  <path d="M567 194 l10 10 M577 194 l-10 10" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="592" y="194" font-size="12" font-weight="700" fill="#1F2937">M-Pesa payment module</text>
  <text x="592" y="210" font-size="10.5" fill="#b91c1c">Not installed · requires a 3rd-party community app</text>

  <rect x="548" y="234" width="352" height="46" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="572" cy="257" r="11" fill="#fef2f2"/>
  <path d="M567 252 l10 10 M577 252 l-10 10" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="592" y="252" font-size="12" font-weight="700" fill="#1F2937">Payment gateway credentials</text>
  <text x="592" y="268" font-size="10.5" fill="#b91c1c">Consumer key, secret, passkey, shortcode…</text>

  <rect x="548" y="292" width="352" height="46" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="572" cy="315" r="11" fill="#fef2f2"/>
  <path d="M567 310 l10 10 M577 310 l-10 10" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="592" y="310" font-size="12" font-weight="700" fill="#1F2937">Sandbox &amp; test mode</text>
  <text x="592" y="326" font-size="10.5" fill="#b91c1c">Every shopkeeper now doubles as an integration engineer</text>

  <rect x="548" y="350" width="352" height="26" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="724" y="367" font-size="10.5" fill="#9ca3af" text-anchor="middle">+ monthly app subscription to keep it working</text>

  <!-- Right footer -->
  <text x="724" y="424" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Payments are bolted on, not built in</text>
  <text x="724" y="444" font-size="11.5" fill="#6b7280" text-anchor="middle">Every plugin is another moving part</text>
  <text x="724" y="460" font-size="11.5" fill="#6b7280" text-anchor="middle">Another bill, another thing that breaks</text>
  <text x="724" y="504" font-size="12.5" fill="#9ca3af" text-anchor="middle">…and another week before it rings at all</text>
</svg>
