<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The STK Push flow — one tap, auto-credited</text>

  <!-- ============ LEFT: the till ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="16" y="82" width="440" height="22" fill="#15803d"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">1 · Ring up at the till</text>

  <!-- cart -->
  <rect x="40" y="130" width="392" height="200" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="60" y="158" font-size="11.5" font-weight="700" fill="#374151">Sunbest Cooking Oil 1 L</text>
  <text x="60" y="176" font-size="11" fill="#6b7280">2 × KES 520.00</text>
  <text x="408" y="176" font-size="12" font-weight="700" fill="#1F2937" text-anchor="end">1,040.00</text>
  <line x1="60" y1="190" x2="408" y2="190" stroke="#e5e7eb"/>
  <text x="60" y="218" font-size="11.5" font-weight="700" fill="#374151">Pishori Rice 2 kg</text>
  <text x="60" y="236" font-size="11" fill="#6b7280">1 × KES 460.00</text>
  <text x="408" y="236" font-size="12" font-weight="700" fill="#1F2937" text-anchor="end">460.00</text>
  <line x1="60" y1="250" x2="408" y2="250" stroke="#e5e7eb"/>
  <text x="60" y="282" font-size="13" font-weight="800" fill="#1F2937">Total</text>
  <text x="408" y="282" font-size="16" font-weight="800" fill="#15803d" text-anchor="end">KES 1,500.00</text>

  <!-- M-Pesa button -->
  <rect x="60" y="306" width="180" height="48" rx="10" fill="#28a745"/>
  <circle cx="80" cy="330" r="10" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1"/>
  <path d="M74 330 h12 M80 324 v12" stroke="#a3a3a3" stroke-width="1.1" fill="none"/>
  <text x="100" y="328" font-size="12.5" font-weight="700" fill="#ffffff">M-PESA</text>
  <text x="100" y="344" font-size="9.5" fill="#d1fae5">STK Push · 1 tap</text>

  <!-- flow arrow -->
  <path d="M470 280 C 540 280, 560 280, 630 280" stroke="#A8842C" stroke-width="3.5" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#A8842C"/>
    </marker>
  </defs>
  <text x="550" y="270" font-size="10.5" font-weight="700" fill="#A8842C" text-anchor="middle">STK sent</text>

  <!-- ============ RIGHT: customer phone ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#1F2937"/>
  <rect x="504" y="82" width="440" height="22" fill="#1F2937"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">2 · Customer confirms on their phone</text>

  <!-- phone -->
  <rect x="560" y="130" width="170" height="300" rx="20" fill="#0a0a0a"/>
  <rect x="568" y="138" width="154" height="284" rx="14" fill="#ffffff"/>
  <rect x="568" y="138" width="154" height="30" rx="14" fill="#f3f4f6"/>
  <text x="645" y="158" font-size="9.5" font-weight="700" fill="#1F2937" text-anchor="middle">M-PESA</text>
  <circle cx="592" cy="200" r="16" fill="#f0fdf4" stroke="#28a745"/>
  <path d="M583 200 l6 6 l13 -14" stroke="#15803d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="645" y="240" font-size="10" font-weight="700" fill="#1F2937" text-anchor="middle">Confirm payment of</text>
  <text x="645" y="262" font-size="16" font-weight="800" fill="#15803d" text-anchor="middle">KES 1,500.00</text>
  <text x="645" y="282" font-size="8.5" fill="#6b7280" text-anchor="middle">to WANJIKU MINI-MART</text>
  <text x="645" y="300" font-size="8.5" fill="#6b7280" text-anchor="middle">Buy Goods · 1-Click</text>
  <rect x="600" y="330" width="90" height="34" rx="8" fill="#28a745"/>
  <text x="645" y="352" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Enter PIN</text>
  <circle cx="592" cy="150" r="3" fill="#0a0a0a"/>

  <!-- auto-credit card -->
  <rect x="620" y="130" width="0" height="0" fill="none"/>
  <rect x="586" y="452" width="336" height="60" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="610" cy="482" r="12" fill="#28a745"/>
  <path d="M602 482 l6 6 l13 -14" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="632" y="474" font-size="11.5" font-weight="700" fill="#15803d">3 · Till auto-credits on confirmation</text>
  <text x="632" y="492" font-size="10" fill="#374151">Receipt prints, stock drops, the shift balances itself.</text>
</svg>
