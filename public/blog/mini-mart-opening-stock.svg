<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Your first order — stock that actually sells</text>

  <!-- ============ LEFT: category cards ============ -->
  <rect x="16" y="56" width="520" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="40" y="92" font-size="12.5" font-weight="700" fill="#1F2937">The starter shelf · share of first stock budget</text>

  <g>
    <rect x="40" y="108" width="226" height="76" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="60" y="134" font-size="11.5" font-weight="700" fill="#1F2937">🌽 Staples — 40%</text>
    <text x="60" y="152" font-size="10" fill="#374151">Maize flour, rice, sugar, cooking oil,</text>
    <text x="60" y="168" font-size="10" fill="#374151">tea leaves, salt. The weekly basket.</text>

    <rect x="278" y="108" width="214" height="76" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="298" y="134" font-size="11.5" font-weight="700" fill="#1F2937">🥤 Drinks — 15%</text>
    <text x="298" y="152" font-size="10" fill="#6b7280">Water, sodas, juices, and sachet</text>
    <text x="298" y="168" font-size="10" fill="#6b7280">drinks. High frequency, low value.</text>

    <rect x="40" y="196" width="226" height="76" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="60" y="222" font-size="11.5" font-weight="700" fill="#1F2937">🥛 Dairy &amp; fresh — 15%</text>
    <text x="60" y="240" font-size="10" fill="#6b7280">Milk, bread, eggs, mandazi packs.</text>
    <text x="60" y="256" font-size="10" fill="#6b7280">Daily repeat traffic if you stock well.</text>

    <rect x="278" y="196" width="214" height="76" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="298" y="222" font-size="11.5" font-weight="700" fill="#1F2937">🍫 Snacks — 12%</text>
    <text x="298" y="240" font-size="10" fill="#6b7280">Biscuits, crisps, sweets, chewing gum.</text>
    <text x="298" y="256" font-size="10" fill="#6b7280">Impulse buys at the counter.</text>

    <rect x="40" y="284" width="226" height="76" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="60" y="310" font-size="11.5" font-weight="700" fill="#1F2937">🧼 Toiletries &amp; home — 10%</text>
    <text x="60" y="328" font-size="10" fill="#6b7280">Soap, detergent, toothpaste, sanitary</text>
    <text x="60" y="344" font-size="10" fill="#6b7280">items. Steady margin.</text>

    <rect x="278" y="284" width="214" height="76" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="298" y="310" font-size="11.5" font-weight="700" fill="#1F2937">📱 Airtime &amp; data — 8%</text>
    <text x="298" y="328" font-size="10" fill="#6b7280">Every phone in the estate walks past.</text>
    <text x="298" y="344" font-size="10" fill="#6b7280">Thin margin, guaranteed traffic.</text>
  </g>

  <rect x="40" y="384" width="452" height="52" rx="10" fill="#fefce8" stroke="#fde68a"/>
  <text x="266" y="406" font-size="11" font-weight="700" fill="#A8842C" text-anchor="middle">Start with ~20 best sellers per category, not 200 items</text>
  <text x="266" y="424" font-size="10" fill="#6b7280" text-anchor="middle">A deep basket on what moves beats a thin spread everywhere</text>

  <text x="40" y="476" font-size="10.5" fill="#6b7280">Buy from wholesalers and distributors you can visit — cash-and-carry today,</text>
  <text x="40" y="492" font-size="10.5" fill="#6b7280">credit later once they trust your shop's numbers.</text>

  <!-- ============ RIGHT: price it right ============ -->
  <rect x="564" y="56" width="380" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="588" y="92" font-size="13" font-weight="700" fill="#1F2937">Pricing &amp; margin, made simple</text>

  <rect x="588" y="110" width="332" height="104" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="608" y="136" font-size="11.5" font-weight="700" fill="#15803d">Sell price = buying price + margin</text>
  <text x="608" y="158" font-size="10.5" fill="#374151">Example — Sunbest Oil 1 L:</text>
  <text x="608" y="176" font-size="10.5" fill="#374151">· Buying: KSh 450</text>
  <text x="608" y="192" font-size="10.5" fill="#374151">· Selling: KSh 520 → margin 13.5% · KSh 70 per bottle</text>
  <text x="608" y="206" font-size="10" fill="#6b7280">Target 15–30% across the basket; staples leaner, impulse fatter.</text>

  <rect x="588" y="230" width="332" height="104" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="608" y="256" font-size="11.5" font-weight="700" fill="#1F2937">Know your margin per item</text>
  <text x="608" y="276" font-size="10.5" fill="#6b7280">A POS shows buying vs selling side by side, so</text>
  <text x="608" y="292" font-size="10.5" fill="#6b7280">you can see which items earn and which merely</text>
  <text x="608" y="308" font-size="10.5" fill="#6b7280">move. Discount winners, not losers.</text>
  <text x="608" y="324" font-size="10" fill="#6b7280">(Yes — Kiosk shows this on the add-product screen.)</text>

  <rect x="588" y="350" width="332" height="104" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="608" y="376" font-size="11.5" font-weight="700" fill="#1F2937">Reordering is math, not memory</text>
  <text x="608" y="396" font-size="10.5" fill="#6b7280">· Fast movers: reorder at 1/3 remaining.</text>
  <text x="608" y="412" font-size="10.5" fill="#6b7280">· Slow movers: never chase them with cash.</text>
  <text x="608" y="428" font-size="10.5" fill="#6b7280">· Track what your till records — that's your</text>
  <text x="608" y="444" font-size="10.5" fill="#6b7280">  truth, not what you think you sold.</text>

  <rect x="588" y="470" width="332" height="42" rx="10" fill="#1F2937"/>
  <text x="754" y="492" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Stock is your cash until it sells — turn it fast</text>
</svg>
