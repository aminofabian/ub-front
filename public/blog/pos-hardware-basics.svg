<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The hardware that actually matters</text>

  <!-- ============ Card 1: phone ============ -->
  <rect x="16" y="56" width="440" height="226" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="44" rx="14" fill="#15803d"/>
  <rect x="16" y="82" width="440" height="18" fill="#15803d"/>
  <text x="40" y="85" font-size="13" font-weight="700" fill="#ffffff">The till — a phone or tablet</text>
  <rect x="352" y="66" width="84" height="24" rx="12" fill="#ffffff"/>
  <text x="394" y="82" font-size="10" font-weight="800" fill="#15803d" text-anchor="middle">START HERE</text>

  <!-- phone mock -->
  <rect x="60" y="120" width="120" height="130" rx="16" fill="#0a0a0a"/>
  <rect x="66" y="126" width="108" height="118" rx="10" fill="#ffffff"/>
  <rect x="66" y="126" width="108" height="22" rx="10" fill="#15803d"/>
  <text x="120" y="141" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Kiosk till</text>
  <rect x="74" y="158" width="40" height="14" rx="3" fill="#f3f4f6"/>
  <rect x="74" y="178" width="60" height="14" rx="3" fill="#f3f4f6"/>
  <rect x="74" y="198" width="44" height="14" rx="3" fill="#f3f4f6"/>
  <rect x="74" y="222" width="56" height="14" rx="7" fill="#28a745"/>

  <g font-size="10.5" fill="#374151">
    <text x="204" y="150">· Runs the whole shop — till, stock, storefront</text>
    <text x="204" y="170">· You already own it — no terminal to buy</text>
    <text x="204" y="190">· Camera scans barcodes, M-Pesa works out of the box</text>
    <text x="204" y="210">· Works offline — cash sales sync when you reconnect</text>
  </g>
  <text x="40" y="266" font-size="10" fill="#6b7280">Cost: the phone in your pocket · upgrade to a tablet for a bigger screen</text>

  <!-- ============ Card 2: scanner ============ -->
  <rect x="16" y="300" width="440" height="226" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="300" width="440" height="44" rx="14" fill="#A8842C"/>
  <rect x="16" y="326" width="440" height="18" fill="#A8842C"/>
  <text x="40" y="329" font-size="13" font-weight="700" fill="#ffffff">First upgrade — a barcode scanner</text>
  <rect x="340" y="310" width="96" height="24" rx="12" fill="#ffffff"/>
  <text x="388" y="326" font-size="10" font-weight="800" fill="#A8842C" text-anchor="middle">SPEEDS UP</text>

  <!-- scanner mock -->
  <rect x="60" y="356" width="120" height="110" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="76" y="368" width="88" height="30" rx="6" fill="#1F2937"/>
  <g stroke="#ffffff" stroke-width="2">
    <line x1="88" y1="380" x2="88" y2="390"/><line x1="94" y1="380" x2="94" y2="390"/>
    <line x1="98" y1="380" x2="98" y2="390"/><line x1="106" y1="380" x2="106" y2="390"/>
    <line x1="110" y1="380" x2="110" y2="390"/><line x1="118" y1="380" x2="118" y2="390"/>
    <line x1="124" y1="380" x2="124" y2="390"/><line x1="132" y1="380" x2="132" y2="390"/>
    <line x1="138" y1="380" x2="138" y2="390"/><line x1="146" y1="380" x2="146" y2="390"/>
  </g>
  <rect x="76" y="404" width="88" height="18" rx="9" fill="#f3f4f6"/>
  <text x="120" y="417" font-size="8.5" fill="#6b7280" text-anchor="middle">USB or Bluetooth</text>
  <path d="M96 446 l-10 0 m10 -8 l-6 12 m26 -12 l6 12 m-20 -6 l14 0" stroke="#6b7280" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <rect x="118" y="436" width="30" height="18" rx="4" fill="#1F2937"/>

  <g font-size="10.5" fill="#374151">
    <text x="204" y="380">· Scan a product in a second — no typing names</text>
    <text x="204" y="400">· Camera works first; USB/Bluetooth for speed</text>
    <text x="204" y="420">· Pairs with the till in minutes</text>
  </g>
  <text x="40" y="510" font-size="10" fill="#6b7280">Buy one when your queue starts moving faster than your fingers</text>

  <!-- ============ Card 3: printer ============ -->
  <rect x="504" y="56" width="440" height="226" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="44" rx="14" fill="#1F2937"/>
  <rect x="504" y="82" width="440" height="18" fill="#1F2937"/>
  <text x="528" y="85" font-size="13" font-weight="700" fill="#ffffff">Second upgrade — a receipt printer</text>
  <rect x="828" y="66" width="92" height="24" rx="12" fill="#ffffff"/>
  <text x="874" y="82" font-size="10" font-weight="800" fill="#374151" text-anchor="middle">BUSY DAYS</text>

  <!-- printer mock -->
  <rect x="548" y="120" width="150" height="110" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="560" y="132" width="126" height="54" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="572" y="146" width="60" height="26" rx="2" fill="#ffffff"/>
  <g stroke="#1F2937" stroke-width="1.6">
    <line x1="578" y1="152" x2="578" y2="166"/><line x1="583" y1="152" x2="583" y2="166"/>
    <line x1="586" y1="152" x2="586" y2="166"/><line x1="593" y1="152" x2="593" y2="166"/>
    <line x1="596" y1="152" x2="596" y2="166"/><line x1="603" y1="152" x2="603" y2="166"/>
    <line x1="608" y1="152" x2="608" y2="166"/><line x1="615" y1="152" x2="615" y2="166"/>
    <line x1="620" y1="152" x2="620" y2="166"/><line x1="626" y1="152" x2="626" y2="166"/>
  </g>
  <rect x="560" y="196" width="126" height="20" rx="4" fill="#f3f4f6"/>
  <text x="623" y="210" font-size="8.5" fill="#6b7280" text-anchor="middle">Thermal · 58mm or 80mm</text>

  <g font-size="10.5" fill="#374151">
    <text x="722" y="150">· Paper receipt in seconds — customers love it</text>
    <text x="722" y="170">· Digital receipts work fine before you buy one</text>
    <text x="722" y="190">· Thermal = no ink to refill</text>
  </g>
  <text x="548" y="266" font-size="10" fill="#6b7280">Add it when the counter gets busy enough to matter</text>

  <!-- ============ Card 4: nice to have ============ -->
  <rect x="504" y="300" width="440" height="226" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="300" width="440" height="44" rx="14" fill="#4b5563"/>
  <rect x="504" y="326" width="440" height="18" fill="#4b5563"/>
  <text x="528" y="329" font-size="13" font-weight="700" fill="#ffffff">Nice-to-haves — skip until needed</text>
  <rect x="820" y="310" width="100" height="24" rx="12" fill="#ffffff"/>
  <text x="870" y="326" font-size="10" font-weight="800" fill="#4b5563" text-anchor="middle">LATER, NOT NOW</text>

  <g font-size="11" fill="#374151">
    <rect x="528" y="358" width="392" height="44" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="548" y="378" font-weight="700" fill="#1F2937">Cash drawer</text>
    <text x="548" y="394" font-size="10.5" fill="#6b7280">Unlocks with a sale — useful once cash is a daily habit</text>

    <rect x="528" y="410" width="392" height="44" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="548" y="430" font-weight="700" fill="#1F2937">Stand / tablet holder</text>
    <text x="548" y="446" font-size="10.5" fill="#6b7280">Frees your hands at the counter — nice, not necessary</text>

    <rect x="528" y="462" width="392" height="40" rx="8" fill="#fefce8" stroke="#fde68a"/>
    <text x="548" y="482" font-size="11" font-weight="700" fill="#A8842C">The rule: buy after setup, not before</text>
    <text x="548" y="497" font-size="10" fill="#6b7280">Get the software live first — hardware is an upgrade, not a prerequisite</text>
  </g>
</svg>
