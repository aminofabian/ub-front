<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">One worksheet, every vendor</text>

  <!-- Card -->
  <rect x="16" y="60" width="928" height="420" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Header row -->
  <text x="48" y="96" font-size="11" font-weight="700" fill="#1F2937">Cost line</text>
  <text x="430" y="96" font-size="11" font-weight="700" fill="#1F2937">Type</text>
  <text x="600" y="96" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle">Vendor A</text>
  <text x="730" y="96" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle">Vendor B</text>
  <text x="860" y="96" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle">Vendor C</text>
  <line x1="40" y1="112" x2="920" y2="112" stroke="#e5e7eb"/>

  <!-- ===== Row 1: Hardware (one-off) ===== -->
  <rect x="40" y="128" width="880" height="36" rx="8" fill="#f9fafb"/>
  <rect x="40" y="128" width="4" height="36" rx="2" fill="#2563eb"/>
  <text x="60" y="150" font-size="10.5" fill="#374151">Hardware (scanner, printer)</text>
  <text x="430" y="150" font-size="9.5" fill="#6b7280">One-off</text>
  <rect x="550" y="131" width="100" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="680" y="131" width="100" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="810" y="131" width="100" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>

  <!-- ===== Row 2: Setup & training (one-off) ===== -->
  <rect x="40" y="178" width="880" height="36" rx="8" fill="#ffffff"/>
  <rect x="40" y="178" width="4" height="36" rx="2" fill="#2563eb"/>
  <text x="60" y="200" font-size="10.5" fill="#374151">Setup &amp; staff training</text>
  <text x="430" y="200" font-size="9.5" fill="#6b7280">One-off</text>
  <rect x="550" y="181" width="100" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="680" y="181" width="100" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="810" y="181" width="100" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>

  <!-- ===== Row 3: Software plan (recurring) ===== -->
  <rect x="40" y="228" width="880" height="36" rx="8" fill="#f9fafb"/>
  <rect x="40" y="228" width="4" height="36" rx="2" fill="#A8842C"/>
  <text x="60" y="250" font-size="10.5" fill="#374151">Software plan</text>
  <text x="430" y="250" font-size="9.5" fill="#6b7280">Recurring</text>
  <rect x="550" y="231" width="100" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="680" y="231" width="100" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="810" y="231" width="100" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>

  <!-- ===== Row 4: Internet / data (recurring) ===== -->
  <rect x="40" y="278" width="880" height="36" rx="8" fill="#ffffff"/>
  <rect x="40" y="278" width="4" height="36" rx="2" fill="#A8842C"/>
  <text x="60" y="300" font-size="10.5" fill="#374151">Internet / data</text>
  <text x="430" y="300" font-size="9.5" fill="#6b7280">Recurring</text>
  <rect x="550" y="281" width="100" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="680" y="281" width="100" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="810" y="281" width="100" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>

  <!-- ===== Row 5: M-Pesa fees (per sale) ===== -->
  <rect x="40" y="328" width="880" height="36" rx="8" fill="#f9fafb"/>
  <rect x="40" y="328" width="4" height="36" rx="2" fill="#15803d"/>
  <text x="60" y="350" font-size="10.5" fill="#374151">M-Pesa / bank fees</text>
  <text x="430" y="350" font-size="9.5" fill="#6b7280">Per sale</text>
  <rect x="550" y="331" width="100" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="680" y="331" width="100" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <rect x="810" y="331" width="100" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>

  <!-- ===== Row 6: Reconciliation time (recurring, the big one) ===== -->
  <rect x="40" y="378" width="880" height="36" rx="8" fill="#fee2e2"/>
  <rect x="40" y="378" width="4" height="36" rx="2" fill="#b91c1c"/>
  <text x="60" y="400" font-size="10.5" font-weight="700" fill="#7f1d1d">Reconciliation time</text>
  <text x="430" y="400" font-size="9.5" font-weight="700" fill="#b91c1c">Recurring</text>
  <rect x="550" y="381" width="100" height="30" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="5 4"/>
  <rect x="680" y="381" width="100" height="30" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="5 4"/>
  <rect x="810" y="381" width="100" height="30" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="5 4"/>

  <!-- Footer note inside card -->
  <text x="480" y="440" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="middle">Fill the same rows for every vendor — over three years, not one.</text>
  <text x="480" y="458" font-size="10" fill="#6b7280" text-anchor="middle">The cheapest sticker usually carries the heaviest time rows — that is the number that decides.</text>

  <!-- Outside note -->
  <text x="480" y="508" font-size="10" fill="#6b7280" text-anchor="middle">Illustrative worksheet — your figures will differ. The point is to compare three-year totals, not the first invoice.</text>
</svg>
