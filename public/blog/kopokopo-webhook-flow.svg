<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The Kopo Kopo flow — payment in, sale closed</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#A8842C"/>
    </marker>
  </defs>

  <!-- ============ LEFT: the till starts the sale ============ -->
  <rect x="16" y="56" width="280" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="280" height="48" rx="14" fill="#15803d"/>
  <rect x="16" y="82" width="280" height="22" fill="#15803d"/>
  <text x="40" y="87" font-size="13.5" font-weight="700" fill="#ffffff">1 · Customer pays</text>

  <!-- cart -->
  <rect x="40" y="130" width="232" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="56" y="158" font-size="11.5" font-weight="700" fill="#374151">Sunbest Cooking Oil 1 L</text>
  <text x="56" y="176" font-size="11" fill="#6b7280">2 × KES 520.00</text>
  <text x="252" y="176" font-size="12" font-weight="700" fill="#1F2937" text-anchor="end">1,040.00</text>
  <line x1="56" y1="190" x2="248" y2="190" stroke="#e5e7eb"/>
  <text x="56" y="218" font-size="11.5" font-weight="700" fill="#374151">Pishori Rice 2 kg</text>
  <text x="56" y="236" font-size="11" fill="#6b7280">1 × KES 460.00</text>
  <text x="252" y="236" font-size="12" font-weight="700" fill="#1F2937" text-anchor="end">460.00</text>
  <line x1="56" y1="250" x2="248" y2="250" stroke="#e5e7eb"/>
  <text x="56" y="282" font-size="13" font-weight="800" fill="#1F2937">Total</text>
  <text x="252" y="282" font-size="16" font-weight="800" fill="#15803d" text-anchor="end">KES 1,500.00</text>

  <!-- M-Pesa button -->
  <rect x="40" y="306" width="150" height="48" rx="10" fill="#28a745"/>
  <circle cx="58" cy="330" r="10" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1"/>
  <path d="M52 330 h12 M58 324 v12" stroke="#a3a3a3" stroke-width="1.1" fill="none"/>
  <text x="78" y="328" font-size="12.5" font-weight="700" fill="#ffffff">M-PESA</text>
  <text x="78" y="344" font-size="9.5" fill="#d1fae5">STK Push · 1 tap</text>

  <!-- note -->
  <text x="156" y="386" font-size="10.5" fill="#6b7280" text-anchor="middle">STK push from the till — or the</text>
  <text x="156" y="404" font-size="10.5" fill="#6b7280" text-anchor="middle">customer pays the Buy Goods till</text>

  <!-- flow arrow 1 -->
  <path d="M296 280 C 330 280, 340 280, 380 280" stroke="#A8842C" stroke-width="3.5" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="346" y="268" font-size="10.5" font-weight="700" fill="#A8842C" text-anchor="middle">Payment</text>

  <!-- ============ MIDDLE: Kopo Kopo confirms ============ -->
  <rect x="396" y="56" width="168" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="396" y="56" width="168" height="48" rx="14" fill="#0F766E"/>
  <rect x="396" y="82" width="168" height="22" fill="#0F766E"/>
  <text x="412" y="87" font-size="12" font-weight="700" fill="#ffffff">2 · Kopo Kopo confirms</text>

  <!-- cloud -->
  <circle cx="462" cy="214" r="18" fill="#E0F2F1" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="480" cy="198" r="24" fill="#E0F2F1" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="498" cy="214" r="18" fill="#E0F2F1" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="462" y="214" width="36" height="18" fill="#E0F2F1" stroke="#0F766E" stroke-width="1.5"/>
  <path d="M470 218 l7 7 l14 -15" stroke="#0F766E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="480" y="272" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Payment confirmed</text>

  <!-- signed webhook badge -->
  <rect x="412" y="296" width="136" height="40" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="480" y="313" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Signed webhook</text>
  <text x="480" y="327" font-size="9" fill="#6b7280" text-anchor="middle">sent to the till</text>

  <text x="480" y="366" font-size="10" fill="#6b7280" text-anchor="middle">No SMS to check.</text>
  <text x="480" y="382" font-size="10" fill="#6b7280" text-anchor="middle">No manual matching.</text>

  <!-- flow arrow 2 -->
  <path d="M564 280 C 598 280, 608 280, 648 280" stroke="#A8842C" stroke-width="3.5" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="614" y="268" font-size="10.5" font-weight="700" fill="#A8842C" text-anchor="middle">Webhook</text>

  <!-- ============ RIGHT: till auto-matches ============ -->
  <rect x="664" y="56" width="280" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="664" y="56" width="280" height="48" rx="14" fill="#1F2937"/>
  <rect x="664" y="82" width="280" height="22" fill="#1F2937"/>
  <text x="688" y="87" font-size="13.5" font-weight="700" fill="#ffffff">3 · Till auto-matches</text>

  <!-- sale record -->
  <rect x="688" y="130" width="232" height="200" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="704" y="158" font-size="11.5" font-weight="700" fill="#374151">Sale #1042</text>
  <rect x="848" y="142" width="56" height="22" rx="11" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="876" y="157" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">✓ Matched</text>
  <text x="704" y="196" font-size="11" fill="#6b7280">M-Pesa · Buy Goods</text>
  <text x="888" y="222" font-size="16" font-weight="800" fill="#15803d" text-anchor="end">KES 1,500.00</text>
  <line x1="704" y1="240" x2="888" y2="240" stroke="#e5e7eb"/>
  <text x="704" y="268" font-size="11" font-weight="700" fill="#374151">Receipt printed</text>
  <text x="704" y="288" font-size="11" fill="#6b7280">Stock dropped</text>
  <text x="704" y="308" font-size="11" fill="#6b7280">Shift record updated</text>

  <!-- footer -->
  <rect x="688" y="446" width="232" height="62" rx="12" fill="#15803d"/>
  <text x="804" y="470" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">The shift balances itself</text>
  <text x="804" y="490" font-size="10" fill="#d1fae5" text-anchor="middle">No late-night matching</text>
</svg>
