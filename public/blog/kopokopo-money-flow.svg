<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Where your money goes — and who never touches it</text>

  <defs>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#A8842C"/>
    </marker>
  </defs>

  <!-- ============ FLOW NODES ============ -->
  <!-- node 1: customer -->
  <rect x="16" y="66" width="160" height="150" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="66" width="160" height="38" rx="12" fill="#1F2937"/>
  <rect x="16" y="88" width="160" height="16" fill="#1F2937"/>
  <text x="96" y="92" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Customer's phone</text>
  <circle cx="96" cy="128" r="14" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="96" y="133" font-size="12" text-anchor="middle">📱</text>
  <text x="96" y="166" font-size="9.5" font-weight="600" fill="#1F2937" text-anchor="middle">Pays via M-Pesa</text>
  <text x="96" y="182" font-size="8.5" fill="#6b7280" text-anchor="middle">PIN stays on their phone</text>

  <!-- node 2: safaricom -->
  <rect x="208" y="66" width="160" height="150" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="208" y="66" width="160" height="38" rx="12" fill="#6b7280"/>
  <rect x="208" y="88" width="160" height="16" fill="#6b7280"/>
  <text x="288" y="92" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Safaricom M-Pesa</text>
  <circle cx="288" cy="128" r="14" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="288" y="133" font-size="12" text-anchor="middle">🏦</text>
  <text x="288" y="166" font-size="9.5" font-weight="600" fill="#1F2937" text-anchor="middle">The rails</text>
  <text x="288" y="182" font-size="8.5" fill="#6b7280" text-anchor="middle">Safaricom moves the money</text>

  <!-- node 3: your business account -->
  <rect x="400" y="66" width="160" height="150" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <rect x="400" y="66" width="160" height="38" rx="12" fill="#15803d"/>
  <rect x="400" y="88" width="160" height="16" fill="#15803d"/>
  <text x="480" y="92" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Your business account</text>
  <circle cx="480" cy="128" r="14" fill="#f0fdf4" stroke="#15803d"/>
  <path d="M473 128 l5 5 l11 -12" stroke="#15803d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="166" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Money lands HERE</text>
  <text x="480" y="182" font-size="8.5" fill="#6b7280" text-anchor="middle">till / paybill · yours</text>

  <!-- node 4: kopokopo dashboard -->
  <rect x="592" y="66" width="160" height="150" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="592" y="66" width="160" height="38" rx="12" fill="#0F766E"/>
  <rect x="592" y="88" width="160" height="16" fill="#0F766E"/>
  <text x="672" y="92" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Kopo Kopo dashboard</text>
  <circle cx="672" cy="128" r="14" fill="#f0fdf4" stroke="#0F766E"/>
  <text x="672" y="133" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">KK</text>
  <text x="672" y="166" font-size="9.5" font-weight="600" fill="#1F2937" text-anchor="middle">Withdraw from here</text>
  <text x="672" y="182" font-size="8.5" fill="#6b7280" text-anchor="middle">you initiate the transfer</text>

  <!-- node 5: your bank -->
  <rect x="784" y="66" width="160" height="150" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="784" y="66" width="160" height="38" rx="12" fill="#1F2937"/>
  <rect x="784" y="88" width="160" height="16" fill="#1F2937"/>
  <text x="864" y="92" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Your bank</text>
  <circle cx="864" cy="128" r="14" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="864" y="133" font-size="12" text-anchor="middle">🏦</text>
  <text x="864" y="166" font-size="9.5" font-weight="600" fill="#1F2937" text-anchor="middle">The final stop</text>
  <text x="864" y="182" font-size="8.5" fill="#6b7280" text-anchor="middle">your money, your bank</text>

  <!-- arrows -->
  <path d="M176 141 C 190 141, 194 141, 206 141" stroke="#A8842C" stroke-width="3" fill="none" marker-end="url(#arr3)"/>
  <path d="M368 141 C 382 141, 386 141, 398 141" stroke="#A8842C" stroke-width="3" fill="none" marker-end="url(#arr3)"/>
  <path d="M560 141 C 574 141, 578 141, 590 141" stroke="#A8842C" stroke-width="3" fill="none" marker-end="url(#arr3)"/>
  <path d="M752 141 C 766 141, 770 141, 782 141" stroke="#A8842C" stroke-width="3" fill="none" marker-end="url(#arr3)"/>

  <!-- ============ ANNOTATIONS ============ -->
  <rect x="16" y="244" width="456" height="120" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="40" y="270" font-size="11.5" font-weight="700" fill="#1F2937">Kiosk's role in the journey</text>
  <g font-size="10" fill="#374151">
    <circle cx="48" cy="296" r="6" fill="#0F766E"/>
    <text x="66" y="300">Matches every payment to a sale — in real time</text>
    <circle cx="48" cy="320" r="6" fill="#0F766E"/>
    <text x="66" y="324">Never holds your money, never sees the PIN</text>
    <circle cx="48" cy="344" r="6" fill="#0F766E"/>
    <text x="66" y="348">Hands you a shift report that already balances</text>
  </g>

  <rect x="488" y="244" width="456" height="120" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="512" y="270" font-size="11.5" font-weight="700" fill="#1F2937">Protected end to end</text>
  <g font-size="10" fill="#374151">
    <circle cx="520" cy="296" r="6" fill="#15803d"/>
    <text x="538" y="300">Confirmations are signed — only Kopo Kopo can send them</text>
    <circle cx="520" cy="320" r="6" fill="#15803d"/>
    <text x="538" y="324">Credentials are stored encrypted, seen by admins only</text>
    <circle cx="520" cy="344" r="6" fill="#15803d"/>
    <text x="538" y="348">Customer numbers arrive masked — the full number isn't shared</text>
  </g>

  <!-- ============ BOTTOM BAR ============ -->
  <rect x="16" y="392" width="928" height="120" rx="14" fill="#15803d"/>
  <text x="480" y="428" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Your money lives in your business account — you withdraw it to your bank.</text>
  <text x="480" y="452" font-size="10" fill="#d1fae5" text-anchor="middle">The POS matches and reports; it never holds or moves your takings.</text>
  <text x="480" y="474" font-size="10" fill="#d1fae5" text-anchor="middle">That's the whole journey — from the customer's PIN to your bank, nobody else touches it.</text>
  <text x="480" y="498" font-size="9" fill="#a7f3d0" text-anchor="middle">Signed webhooks · encrypted credentials · masked numbers</text>
</svg>
