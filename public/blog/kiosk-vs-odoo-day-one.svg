<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Day one, side by side</text>

  <!-- Center VS badge -->
  <circle cx="480" cy="296" r="36" fill="#A8842C"/>
  <circle cx="480" cy="296" r="36" fill="none" stroke="#FBF9F5" stroke-width="6"/>
  <text x="480" y="304" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">VS</text>

  <!-- ============ LEFT PANEL: Kiosk.ke ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="64" rx="14" fill="#15803d"/>
  <rect x="16" y="92" width="440" height="28" fill="#15803d"/>
  <circle cx="52" cy="88" r="16" fill="#28a745"/>
  <text x="52" y="94" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
  <text x="80" y="84" font-size="16" font-weight="700" fill="#ffffff">Kiosk.ke</text>
  <text x="80" y="104" font-size="11" fill="#d1fae5">Turnkey local retail POS</text>
  <rect x="322" y="70" width="118" height="30" rx="15" fill="#ffffff"/>
  <text x="381" y="89" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">LIVE IN 12 MIN</text>

  <!-- Kiosk timeline -->
  <g font-size="12.5" fill="#1F2937">
    <rect x="40" y="146" width="392" height="56" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="58" y="168" font-size="12" font-weight="700" fill="#15803d">10:00</text>
    <text x="58" y="186" font-size="12.5" fill="#374151">Sign up — claim yourshop.kiosk.ke</text>
    <circle cx="418" cy="174" r="11" fill="#28a745"/>
    <path d="M412 174 l4.5 4.5 l8 -9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="212" width="392" height="56" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="58" y="234" font-size="12" font-weight="700" fill="#15803d">10:08</text>
    <text x="58" y="252" font-size="12.5" fill="#374151">Search products, scan barcodes, set prices</text>
    <circle cx="418" cy="240" r="11" fill="#28a745"/>
    <path d="M412 240 l4.5 4.5 l8 -9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="278" width="392" height="56" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="58" y="300" font-size="12" font-weight="700" fill="#15803d">10:12</text>
    <text x="58" y="318" font-size="12.5" fill="#374151">First sale — M-Pesa STK Push at the till</text>
    <circle cx="418" cy="306" r="11" fill="#28a745"/>
    <path d="M412 306 l4.5 4.5 l8 -9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linejoin="round"/>

    <rect x="40" y="344" width="392" height="56" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="58" y="366" font-size="12" font-weight="700" fill="#15803d">10:15</text>
    <text x="58" y="384" font-size="12.5" fill="#374151">Storefront live — stock already synced</text>
    <circle cx="418" cy="372" r="11" fill="#28a745"/>
    <path d="M412 372 l4.5 4.5 l8 -9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Kiosk footer badge -->
  <rect x="40" y="424" width="392" height="40" rx="10" fill="#15803d"/>
  <text x="236" y="449" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Sold out of a fresh catalogue before lunch 🏪</text>
  <text x="236" y="490" font-size="11.5" fill="#6b7280" text-anchor="middle">No consultant. No implementation project. No modules to switch on.</text>

  <!-- ============ RIGHT PANEL: Odoo ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="64" rx="14" fill="#374151"/>
  <rect x="504" y="92" width="440" height="28" fill="#374151"/>
  <circle cx="540" cy="88" r="16" fill="#4b5563"/>
  <text x="540" y="94" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">O</text>
  <text x="568" y="84" font-size="16" font-weight="700" fill="#ffffff">Odoo</text>
  <text x="568" y="104" font-size="11" fill="#d1d5db">Enterprise ERP suite</text>
  <rect x="810" y="70" width="118" height="30" rx="15" fill="#fecaca"/>
  <text x="869" y="89" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">WEEKS TO LIVE</text>

  <!-- Odoo timeline -->
  <g font-size="12.5" fill="#1F2937">
    <rect x="528" y="146" width="392" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="546" y="168" font-size="12" font-weight="700" fill="#6b7280">Day 1</text>
    <text x="546" y="186" font-size="12.5" fill="#4b5563">Install Odoo — choose 20+ modules</text>
    <circle cx="906" cy="174" r="11" fill="#e5e7eb"/>
    <text x="906" y="179" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle">1</text>

    <rect x="528" y="212" width="392" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="546" y="234" font-size="12" font-weight="700" fill="#6b7280">Week 1</text>
    <text x="546" y="252" font-size="12.5" fill="#4b5563">Configure product categories &amp; chart of accounts</text>
    <circle cx="906" cy="240" r="11" fill="#e5e7eb"/>
    <text x="906" y="245" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle">2</text>

    <rect x="528" y="278" width="392" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="546" y="300" font-size="12" font-weight="700" fill="#6b7280">Week 2</text>
    <text x="546" y="318" font-size="12.5" fill="#4b5563">Source &amp; test a payment gateway for Kenya</text>
    <circle cx="906" cy="306" r="11" fill="#e5e7eb"/>
    <text x="906" y="311" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle">3</text>

    <rect x="528" y="344" width="392" height="56" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="546" y="366" font-size="12" font-weight="700" fill="#b91c1c">Week 3</text>
    <text x="546" y="384" font-size="12.5" fill="#7f1d1d">Still training staff, still no first sale</text>
    <circle cx="906" cy="372" r="11" fill="#dc2626"/>
    <path d="M901 367 l10 10 M911 367 l-10 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Odoo footer badge -->
  <rect x="528" y="424" width="392" height="40" rx="10" fill="#374151"/>
  <text x="724" y="449" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Still configuring — first sale not yet made</text>
  <text x="724" y="490" font-size="11.5" fill="#9ca3af" text-anchor="middle">It may be powerful. But it is not helping anyone sell this week.</text>
</svg>
