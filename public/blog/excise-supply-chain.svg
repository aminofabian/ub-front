<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Excise duty — paid once, at the source, inside every price</text>

  <!-- ============ Supply chain flow ============ -->
  <!-- Node 1: Manufacturer/Importer -->
  <rect x="16" y="80" width="240" height="170" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="80" width="240" height="40" rx="14" fill="#A8842C"/>
  <rect x="16" y="106" width="240" height="14" fill="#A8842C"/>
  <text x="136" y="106" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Manufacturer / importer</text>
  <text x="36" y="152" font-size="11" fill="#374151">The one who actually</text>
  <text x="36" y="170" font-size="11" fill="#374151">pays the duty — at</text>
  <text x="36" y="188" font-size="11" fill="#374151">production or import.</text>
  <rect x="36" y="208" width="200" height="26" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="136" y="225" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">PAYS THE EXCISE DUTY</text>

  <!-- Arrow 1 -->
  <path d="M256 165 L316 165" stroke="#A8842C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M312 159 L322 165 L312 171" fill="#A8842C"/>
  <text x="286" y="154" font-size="10" fill="#6b7280" text-anchor="middle">duty in price</text>

  <!-- Node 2: Distributor -->
  <rect x="322" y="80" width="240" height="170" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="322" y="80" width="240" height="40" rx="14" fill="#1F2937"/>
  <rect x="322" y="106" width="240" height="14" fill="#1F2937"/>
  <text x="442" y="106" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Distributor</text>
  <text x="342" y="152" font-size="11" fill="#374151">Wholesale price already</text>
  <text x="342" y="170" font-size="11" fill="#374151">includes the duty —</text>
  <text x="342" y="188" font-size="11" fill="#374151">nobody pays it twice.</text>
  <rect x="342" y="208" width="200" height="26" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="442" y="225" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">DUTY ALREADY INSIDE</text>

  <!-- Arrow 2 -->
  <path d="M562 165 L622 165" stroke="#A8842C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M618 159 L628 165 L618 171" fill="#A8842C"/>

  <!-- Node 3: Your shelf -->
  <rect x="628" y="80" width="240" height="170" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="628" y="80" width="240" height="40" rx="14" fill="#28a745"/>
  <rect x="628" y="106" width="240" height="14" fill="#28a745"/>
  <text x="748" y="106" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Your shelf</text>
  <text x="648" y="152" font-size="11" fill="#374151">You don't charge excise</text>
  <text x="648" y="170" font-size="11" fill="#374151">separately and you don't</text>
  <text x="648" y="188" font-size="11" fill="#374151">file excise returns.</text>
  <rect x="648" y="208" width="200" height="26" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="748" y="225" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">NOTHING TO FILE</text>

  <!-- ============ Bottom: the trap + what's excisable ============ -->
  <rect x="16" y="286" width="460" height="190" rx="14" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="40" y="318" font-size="12.5" font-weight="700" fill="#b91c1c">The one trap: duty-unpaid stock</text>
  <g font-size="10.5" fill="#374151">
    <text x="40" y="342">· Smuggled cigarettes or drinks sell far below</text>
    <text x="40" y="358">  market price — because the duty isn't in them.</text>
    <text x="40" y="380">· Selling duty-unpaid goods is a serious KRA</text>
    <text x="40" y="396">  offense, and "I didn't know" isn't the</text>
    <text x="40" y="412">  defense people think it is.</text>
    <text x="40" y="434">· Buy from legitimate distributors and keep</text>
    <text x="40" y="450">  their invoices — that's your proof of source.</text>
  </g>

  <rect x="504" y="286" width="440" height="190" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="528" y="318" font-size="12.5" font-weight="700" fill="#1F2937">Excisable goods on a mini-mart shelf</text>
  <g font-size="10.5" fill="#374151">
    <text x="528" y="344">· Sweetened sodas &amp; juices</text>
    <text x="528" y="364">· Beer &amp; spirits (if you stock them — plus a</text>
    <text x="528" y="380">  liquor license where your county requires it)</text>
    <text x="528" y="400">· Cigarettes</text>
    <text x="528" y="420">· Airtime &amp; data resale</text>
    <text x="528" y="444">The list and rates change each Finance Act —</text>
    <text x="528" y="460">check KRA's current schedule when in doubt.</text>
  </g>
</svg>
