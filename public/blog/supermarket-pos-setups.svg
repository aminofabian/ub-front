<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Supermarket POS cost scales with lanes</text>

  <!-- Card -->
  <rect x="16" y="64" width="928" height="390" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Header row -->
  <text x="92" y="100" font-size="11" font-weight="700" fill="#1F2937">Store size</text>
  <text x="520" y="100" font-size="11" font-weight="700" fill="#6b7280">Typical total</text>
  <text x="700" y="100" font-size="11" font-weight="700" fill="#6b7280">Best for</text>
  <line x1="40" y1="116" x2="920" y2="116" stroke="#e5e7eb"/>

  <!-- Row 1 -->
  <rect x="40" y="126" width="880" height="48" rx="8" fill="#f0fdf4"/>
  <circle cx="64" cy="150" r="14" fill="#15803d"/>
  <text x="64" y="155" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="92" y="155" font-size="11.5" font-weight="700" fill="#1F2937">Single-lane checkout</text>
  <text x="520" y="155" font-size="11" font-weight="700" fill="#15803d">KSh 60,000 – 150,000</text>
  <text x="700" y="155" font-size="10" fill="#6b7280">Small supermarket, one till</text>

  <!-- Row 2 -->
  <rect x="40" y="182" width="880" height="48" rx="8" fill="#ffffff"/>
  <circle cx="64" cy="206" r="14" fill="#A8842C"/>
  <text x="64" y="211" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="92" y="211" font-size="11.5" font-weight="700" fill="#1F2937">Two to three lanes</text>
  <text x="520" y="211" font-size="11" font-weight="700" fill="#A8842C">KSh 150,000 – 300,000</text>
  <text x="700" y="211" font-size="10" fill="#6b7280">Growing supermarkets</text>

  <!-- Row 3 -->
  <rect x="40" y="238" width="880" height="48" rx="8" fill="#f9fafb"/>
  <circle cx="64" cy="262" r="14" fill="#2563eb"/>
  <text x="64" y="267" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="92" y="267" font-size="11.5" font-weight="700" fill="#1F2937">Four+ lanes / full store</text>
  <text x="520" y="267" font-size="11" font-weight="700" fill="#2563eb">KSh 300,000 – 500,000+</text>
  <text x="700" y="267" font-size="10" fill="#6b7280">Multi-lane, high volume</text>

  <!-- Banner -->
  <rect x="40" y="308" width="880" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="336" font-size="12" font-weight="700" fill="#2563eb">Why a supermarket pays the most</text>
  <text x="64" y="360" font-size="10.5" fill="#374151">Every lane is its own terminal, scanner, printer, and licence — so cost scales with checkouts, not shelf space. Add</text>
  <text x="64" y="376" font-size="10.5" fill="#374151">back-office stock control and supplier ordering, and you are buying a system, not a till.</text>
  <text x="64" y="400" font-size="10" fill="#6b7280">Typical Kenyan prices for 2026 (ex-VAT), for planning — confirm with a supplier before you buy.</text>
</svg>
