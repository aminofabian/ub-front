<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">A webhook is a phone call between systems — with a signature</text>

  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#A8842C"/>
    </marker>
  </defs>

  <!-- ============ LEFT: the event ============ -->
  <rect x="16" y="56" width="280" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="280" height="48" rx="14" fill="#1F2937"/>
  <rect x="16" y="82" width="280" height="22" fill="#1F2937"/>
  <text x="40" y="87" font-size="13.5" font-weight="700" fill="#ffffff">1 · A payment happens</text>

  <!-- event card -->
  <rect x="40" y="130" width="232" height="240" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="40" y="130" width="232" height="40" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="62" cy="150" r="11" fill="#28a745"/>
  <path d="M56 150 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="146" font-size="10.5" font-weight="700" fill="#1F2937">Payment received</text>
  <text x="84" y="160" font-size="8.5" fill="#6b7280">buy goods · till</text>

  <text x="56" y="204" font-size="17" font-weight="800" fill="#15803d">KES 1,500.00</text>
  <line x1="56" y1="222" x2="248" y2="222" stroke="#f0f0f0"/>
  <g font-size="10" fill="#6b7280">
    <text x="56" y="246">Till number</text>
    <text x="248" y="246" font-weight="600" fill="#1F2937" text-anchor="end">3502582</text>
    <text x="56" y="268">From</text>
    <text x="248" y="268" font-weight="600" fill="#1F2937" text-anchor="end">+2547XXXXX123</text>
    <text x="56" y="290">Time</text>
    <text x="248" y="290" font-weight="600" fill="#1F2937" text-anchor="end">10:42:07 AM</text>
  </g>
  <text x="156" y="330" font-size="9.5" fill="#9ca3af" text-anchor="middle">The event: what happened</text>

  <!-- flow arrow 1 -->
  <path d="M296 280 C 330 280, 340 280, 380 280" stroke="#A8842C" stroke-width="3.5" fill="none" stroke-dasharray="8 6" marker-end="url(#arr2)"/>
  <text x="346" y="268" font-size="10.5" font-weight="700" fill="#A8842C" text-anchor="middle">Call</text>

  <!-- ============ MIDDLE: the signed call ============ -->
  <rect x="396" y="56" width="168" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="396" y="56" width="168" height="48" rx="14" fill="#0F766E"/>
  <rect x="396" y="82" width="168" height="22" fill="#0F766E"/>
  <text x="412" y="87" font-size="12.5" font-weight="700" fill="#ffffff">Kopo Kopo calls</text>

  <!-- envelope -->
  <rect x="420" y="140" width="120" height="86" rx="8" fill="#fefce8" stroke="#A8842C" stroke-width="1.5"/>
  <path d="M420 140 L480 200 L540 140" fill="none" stroke="#A8842C" stroke-width="1.5"/>
  <circle cx="480" cy="196" r="16" fill="#A8842C"/>
  <path d="M472 196 l6 6 l13 -14" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- signature badge -->
  <rect x="412" y="252" width="136" height="34" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="480" y="266" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">X-KopoKopo-Signature</text>
  <text x="480" y="279" font-size="8.5" fill="#6b7280" text-anchor="middle">verified before the till acts</text>

  <text x="480" y="320" font-size="10" fill="#6b7280" text-anchor="middle">The delivery:</text>
  <text x="480" y="336" font-size="10" fill="#6b7280" text-anchor="middle">who calls, with proof</text>

  <!-- flow arrow 2 -->
  <path d="M564 280 C 598 280, 608 280, 648 280" stroke="#A8842C" stroke-width="3.5" fill="none" stroke-dasharray="8 6" marker-end="url(#arr2)"/>
  <text x="614" y="268" font-size="10.5" font-weight="700" fill="#A8842C" text-anchor="middle">Verified</text>

  <!-- ============ RIGHT: the till acts ============ -->
  <rect x="664" y="56" width="280" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="664" y="56" width="280" height="48" rx="14" fill="#15803d"/>
  <rect x="664" y="82" width="280" height="22" fill="#15803d"/>
  <text x="688" y="87" font-size="13.5" font-weight="700" fill="#ffffff">2 · The till verifies &amp; matches</text>

  <!-- sale card -->
  <rect x="688" y="130" width="232" height="240" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="704" y="158" font-size="11.5" font-weight="700" fill="#374151">Sale #1042</text>
  <rect x="848" y="142" width="56" height="22" rx="11" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="876" y="157" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Matched</text>
  <text x="704" y="196" font-size="11" fill="#6b7280">M-Pesa · Buy Goods</text>
  <text x="888" y="222" font-size="16" font-weight="800" fill="#15803d" text-anchor="end">KES 1,500.00</text>
  <line x1="704" y1="240" x2="888" y2="240" stroke="#e5e7eb"/>
  <g font-size="10" fill="#374151">
    <circle cx="716" cy="266" r="7" fill="#15803d"/>
    <path d="M712 266 l3 3 l6 -7" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="734" y="270">Signature verified</text>
    <circle cx="716" cy="290" r="7" fill="#15803d"/>
    <path d="M712 290 l3 3 l6 -7" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="734" y="294">Matched &amp; closed</text>
    <circle cx="716" cy="314" r="7" fill="#15803d"/>
    <path d="M712 314 l3 3 l6 -7" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="734" y="318">Receipt · stock · shift</text>
  </g>
  <text x="804" y="354" font-size="9.5" fill="#9ca3af" text-anchor="middle">The action: what the till does</text>

  <!-- bottom bar -->
  <rect x="664" y="446" width="232" height="62" rx="12" fill="#15803d"/>
  <text x="780" y="470" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Only real payments close a sale</text>
  <text x="780" y="490" font-size="9.5" fill="#d1fae5" text-anchor="middle">No checking, no polling, no waiting</text>
</svg>
