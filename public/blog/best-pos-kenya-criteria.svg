<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="36" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Six criteria that decide the best POS for you</text>
  <text x="480" y="58" font-size="11" fill="#6b7280" text-anchor="middle">Score each one 1 to 5, then weight what your shop depends on.</text>

  <!-- Row 1 -->
  <rect x="40" y="90" width="278" height="176" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="72" cy="122" r="15" fill="#15803d"/>
  <text x="72" y="127" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="98" y="127" font-size="12.5" font-weight="700" fill="#1F2937">Native M-Pesa</text>
  <text x="64" y="158" font-size="10.5" fill="#374151">Customers pay by M-Pesa.</text>
  <text x="64" y="176" font-size="10.5" fill="#374151">A paid module taxes the way</text>
  <text x="64" y="194" font-size="10.5" fill="#374151">they already pay.</text>
  <text x="64" y="226" font-size="10" font-weight="700" fill="#15803d">Built in beats bolted on.</text>

  <rect x="341" y="90" width="278" height="176" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="373" cy="122" r="15" fill="#15803d"/>
  <text x="373" y="127" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="399" y="127" font-size="12.5" font-weight="700" fill="#1F2937">Offline selling</text>
  <text x="365" y="158" font-size="10.5" fill="#374151">The network drops. The till</text>
  <text x="365" y="176" font-size="10.5" fill="#374151">must keep ringing and</text>
  <text x="365" y="194" font-size="10.5" fill="#374151">reconcile when it returns.</text>
  <text x="365" y="226" font-size="10" font-weight="700" fill="#15803d">No line, no lost sales.</text>

  <rect x="642" y="90" width="278" height="176" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="674" cy="122" r="15" fill="#2563eb"/>
  <text x="674" y="127" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="700" y="127" font-size="12.5" font-weight="700" fill="#1F2937">One inventory</text>
  <text x="666" y="158" font-size="10.5" fill="#374151">The till and the online shop</text>
  <text x="666" y="176" font-size="10.5" fill="#374151">must agree — or you oversell</text>
  <text x="666" y="194" font-size="10.5" fill="#374151">the last item.</text>
  <text x="666" y="226" font-size="10" font-weight="700" fill="#2563eb">Two counts eventually disagree.</text>

  <!-- Row 2 -->
  <rect x="40" y="282" width="278" height="176" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="72" cy="314" r="15" fill="#A8842C"/>
  <text x="72" y="319" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
  <text x="98" y="319" font-size="12.5" font-weight="700" fill="#1F2937">Honest scaling</text>
  <text x="64" y="350" font-size="10.5" fill="#374151">Per lane, per user, per branch</text>
  <text x="64" y="368" font-size="10.5" fill="#374151">— pricing you can predict</text>
  <text x="64" y="386" font-size="10.5" fill="#374151">before you grow.</text>
  <text x="64" y="418" font-size="10" font-weight="700" fill="#A8842C">Pay for what you open.</text>

  <rect x="341" y="282" width="278" height="176" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="373" cy="314" r="15" fill="#A8842C"/>
  <text x="373" y="319" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
  <text x="399" y="319" font-size="12.5" font-weight="700" fill="#1F2937">Setup speed</text>
  <text x="365" y="350" font-size="10.5" fill="#374151">A shop cannot pause for a</text>
  <text x="365" y="368" font-size="10.5" fill="#374151">two-week rollout. Hours</text>
  <text x="365" y="386" font-size="10.5" fill="#374151">beat months.</text>
  <text x="365" y="418" font-size="10" font-weight="700" fill="#A8842C">Signup to first sale.</text>

  <rect x="642" y="282" width="278" height="176" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="674" cy="314" r="15" fill="#dc2626"/>
  <text x="674" y="319" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
  <text x="700" y="319" font-size="12.5" font-weight="700" fill="#1F2937">Three-year cost</text>
  <text x="666" y="350" font-size="10.5" fill="#374151">The number that matters —</text>
  <text x="666" y="368" font-size="10.5" fill="#374151">not the day-one price or the</text>
  <text x="666" y="386" font-size="10.5" fill="#374151">word free.</text>
  <text x="666" y="418" font-size="10" font-weight="700" fill="#dc2626">Let totals break the tie.</text>

  <!-- Banner -->
  <rect x="40" y="474" width="880" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="508" font-size="11.5" fill="#374151"><tspan font-weight="700" fill="#2563eb">Best means best fit.</tspan> The ranking is a shortlist; your counter is the judge.</text>
</svg>
