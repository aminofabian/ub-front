<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">End of day — a report that balances itself</text>

  <!-- ============ LEFT: shift report ============ -->
  <rect x="16" y="56" width="560" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="560" height="48" rx="14" fill="#1F2937"/>
  <rect x="16" y="82" width="560" height="22" fill="#1F2937"/>
  <text x="40" y="87" font-size="13.5" font-weight="700" fill="#ffffff">Shift report · Tue 25 Aug 2026</text>
  <text x="552" y="87" font-size="9.5" fill="#cbd5e1" text-anchor="end">Closed 8:02 PM</text>

  <!-- summary -->
  <rect x="40" y="126" width="246" height="64" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="148" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#6b7280">TOTAL SALES</text>
  <text x="60" y="176" font-size="18" font-weight="800" fill="#1F2937">KES 31,150</text>
  <rect x="298" y="126" width="246" height="64" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="318" y="148" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#15803d">M-PESA · KOPOKOPO</text>
  <text x="318" y="176" font-size="18" font-weight="800" fill="#15803d">KES 18,750</text>

  <!-- payment mix table -->
  <text x="40" y="228" font-size="11" font-weight="700" fill="#1F2937">Payment mix</text>
  <line x1="40" y1="240" x2="552" y2="240" stroke="#f0f0f0"/>
  <text x="40" y="266" font-size="11" font-weight="600" fill="#374151">Cash</text>
  <text x="40" y="282" font-size="9.5" fill="#6b7280">52 sales · counted in the drawer</text>
  <text x="552" y="278" font-size="12" font-weight="700" fill="#1F2937" text-anchor="end">KES 12,400</text>
  <line x1="40" y1="296" x2="552" y2="296" stroke="#f0f0f0"/>
  <text x="40" y="322" font-size="11" font-weight="600" fill="#374151">M-Pesa (Kopo Kopo)</text>
  <text x="40" y="338" font-size="9.5" fill="#6b7280">74 sales · matched by webhook, zero manual entries</text>
  <text x="552" y="334" font-size="12" font-weight="700" fill="#15803d" text-anchor="end">KES 18,750</text>
  <line x1="40" y1="352" x2="552" y2="352" stroke="#f0f0f0"/>
  <text x="40" y="378" font-size="11" font-weight="600" fill="#374151">Split (cash + M-Pesa)</text>
  <text x="40" y="394" font-size="9.5" fill="#6b7280">8 sales · one record, two payment lines</text>
  <text x="552" y="390" font-size="12" font-weight="700" fill="#1F2937" text-anchor="end">included above</text>

  <!-- note -->
  <rect x="40" y="420" width="512" height="62" rx="10" fill="#fefce8" stroke="#fde68a"/>
  <text x="60" y="444" font-size="10.5" font-weight="700" fill="#A8842C">Nothing to match by hand</text>
  <text x="60" y="464" font-size="9.5" fill="#6b7280">The M-Pesa total comes from Kopo Kopo confirmations, and it agrees with</text>
  <text x="60" y="477" font-size="9.5" fill="#6b7280">what hit the business account — the till and the bank tell the same story.</text>

  <!-- ============ RIGHT: the close ============ -->
  <rect x="604" y="56" width="340" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="604" y="56" width="340" height="48" rx="14" fill="#0F766E"/>
  <rect x="604" y="82" width="340" height="22" fill="#0F766E"/>
  <text x="628" y="87" font-size="13" font-weight="700" fill="#ffffff">The close</text>

  <g font-size="11" fill="#374151">
    <rect x="628" y="126" width="292" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <circle cx="652" cy="154" r="11" fill="#15803d"/>
    <path d="M646 154 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="676" y="150" font-size="11" font-weight="700" fill="#1F2937">Cash drawer counted</text>
    <text x="676" y="168" font-size="9.5" fill="#6b7280">KES 12,400 — matches the report</text>

    <rect x="628" y="192" width="292" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <circle cx="652" cy="220" r="11" fill="#15803d"/>
    <path d="M646 220 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="676" y="216" font-size="11" font-weight="700" fill="#1F2937">M-Pesa matches the account</text>
    <text x="676" y="234" font-size="9.5" fill="#6b7280">KES 18,750 — Kopo Kopo settlement</text>

    <rect x="628" y="258" width="292" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <circle cx="652" cy="286" r="11" fill="#15803d"/>
    <path d="M646 286 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="676" y="282" font-size="11" font-weight="700" fill="#1F2937">Disputes this shift</text>
    <text x="676" y="300" font-size="9.5" fill="#6b7280">0 — every payment tied to a sale</text>

    <rect x="628" y="324" width="292" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <circle cx="652" cy="352" r="11" fill="#15803d"/>
    <path d="M646 352 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="676" y="348" font-size="11" font-weight="700" fill="#1F2937">Shortage / overage</text>
    <text x="676" y="366" font-size="9.5" fill="#6b7280">KES 0.00 — the till balanced itself</text>
  </g>

  <rect x="628" y="406" width="292" height="82" rx="12" fill="#15803d"/>
  <text x="774" y="436" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">✓ Reconciled — closed in 4 minutes</text>
  <text x="774" y="460" font-size="9.5" fill="#d1fae5" text-anchor="middle">Same queue the shop has run all day —</text>
  <text x="774" y="475" font-size="9.5" fill="#d1fae5" text-anchor="middle">no phone, no notebook, no midnight matching.</text>
</svg>
