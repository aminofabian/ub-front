<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">STK Push at the till — what the cashier sees</text>

  <!-- ============ LEFT: the till states ============ -->
  <rect x="16" y="56" width="520" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="520" height="48" rx="14" fill="#1F2937"/>
  <rect x="16" y="82" width="520" height="22" fill="#1F2937"/>
  <text x="40" y="87" font-size="13.5" font-weight="700" fill="#ffffff">The till, step by step</text>

  <!-- state 1: ready -->
  <rect x="40" y="118" width="472" height="92" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="62" cy="138" r="11" fill="#0F766E"/>
  <text x="62" y="143" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="143" font-size="11" font-weight="700" fill="#1F2937">Ready</text>
  <rect x="56" y="158" width="188" height="30" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="68" y="178" font-size="10.5" fill="#1F2937">+254 712 345 678</text>
  <rect x="256" y="158" width="240" height="30" rx="8" fill="#28a745"/>
  <text x="376" y="178" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Send M-Pesa prompt</text>
  <text x="56" y="202" font-size="8.5" fill="#6b7280">Enter the customer's number — valid Kenyan mobile — then send.</text>

  <!-- state 2: sending -->
  <rect x="40" y="222" width="472" height="92" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="62" cy="242" r="11" fill="#0F766E"/>
  <text x="62" y="247" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="84" y="247" font-size="11" font-weight="700" fill="#1F2937">Sending</text>
  <rect x="56" y="262" width="336" height="30" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="70" y="282" font-size="10" font-weight="600" fill="#1d4ed8">Sending M-Pesa prompt… a few seconds</text>
  <rect x="404" y="262" width="92" height="30" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="450" y="282" font-size="9.5" fill="#6b7280" text-anchor="middle">Cancel M-Pesa</text>
  <text x="56" y="306" font-size="8.5" fill="#6b7280">The prompt is on its way to the customer's phone.</text>

  <!-- state 3: waiting -->
  <rect x="40" y="326" width="472" height="92" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="62" cy="346" r="11" fill="#0F766E"/>
  <text x="62" y="351" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="84" y="351" font-size="11" font-weight="700" fill="#1F2937">Waiting</text>
  <rect x="56" y="366" width="300" height="30" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="70" y="386" font-size="10" font-weight="600" fill="#1d4ed8">Waiting on +254 712 345 678…</text>
  <rect x="368" y="366" width="128" height="30" rx="8" fill="#ffffff" stroke="#0F766E"/>
  <text x="432" y="386" font-size="9.5" font-weight="700" fill="#0F766E" text-anchor="middle">Send again</text>
  <text x="56" y="410" font-size="8.5" fill="#6b7280">Customer confirms the amount and enters their PIN on their phone.</text>

  <!-- state 4: confirmed -->
  <rect x="40" y="430" width="472" height="92" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="62" cy="450" r="11" fill="#15803d"/>
  <path d="M56 450 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="455" font-size="11" font-weight="700" fill="#1F2937">Confirmed</text>
  <rect x="56" y="470" width="440" height="38" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="70" y="487" font-size="10" font-weight="700" fill="#15803d">✓ M-Pesa confirmed — KES 1,500.00, completing sale…</text>
  <text x="70" y="501" font-size="8.5" fill="#6b7280">Ref S8XK3F4L2M · receipt prints, stock drops, shift updates</text>

  <!-- ============ RIGHT: the customer's phone ============ -->
  <rect x="556" y="56" width="388" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="556" y="56" width="388" height="48" rx="14" fill="#0F766E"/>
  <rect x="556" y="82" width="388" height="22" fill="#0F766E"/>
  <text x="580" y="87" font-size="13.5" font-weight="700" fill="#ffffff">On the customer's phone</text>

  <!-- phone -->
  <rect x="636" y="120" width="228" height="360" rx="28" fill="#0a0a0a"/>
  <rect x="646" y="130" width="208" height="340" rx="20" fill="#ffffff"/>
  <rect x="646" y="130" width="208" height="36" rx="20" fill="#f3f4f6"/>
  <text x="750" y="154" font-size="10" font-weight="700" fill="#1F2937" text-anchor="middle">M-PESA</text>
  <circle cx="676" cy="143" r="3" fill="#0a0a0a"/>

  <circle cx="750" cy="196" r="20" fill="#f0fdf4" stroke="#28a745"/>
  <path d="M738 196 l8 8 l17 -19" stroke="#15803d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="750" y="240" font-size="10.5" font-weight="600" fill="#1F2937" text-anchor="middle">Confirm payment of</text>
  <text x="750" y="264" font-size="18" font-weight="800" fill="#15803d" text-anchor="middle">KES 1,500.00</text>
  <text x="750" y="284" font-size="8.5" fill="#6b7280" text-anchor="middle">to WANJIKU MINI-MART</text>
  <text x="750" y="300" font-size="8.5" fill="#6b7280" text-anchor="middle">STK Push · 1-Click</text>

  <rect x="700" y="326" width="100" height="36" rx="8" fill="#28a745"/>
  <text x="750" y="350" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Enter PIN</text>

  <!-- note -->
  <rect x="580" y="500" width="340" height="28" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="750" y="519" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">PIN in — the sale completes itself. No further steps.</text>
</svg>
