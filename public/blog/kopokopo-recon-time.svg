<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The nightly close — manual vs integrated</text>

  <!-- ============ LEFT: manual ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#6b7280"/>
  <rect x="16" y="82" width="440" height="22" fill="#6b7280"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">The manual close</text>

  <g font-size="11" fill="#374151">
    <rect x="40" y="126" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="148" font-size="11.5" font-weight="700" fill="#1F2937">📱 Scroll the M-Pesa messages</text>
    <text x="60" y="166" font-size="10.5" fill="#6b7280">Note every amount, then match to a sale</text>

    <rect x="40" y="188" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="210" font-size="11.5" font-weight="700" fill="#1F2937">🧾 Two ledgers, joined by hand</text>
    <text x="60" y="228" font-size="10.5" fill="#6b7280">The till record and the phone never meet</text>

    <rect x="40" y="250" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="272" font-size="11.5" font-weight="700" fill="#1F2937">🔍 Chase the mismatches</text>
    <text x="60" y="290" font-size="10.5" fill="#6b7280">Two KES 500 payments, one KES 500 sale</text>

    <rect x="40" y="312" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="334" font-size="11.5" font-weight="700" fill="#1F2937">🌙 Close: 9:47 PM — on a good night</text>
    <text x="60" y="352" font-size="10.5" fill="#6b7280">The harder the day, the worse the matching</text>
  </g>

  <rect x="40" y="384" width="392" height="62" rx="12" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="236" y="408" font-size="11.5" font-weight="800" fill="#4b5563" text-anchor="middle">25 minutes a night</text>
  <text x="236" y="430" font-size="10" fill="#6b7280" text-anchor="middle">≈ 125 hours a year — three work weeks, scrolling a phone</text>

  <!-- ============ RIGHT: integrated ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="504" y="82" width="440" height="22" fill="#15803d"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">The integrated close</text>

  <g font-size="11" fill="#374151">
    <rect x="528" y="126" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="148" font-size="11.5" font-weight="700" fill="#1F2937">⚡ Payments matched as they happen</text>
    <text x="548" y="166" font-size="10.5" fill="#6b7280">Signed confirmations close each sale on the spot</text>

    <rect x="528" y="188" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="210" font-size="11.5" font-weight="700" fill="#1F2937">📊 The shift totals itself</text>
    <text x="548" y="228" font-size="10.5" fill="#6b7280">Cash + M-Pesa in one report, one story</text>

    <rect x="528" y="250" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="272" font-size="11.5" font-weight="700" fill="#1F2937">🧯 Exceptions only — usually none</text>
    <text x="548" y="290" font-size="10.5" fill="#6b7280">An unmatched payment waits, visible, resolvable</text>

    <rect x="528" y="312" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="334" font-size="11.5" font-weight="700" fill="#1F2937">🌆 Close: 8:02 PM, in four minutes</text>
    <text x="548" y="352" font-size="10.5" fill="#6b7280">The M-Pesa column agrees with the business account</text>
  </g>

  <rect x="528" y="384" width="392" height="62" rx="12" fill="#15803d"/>
  <text x="724" y="408" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">The till did the matching, not your staff</text>
  <text x="724" y="430" font-size="10" fill="#d1fae5" text-anchor="middle">Reconciliation shrinks to the exceptions — and most days there are none</text>
</svg>
