<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Step 1 · Create your account</text>

  <!-- Step badge -->
  <circle cx="42" cy="34" r="16" fill="#A8842C"/>
  <text x="42" y="39" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

  <!-- ============ LEFT: Signup form ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="48" cy="88" r="13" fill="#28a745"/>
  <path d="M42 93 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="84" font-size="14" font-weight="700" fill="#1F2937">Kiosk</text>
  <text x="68" y="98" font-size="8.5" font-weight="600" letter-spacing="1.2" fill="#6b7280">RETAIL PLATFORM</text>

  <text x="40" y="142" font-size="17" font-weight="700" fill="#1F2937">Create your account</text>
  <text x="40" y="160" font-size="11.5" fill="#6b7280">Free to start — no card, no commitment.</text>

  <text x="40" y="192" font-size="9" font-weight="700" letter-spacing="1.2" fill="#6b7280">FULL NAME</text>
  <rect x="40" y="200" width="392" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="52" y="223" font-size="12.5" fill="#1F2937">Wanjiku Kamau</text>

  <text x="40" y="256" font-size="9" font-weight="700" letter-spacing="1.2" fill="#6b7280">EMAIL</text>
  <rect x="40" y="264" width="392" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="52" y="287" font-size="12.5" fill="#1F2937">wanjiku@example.com</text>

  <text x="40" y="320" font-size="9" font-weight="700" letter-spacing="1.2" fill="#6b7280">PASSWORD</text>
  <rect x="40" y="328" width="392" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="52" y="351" font-size="13" letter-spacing="2" fill="#1F2937">••••••••</text>
  <text x="40" y="382" font-size="10.5" fill="#6b7280">At least 8 characters.</text>

  <rect x="40" y="398" width="392" height="42" rx="10" fill="#28a745"/>
  <text x="236" y="424" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Create account</text>

  <line x1="40" y1="458" x2="432" y2="458" stroke="#f0f0f0"/>
  <text x="40" y="488" font-size="11.5" fill="#6b7280">Already have an account?</text>
  <text x="210" y="488" font-size="11.5" font-weight="700" fill="#15803d">Sign in</text>

  <!-- ============ RIGHT: Verify email + ready ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Email verification card -->
  <rect x="532" y="88" width="384" height="160" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="532" y="88" width="384" height="40" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="724" y="113" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Verify your email</text>

  <circle cx="568" cy="170" r="20" fill="#f0fdf4" stroke="#28a745"/>
  <path d="M556 170 l8 8 l16 -18" stroke="#15803d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="604" y="158" font-size="12" font-weight="700" fill="#1F2937">Check your inbox</text>
  <text x="604" y="176" font-size="10.5" fill="#6b7280">We sent a verification link to</text>
  <text x="604" y="190" font-size="10.5" font-weight="600" fill="#1F2937">wanjiku@example.com</text>
  <text x="604" y="212" font-size="10" fill="#15803d">Didn't get it? Resend →</text>

  <!-- Account ready card -->
  <rect x="532" y="272" width="384" height="150" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="556" y="300" font-size="13" font-weight="700" fill="#15803d">✓ Account ready in about 2 minutes</text>
  <g font-size="11" fill="#374151">
    <text x="556" y="326">· Email verified — your login works</text>
    <text x="556" y="348">· Free plan: 300 products &amp; one cashier</text>
    <text x="556" y="370">· M-Pesa and your storefront included</text>
    <text x="556" y="392">· Next: claim your shop (Step 2)</text>
  </g>

  <!-- What you need card -->
  <rect x="532" y="446" width="384" height="62" rx="12" fill="#fefce8" stroke="#fde68a"/>
  <text x="556" y="470" font-size="11" font-weight="700" fill="#A8842C">Before you start, have handy:</text>
  <text x="556" y="488" font-size="10.5" fill="#374151">Your KRA PIN, a phone number (for M-Pesa),</text>
  <text x="556" y="502" font-size="10.5" fill="#374151">and a rough idea of what you sell.</text>
</svg>
