<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The tax map — six obligations, one per row</text>

  <!-- ============ ROW 1 ============ -->
  <!-- eTIMS -->
  <rect x="16" y="56" width="300" height="190" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="300" height="40" rx="14" fill="#1F2937"/>
  <rect x="16" y="82" width="300" height="14" fill="#1F2937"/>
  <text x="166" y="82" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">eTIMS invoicing</text>
  <text x="36" y="128" font-size="11.5" font-weight="700" fill="#1F2937">Every sale, in real time</text>
  <text x="36" y="150" font-size="10.5" fill="#6b7280">Invoice → AUTH code → QR code →</text>
  <text x="36" y="166" font-size="10.5" fill="#6b7280">sale logged with KRA automatically.</text>
  <rect x="36" y="188" width="100" height="24" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="86" y="204" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">NO TAX ITSELF</text>

  <!-- Turnover tax -->
  <rect x="330" y="56" width="300" height="190" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="330" y="56" width="300" height="40" rx="14" fill="#A8842C"/>
  <rect x="330" y="82" width="300" height="14" fill="#A8842C"/>
  <text x="480" y="82" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Turnover tax (TOT)</text>
  <text x="350" y="128" font-size="11.5" font-weight="700" fill="#1F2937">The default for mini-marts</text>
  <text x="350" y="150" font-size="10.5" fill="#6b7280">Turnover KSh 1M–25M a year, flat</text>
  <text x="350" y="166" font-size="10.5" fill="#6b7280">3% of gross turnover — no deductions.</text>
  <rect x="350" y="188" width="120" height="24" rx="12" fill="#fefce8" stroke="#fde68a"/>
  <text x="410" y="204" font-size="9.5" font-weight="700" fill="#A8842C" text-anchor="middle">3% · BY THE 20TH</text>

  <!-- VAT -->
  <rect x="644" y="56" width="300" height="190" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="644" y="56" width="300" height="40" rx="14" fill="#1F2937"/>
  <rect x="644" y="82" width="300" height="14" fill="#1F2937"/>
  <text x="794" y="82" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">VAT</text>
  <text x="664" y="128" font-size="11.5" font-weight="700" fill="#1F2937">Only above the line</text>
  <text x="664" y="150" font-size="10.5" fill="#6b7280">Mandatory once annual turnover</text>
  <text x="664" y="166" font-size="10.5" fill="#6b7280">passes KSh 8M · 16% standard rate.</text>
  <rect x="664" y="188" width="150" height="24" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="739" y="204" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">16% · OVER KSh 8M</text>

  <!-- ============ ROW 2 ============ -->
  <!-- Income tax -->
  <rect x="16" y="262" width="300" height="190" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="262" width="300" height="40" rx="14" fill="#1F2937"/>
  <rect x="16" y="288" width="300" height="14" fill="#1F2937"/>
  <text x="166" y="288" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Income tax</text>
  <text x="36" y="334" font-size="11.5" font-weight="700" fill="#1F2937">On profits, not turnover</text>
  <text x="36" y="356" font-size="10.5" fill="#6b7280">Sole proprietors: 10–30% on what's</text>
  <text x="36" y="372" font-size="10.5" fill="#6b7280">left after genuine expenses.</text>
  <rect x="36" y="394" width="110" height="24" rx="12" fill="#fefce8" stroke="#fde68a"/>
  <text x="91" y="410" font-size="9.5" font-weight="700" fill="#A8842C" text-anchor="middle">10–30% · 30 JUNE</text>

  <!-- PAYE -->
  <rect x="330" y="262" width="300" height="190" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="330" y="262" width="300" height="40" rx="14" fill="#1F2937"/>
  <rect x="330" y="288" width="300" height="14" fill="#1F2937"/>
  <text x="480" y="288" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">PAYE</text>
  <text x="350" y="334" font-size="11.5" font-weight="700" fill="#1F2937">Staff only</text>
  <text x="350" y="356" font-size="10.5" fill="#6b7280">Deducted from salaries at source,</text>
  <text x="350" y="372" font-size="10.5" fill="#6b7280">remitted monthly. Most low-wage</text>
  <text x="350" y="388" font-size="10.5" fill="#6b7280">retail staff owe little or nothing.</text>
  <rect x="350" y="394" width="110" height="24" rx="12" fill="#fefce8" stroke="#fde68a"/>
  <text x="405" y="410" font-size="9.5" font-weight="700" fill="#A8842C" text-anchor="middle">BY THE 9TH</text>

  <!-- Excise -->
  <rect x="644" y="262" width="300" height="190" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="644" y="262" width="300" height="40" rx="14" fill="#A8842C"/>
  <rect x="644" y="288" width="300" height="14" fill="#A8842C"/>
  <text x="794" y="288" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Excise duty</text>
  <text x="664" y="334" font-size="11.5" font-weight="700" fill="#1F2937">Already in your prices</text>
  <text x="664" y="356" font-size="10.5" fill="#6b7280">Sodas, juices, cigarettes — duty paid</text>
  <text x="664" y="372" font-size="10.5" fill="#6b7280">at source, embedded in wholesale.</text>
  <rect x="664" y="394" width="120" height="24" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="724" y="410" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">NOTHING TO FILE</text>

  <!-- Bottom strip -->
  <rect x="16" y="472" width="928" height="64" rx="14" fill="#fefce8" stroke="#fde68a"/>
  <text x="480" y="500" font-size="12" font-weight="700" fill="#A8842C" text-anchor="middle">Most mini-marts live in two rows: eTIMS invoicing + turnover tax (3%)</text>
  <text x="480" y="520" font-size="10.5" fill="#374151" text-anchor="middle">VAT, income tax, and PAYE only appear as the shop grows or hires.</text>
</svg>
