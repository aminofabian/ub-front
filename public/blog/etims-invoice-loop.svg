<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">How an eTIMS invoice gets authorized — in seconds</text>

  <!-- ============ NODE 1: Till ============ -->
  <rect x="16" y="96" width="200" height="150" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="96" width="200" height="40" rx="14" fill="#1F2937"/>
  <rect x="16" y="122" width="200" height="14" fill="#1F2937"/>
  <text x="116" y="122" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1 · The till</text>
  <text x="36" y="166" font-size="11" fill="#374151">Customer buys goods,</text>
  <text x="36" y="184" font-size="11" fill="#374151">cashier completes the</text>
  <text x="36" y="202" font-size="11" fill="#374151">sale — the till builds</text>
  <text x="36" y="220" font-size="11" fill="#374151">the invoice automatically.</text>

  <!-- Arrow 1 -->
  <path d="M216 171 L266 171" stroke="#A8842C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M262 165 L272 171 L262 177" fill="#A8842C"/>
  <text x="241" y="160" font-size="10" fill="#6b7280" text-anchor="middle">invoice</text>

  <!-- ============ NODE 2: KRA ============ -->
  <rect x="272" y="70" width="200" height="202" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="272" y="70" width="200" height="40" rx="14" fill="#A8842C"/>
  <rect x="272" y="96" width="200" height="14" fill="#A8842C"/>
  <text x="372" y="96" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2 · KRA eTIMS</text>
  <text x="292" y="140" font-size="11" fill="#374151">KRA checks the invoice</text>
  <text x="292" y="158" font-size="11" fill="#374151">and returns an</text>
  <text x="292" y="176" font-size="11" fill="#374151">authorization (AUTH)</text>
  <text x="292" y="194" font-size="11" fill="#374151">code in real time.</text>
  <rect x="292" y="216" width="160" height="36" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="372" y="239" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">AUTH: KRA-9F2A-77</text>

  <!-- Arrow 2 -->
  <path d="M472 171 L522 171" stroke="#A8842C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M518 165 L528 171 L518 177" fill="#A8842C"/>
  <text x="500" y="160" font-size="10" fill="#6b7280" text-anchor="middle">code</text>

  <!-- ============ NODE 3: Receipt ============ -->
  <rect x="528" y="96" width="200" height="150" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="528" y="96" width="200" height="40" rx="14" fill="#1F2937"/>
  <rect x="528" y="122" width="200" height="14" fill="#1F2937"/>
  <text x="628" y="122" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3 · The receipt</text>
  <text x="548" y="166" font-size="11" fill="#374151">Prints with the AUTH</text>
  <text x="548" y="184" font-size="11" fill="#374151">code and a QR code the</text>
  <text x="548" y="202" font-size="11" fill="#374151">customer can verify.</text>
  <!-- QR placeholder -->
  <rect x="676" y="152" width="52" height="52" rx="6" fill="#1F2937"/>
  <rect x="684" y="160" width="10" height="10" fill="#ffffff"/>
  <rect x="700" y="160" width="8" height="10" fill="#ffffff"/>
  <rect x="684" y="176" width="10" height="8" fill="#ffffff"/>
  <rect x="700" y="176" width="8" height="8" fill="#ffffff"/>
  <rect x="684" y="190" width="6" height="6" fill="#ffffff"/>

  <!-- Arrow 3 -->
  <path d="M728 171 L778 171" stroke="#A8842C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M774 165 L784 171 L774 177" fill="#A8842C"/>

  <!-- ============ NODE 4: Customer ============ -->
  <rect x="784" y="96" width="160" height="150" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="784" y="96" width="160" height="40" rx="14" fill="#1F2937"/>
  <rect x="784" y="122" width="160" height="14" fill="#1F2937"/>
  <text x="864" y="122" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4 · Customer</text>
  <text x="804" y="166" font-size="11" fill="#374151">Gets a valid tax</text>
  <text x="804" y="184" font-size="11" fill="#374151">invoice. No manual</text>
  <text x="804" y="202" font-size="11" fill="#374151">steps anywhere.</text>

  <!-- ============ Sync strip ============ -->
  <rect x="16" y="400" width="928" height="120" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="480" y="432" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">The sale is now in KRA's records — before the customer leaves the shop</text>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="480" y="458">· Month-end reporting becomes a download, not a reconstruction.</text>
    <text x="480" y="478">· Your declared turnover can't quietly drift from what KRA already saw.</text>
    <text x="480" y="498">· With a POS, this whole loop is automatic — nobody retypes a thing.</text>
  </g>
</svg>
