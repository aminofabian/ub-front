<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Payment not in your sales? Diagnose in five checks</text>

  <!-- ============ LEFT: the five checks ============ -->
  <rect x="16" y="56" width="680" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="680" height="48" rx="14" fill="#1F2937"/>
  <rect x="16" y="82" width="680" height="22" fill="#1F2937"/>
  <text x="40" y="87" font-size="13.5" font-weight="700" fill="#ffffff">Five checks, in order</text>

  <g>
    <!-- 1 -->
    <rect x="40" y="118" width="632" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="62" cy="136" r="12" fill="#0F766E"/>
    <text x="62" y="141" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="86" y="141" font-size="11.5" font-weight="700" fill="#1F2937">Is the gateway connected at all?</text>
    <text x="86" y="162" font-size="9.5" fill="#6b7280">Symptom: payments never appear — a Manual “Mpesa Till” only prints instructions.</text>
    <text x="86" y="180" font-size="9.5" fill="#15803d">Fix: connect KopoKopo under Payments → Accept payments.</text>

    <!-- 2 -->
    <rect x="40" y="200" width="632" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="62" cy="218" r="12" fill="#0F766E"/>
    <text x="62" y="223" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="86" y="223" font-size="11.5" font-weight="700" fill="#1F2937">Is the gateway ACTIVE?</text>
    <text x="86" y="244" font-size="9.5" fill="#6b7280">Symptom: the “KopoKopo is not active yet” banner shows in Payments.</text>
    <text x="86" y="262" font-size="9.5" fill="#15803d">Fix: Manage → Test connection → Activate.</text>

    <!-- 3 -->
    <rect x="40" y="282" width="632" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="62" cy="300" r="12" fill="#0F766E"/>
    <text x="62" y="305" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="86" y="305" font-size="11.5" font-weight="700" fill="#1F2937">Are till webhooks subscribed?</text>
    <text x="86" y="326" font-size="9.5" fill="#6b7280">Symptom: STK Push works, but Buy Goods till payments don't sync.</text>
    <text x="86" y="344" font-size="9.5" fill="#15803d">Fix: Subscribe till webhooks on the ACTIVE KopoKopo row.</text>

    <!-- 4 -->
    <rect x="40" y="364" width="632" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="62" cy="382" r="12" fill="#0F766E"/>
    <text x="62" y="387" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="86" y="387" font-size="11.5" font-weight="700" fill="#1F2937">Is the environment the right one?</text>
    <text x="86" y="408" font-size="9.5" fill="#6b7280">Symptom: sandbox keys on a production till, or testing in sandbox only.</text>
    <text x="86" y="426" font-size="9.5" fill="#15803d">Fix: use the environment where customers actually pay.</text>

    <!-- 5 -->
    <rect x="40" y="446" width="632" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="62" cy="464" r="12" fill="#0F766E"/>
    <text x="62" y="469" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
    <text x="86" y="469" font-size="11.5" font-weight="700" fill="#1F2937">Is the till in the webhook list?</text>
    <text x="86" y="490" font-size="9.5" fill="#6b7280">Symptom: money landed, no sale matches — customer paid a different till.</text>
    <text x="86" y="508" font-size="9.5" fill="#15803d">Fix: add that till to Webhook tills, then subscribe again.</text>
  </g>

  <!-- ============ RIGHT: ground truth ============ -->
  <rect x="716" y="56" width="228" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="716" y="56" width="228" height="48" rx="14" fill="#0F766E"/>
  <rect x="716" y="82" width="228" height="22" fill="#0F766E"/>
  <text x="736" y="87" font-size="12.5" font-weight="700" fill="#ffffff">Before anything</text>

  <rect x="732" y="118" width="196" height="120" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="748" y="140" font-size="9" font-weight="700" letter-spacing="1.2" fill="#6b7280">GROUND TRUTH</text>
  <text x="748" y="160" font-size="10" font-weight="600" fill="#1F2937">Did the payment happen?</text>
  <text x="748" y="180" font-size="9" fill="#6b7280">Check the business account</text>
  <text x="748" y="194" font-size="9" fill="#6b7280">and the customer's phone.</text>
  <text x="748" y="214" font-size="9" fill="#6b7280">A cancelled prompt is not</text>
  <text x="748" y="228" font-size="9" fill="#6b7280">a sync problem.</text>

  <rect x="732" y="250" width="196" height="120" rx="10" fill="#fefce8" stroke="#fde68a"/>
  <text x="748" y="272" font-size="9" font-weight="700" letter-spacing="1.2" fill="#A8842C">THEN RUN THE FIVE</text>
  <text x="748" y="294" font-size="9.5" fill="#374151">Most causes are one of:</text>
  <text x="748" y="312" font-size="9" fill="#6b7280">· not connected</text>
  <text x="748" y="328" font-size="9" fill="#6b7280">· not active</text>
  <text x="748" y="344" font-size="9" fill="#6b7280">· webhooks not subscribed</text>
  <text x="748" y="360" font-size="9" fill="#6b7280">· wrong environment or till</text>

  <rect x="732" y="382" width="196" height="110" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="830" y="406" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Most fixes take</text>
  <text x="830" y="424" font-size="14" font-weight="800" fill="#15803d" text-anchor="middle">under 5 minutes</text>
  <text x="830" y="446" font-size="9" fill="#6b7280" text-anchor="middle">And the pattern that repeats:</text>
  <text x="830" y="462" font-size="9" fill="#6b7280" text-anchor="middle">the fix is integration,</text>
  <text x="830" y="478" font-size="9" fill="#6b7280" text-anchor="middle">not more manual checking.</text>
</svg>
