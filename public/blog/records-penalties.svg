<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Records and penalties — five years of proof, four ways to pay</text>

  <!-- ============ LEFT: five-year records ============ -->
  <rect x="16" y="64" width="440" height="420" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="64" width="440" height="48" rx="14" fill="#1F2937"/>
  <rect x="16" y="90" width="440" height="22" fill="#1F2937"/>
  <text x="236" y="95" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Keep for 5 years (Tax Procedures Act)</text>

  <rect x="40" y="132" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="68" cy="158" r="11" fill="#28a745"/>
  <path d="M62 158 l4 4 l8 -9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="153" font-size="11.5" font-weight="700" fill="#1F2937">Sales records</text>
  <text x="92" y="170" font-size="10" fill="#6b7280">Every sale, every day — till data with invoice numbers</text>

  <rect x="40" y="194" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="68" cy="220" r="11" fill="#28a745"/>
  <path d="M62 220 l4 4 l8 -9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="215" font-size="11.5" font-weight="700" fill="#1F2937">Purchase invoices</text>
  <text x="92" y="232" font-size="10" fill="#6b7280">What you bought from every supplier</text>

  <rect x="40" y="256" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="68" cy="282" r="11" fill="#28a745"/>
  <path d="M62 282 l4 4 l8 -9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="277" font-size="11.5" font-weight="700" fill="#1F2937">Stock movements</text>
  <text x="92" y="294" font-size="10" fill="#6b7280">In, out, and on the shelf</text>

  <rect x="40" y="318" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="68" cy="344" r="11" fill="#28a745"/>
  <path d="M62 344 l4 4 l8 -9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="339" font-size="11.5" font-weight="700" fill="#1F2937">Payroll &amp; PAYE</text>
  <text x="92" y="356" font-size="10" fill="#6b7280">Wages, deductions, remittances</text>

  <rect x="40" y="380" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="68" cy="406" r="11" fill="#28a745"/>
  <path d="M62 406 l4 4 l8 -9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="401" font-size="11.5" font-weight="700" fill="#1F2937">Bank &amp; M-Pesa statements</text>
  <text x="92" y="418" font-size="10" fill="#6b7280">The money trail in and out</text>

  <!-- ============ RIGHT: penalties ============ -->
  <rect x="504" y="64" width="440" height="420" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="528" y="96" font-size="12.5" font-weight="700" fill="#1F2937">What going wrong costs</text>

  <rect x="528" y="116" width="392" height="64" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="548" y="142" font-size="11.5" font-weight="700" fill="#b91c1c">Return filed late</text>
  <text x="548" y="162" font-size="10.5" fill="#374151">A monthly penalty per return, every month it stays unfiled.</text>

  <rect x="528" y="192" width="392" height="64" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="548" y="218" font-size="11.5" font-weight="700" fill="#b91c1c">Tax paid late</text>
  <text x="548" y="238" font-size="10.5" fill="#374151">Interest of 1% per month on the unpaid amount — it compounds.</text>

  <rect x="528" y="268" width="392" height="64" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="548" y="294" font-size="11.5" font-weight="700" fill="#b91c1c">Incorrect or incomplete records</text>
  <text x="548" y="314" font-size="10.5" fill="#374151">Penalties on top of the tax itself — plus audit attention.</text>

  <rect x="528" y="344" width="392" height="64" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="548" y="370" font-size="11.5" font-weight="700" fill="#b91c1c">No eTIMS invoice issued</text>
  <text x="548" y="390" font-size="10.5" fill="#374151">Fine of up to KSh 1 million and/or imprisonment up to 3 years.</text>

  <rect x="528" y="424" width="392" height="36" rx="8" fill="#fefce8" stroke="#fde68a"/>
  <text x="724" y="447" font-size="10.5" font-weight="700" fill="#A8842C" text-anchor="middle">Figures as of 2026 — confirm current rates with KRA</text>
</svg>
