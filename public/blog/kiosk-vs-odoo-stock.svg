<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">One stock number, everywhere</text>

  <!-- Center VS badge -->
  <circle cx="480" cy="296" r="30" fill="#A8842C"/>
  <text x="480" y="303" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">VS</text>

  <!-- ============ LEFT PANEL: Kiosk.ke — one shared inventory ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="16" y="82" width="440" height="22" fill="#15803d"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">Kiosk.ke — one shared count</text>

  <!-- Central stock number -->
  <circle cx="236" cy="204" r="52" fill="#f0fdf4" stroke="#28a745" stroke-width="2.5"/>
  <text x="236" y="198" font-size="26" font-weight="800" fill="#15803d" text-anchor="middle">24</text>
  <text x="236" y="218" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">UNITS · SUNBEST OIL 1L</text>

  <!-- Channels feeding the one count -->
  <rect x="52" y="286" width="368" height="40" rx="9" fill="#ffffff" stroke="#d1d5db"/>
  <text x="236" y="300" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">🏪 Counter till</text>
  <text x="236" y="316" font-size="10.5" fill="#6b7280" text-anchor="middle">Sale at the shop → stock -1</text>

  <rect x="52" y="334" width="368" height="40" rx="9" fill="#ffffff" stroke="#d1d5db"/>
  <text x="236" y="348" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">🌐 Online storefront</text>
  <text x="236" y="364" font-size="10.5" fill="#6b7280" text-anchor="middle">Order on yourshop.kiosk.ke → same stock -1</text>

  <rect x="52" y="382" width="368" height="40" rx="9" fill="#ffffff" stroke="#d1d5db"/>
  <text x="236" y="396" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">📦 Supplier order received</text>
  <text x="236" y="412" font-size="10.5" fill="#6b7280" text-anchor="middle">Receive goods → stock +24, all in the same number</text>

  <!-- Left footer -->
  <rect x="52" y="448" width="368" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="236" y="470" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">One number, zero reconciliation</text>
  <text x="236" y="488" font-size="10.5" fill="#374151" text-anchor="middle">No end-of-day spreadsheet matching. Ever.</text>

  <!-- ============ RIGHT PANEL: Odoo — separate modules needing sync ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#374151"/>
  <rect x="504" y="82" width="440" height="22" fill="#374151"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">Odoo — many numbers to keep in step</text>

  <!-- Module cards -->
  <rect x="528" y="130" width="176" height="96" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="616" y="152" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Warehouse</text>
  <text x="616" y="170" font-size="22" font-weight="800" fill="#374151" text-anchor="middle">26</text>
  <text x="616" y="190" font-size="9.5" fill="#6b7280" text-anchor="middle">units on hand</text>
  <text x="616" y="210" font-size="9" fill="#b91c1c" text-anchor="middle">source of truth (?)</text>

  <rect x="716" y="130" width="204" height="96" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="818" y="152" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">eCommerce</text>
  <text x="818" y="170" font-size="22" font-weight="800" fill="#374151" text-anchor="middle">21</text>
  <text x="818" y="190" font-size="9.5" fill="#6b7280" text-anchor="middle">units shown online</text>
  <text x="818" y="210" font-size="9" fill="#b91c1c" text-anchor="middle">oversells if stale ⚠</text>

  <rect x="528" y="238" width="176" height="96" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="616" y="260" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Point of Sale</text>
  <text x="616" y="278" font-size="22" font-weight="800" fill="#374151" text-anchor="middle">23</text>
  <text x="616" y="298" font-size="9.5" fill="#6b7280" text-anchor="middle">units at the counter</text>
  <text x="616" y="318" font-size="9" fill="#b91c1c" text-anchor="middle">sync pending…</text>

  <rect x="716" y="238" width="204" height="96" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="818" y="260" font-size="11.5" font-weight="700" fill="#1F2937" text-anchor="middle">Purchases</text>
  <text x="818" y="278" font-size="22" font-weight="800" fill="#374151" text-anchor="middle">4</text>
  <text x="818" y="298" font-size="9.5" fill="#6b7280" text-anchor="middle">units in transit</text>
  <text x="818" y="318" font-size="9" fill="#6b7280" text-anchor="middle">to be received…</text>

  <!-- Sync arrows -->
  <g stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="4 3" fill="none">
    <path d="M616 226 C 616 232, 616 232, 616 238"/>
    <path d="M818 226 C 818 232, 818 232, 818 238"/>
    <path d="M704 178 L 716 178"/>
    <path d="M704 286 L 716 286"/>
  </g>
  <text x="608" y="122" font-size="9" fill="#b91c1c" text-anchor="middle">sync</text>
  <text x="816" y="122" font-size="9" fill="#b91c1c" text-anchor="middle">sync</text>

  <!-- Right footer -->
  <rect x="528" y="352" width="392" height="52" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="724" y="374" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Four numbers, one shelf</text>
  <text x="724" y="392" font-size="10.5" fill="#7f1d1d" text-anchor="middle">When they disagree, customers find out first.</text>
  <text x="724" y="430" font-size="11" fill="#6b7280" text-anchor="middle">Odoo can reconcile this — with cron jobs, automated actions,</text>
  <text x="724" y="446" font-size="11" fill="#6b7280" text-anchor="middle">and an Odoo specialist on retainer to keep it honest.</text>
  <text x="724" y="490" font-size="11.5" fill="#9ca3af" text-anchor="middle">Kiosk.ke just… counts once.</text>
</svg>
