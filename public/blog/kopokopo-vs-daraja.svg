<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The same rails — the question is who builds the rest</text>

  <!-- ============ LEFT: direct Daraja ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#6b7280"/>
  <rect x="16" y="82" width="440" height="22" fill="#6b7280"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">Direct Daraja API</text>

  <!-- stack -->
  <rect x="86" y="120" width="300" height="84" rx="10" fill="#15803d"/>
  <text x="236" y="152" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Safaricom M-Pesa</text>
  <text x="236" y="172" font-size="9.5" fill="#d1fae5" text-anchor="middle">The rails — where the money moves</text>

  <path d="M236 210 L236 228" stroke="#A8842C" stroke-width="3" fill="none" marker-end="url(#arr4)"/>
  <defs>
    <marker id="arr4" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#A8842C"/>
    </marker>
  </defs>

  <rect x="86" y="236" width="300" height="84" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="236" y="268" font-size="12" font-weight="800" fill="#4b5563" text-anchor="middle">Daraja API</text>
  <text x="236" y="288" font-size="9.5" fill="#6b7280" text-anchor="middle">Safaricom's developer interface — raw</text>

  <path d="M236 326 L236 344" stroke="#A8842C" stroke-width="3" fill="none" marker-end="url(#arr4)"/>

  <rect x="86" y="352" width="300" height="84" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <text x="236" y="384" font-size="12" font-weight="800" fill="#1F2937" text-anchor="middle">Your till / software</text>
  <text x="236" y="404" font-size="9.5" fill="#6b7280" text-anchor="middle">You build everything around the pipe</text>

  <rect x="40" y="456" width="392" height="56" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="478" font-size="10" font-weight="700" fill="#4b5563">You build &amp; maintain it all:</text>
  <text x="60" y="496" font-size="9.5" fill="#6b7280">auth, callbacks, retries, reconciliation — with a developer team</text>

  <!-- ============ RIGHT: Kopo Kopo ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#0F766E"/>
  <rect x="504" y="82" width="440" height="22" fill="#0F766E"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">Kopo Kopo, built on the same rails</text>

  <rect x="574" y="120" width="300" height="84" rx="10" fill="#15803d"/>
  <text x="724" y="152" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Safaricom M-Pesa</text>
  <text x="724" y="172" font-size="9.5" fill="#d1fae5" text-anchor="middle">The rails — where the money moves</text>

  <path d="M724 210 L724 228" stroke="#A8842C" stroke-width="3" fill="none" marker-end="url(#arr4)"/>

  <rect x="574" y="236" width="300" height="84" rx="10" fill="#E0F2F1" stroke="#0F766E" stroke-width="1.5"/>
  <text x="724" y="266" font-size="12" font-weight="800" fill="#0F766E" text-anchor="middle">Kopo Kopo</text>
  <text x="724" y="286" font-size="9.5" fill="#134e4a" text-anchor="middle">signed webhooks · till matching · send money</text>

  <path d="M724 326 L724 344" stroke="#A8842C" stroke-width="3" fill="none" marker-end="url(#arr4)"/>

  <rect x="574" y="352" width="300" height="84" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="724" y="384" font-size="12" font-weight="800" fill="#1F2937" text-anchor="middle">Your POS — Kiosk</text>
  <text x="724" y="404" font-size="9.5" fill="#6b7280" text-anchor="middle">built in — nothing to build or maintain</text>

  <rect x="528" y="456" width="392" height="56" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="548" y="478" font-size="10" font-weight="700" fill="#15803d">Maintained for you:</text>
  <text x="548" y="496" font-size="9.5" fill="#6b7280">verified webhooks, till matching, and someone to call when it breaks</text>
</svg>
