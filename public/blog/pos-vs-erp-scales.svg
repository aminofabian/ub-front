<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Two different jobs, two different tools</text>

  <!-- Center VS badge -->
  <circle cx="480" cy="300" r="32" fill="#A8842C"/>
  <text x="480" y="308" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">VS</text>

  <!-- ============ LEFT: POS — the counter ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="16" y="82" width="440" height="22" fill="#15803d"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">POS — runs the counter</text>
  <rect x="352" y="66" width="80" height="24" rx="12" fill="#ffffff"/>
  <text x="392" y="82" font-size="9.5" font-weight="800" fill="#15803d" text-anchor="middle">LIVE TODAY</text>

  <g font-size="11.5" fill="#374151">
    <rect x="40" y="126" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="60" y="148" font-size="12" font-weight="700" fill="#1F2937">📱 The till, on your phone</text>
    <text x="60" y="166" font-size="10.5" fill="#6b7280">Set up in minutes — no IT project</text>

    <rect x="40" y="188" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="60" y="210" font-size="12" font-weight="700" fill="#1F2937">📲 Native M-Pesa</text>
    <text x="60" y="228" font-size="10.5" fill="#6b7280">STK Push built in — one tap, auto-credited</text>

    <rect x="40" y="250" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="60" y="272" font-size="12" font-weight="700" fill="#1F2937">🌐 Storefront included</text>
    <text x="60" y="290" font-size="10.5" fill="#6b7280">yourshop.kiosk.ke, live the same day</text>

    <rect x="40" y="312" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="60" y="334" font-size="12" font-weight="700" fill="#1F2937">📦 One inventory</text>
    <text x="60" y="352" font-size="10.5" fill="#6b7280">Counter, web, and supplies — one count</text>

    <rect x="40" y="374" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="60" y="396" font-size="12" font-weight="700" fill="#1F2937">🧾 eTIMS-ready</text>
    <text x="60" y="414" font-size="10.5" fill="#6b7280">Invoices per sale, ready for KRA reporting</text>
  </g>

  <rect x="40" y="448" width="392" height="64" rx="12" fill="#15803d"/>
  <text x="236" y="472" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Answering one question: what did we sell today?</text>
  <text x="236" y="494" font-size="10.5" fill="#d1fae5" text-anchor="middle">Built for the counter that rings all day.</text>

  <!-- ============ RIGHT: ERP — the company ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#374151"/>
  <rect x="504" y="82" width="440" height="22" fill="#374151"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">ERP — runs the company</text>
  <rect x="836" y="66" width="88" height="24" rx="12" fill="#ffffff"/>
  <text x="880" y="82" font-size="9.5" font-weight="800" fill="#374151" text-anchor="middle">MONTHS TO RUN</text>

  <g font-size="11.5" fill="#374151">
    <rect x="528" y="126" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="548" y="148" font-size="12" font-weight="700" fill="#1F2937">🧑‍💼 HR &amp; payroll</text>
    <text x="548" y="166" font-size="10.5" fill="#6b7280">Roles, shifts, salaries — for teams of dozens</text>

    <rect x="528" y="188" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="548" y="210" font-size="12" font-weight="700" fill="#1F2937">📒 Full double-entry accounting</text>
    <text x="548" y="228" font-size="10.5" fill="#6b7280">A chart of accounts feeding auditors &amp; lenders</text>

    <rect x="528" y="250" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="548" y="272" font-size="12" font-weight="700" fill="#1F2937">🏭 Manufacturing (BOMs)</text>
    <text x="548" y="290" font-size="10.5" fill="#6b7280">Raw materials → finished goods, routed &amp; planned</text>

    <rect x="528" y="312" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="548" y="334" font-size="12" font-weight="700" fill="#1F2937">🏬 Multi-warehouse logistics</text>
    <text x="548" y="352" font-size="10.5" fill="#6b7280">Locations, transfers, and complex supply chains</text>

    <rect x="528" y="374" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="548" y="396" font-size="12" font-weight="700" fill="#1F2937">🤝 CRM &amp; business-wide modules</text>
    <text x="548" y="414" font-size="10.5" fill="#6b7280">Every department, one system</text>
  </g>

  <rect x="528" y="448" width="392" height="64" rx="12" fill="#374151"/>
  <text x="724" y="472" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Answering: how is the whole company doing?</text>
  <text x="724" y="494" font-size="10.5" fill="#d1d5db" text-anchor="middle">Built for the enterprise that runs many machines.</text>
</svg>
