<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">What changes when payments are integrated</text>

  <!-- ============ LEFT: manual ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#6b7280"/>
  <rect x="16" y="82" width="440" height="22" fill="#6b7280"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">The manual way</text>

  <g font-size="11" fill="#374151">
    <rect x="40" y="126" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="148" font-size="11.5" font-weight="700" fill="#1F2937">📱 Messages checked by hand</text>
    <text x="60" y="166" font-size="10.5" fill="#6b7280">Matching M-Pesa to sales from a phone</text>

    <rect x="40" y="188" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="210" font-size="11.5" font-weight="700" fill="#1F2937">🧾 Sales and payments in two places</text>
    <text x="60" y="228" font-size="10.5" fill="#6b7280">The till record and the phone never meet</text>

    <rect x="40" y="250" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="272" font-size="11.5" font-weight="700" fill="#1F2937">🌙 Close takes an hour</text>
    <text x="60" y="290" font-size="10.5" fill="#6b7280">Mismatches surface after everyone's left</text>

    <rect x="40" y="312" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="334" font-size="11.5" font-weight="700" fill="#1F2937">⚠️ Disputes settle on memory</text>
    <text x="60" y="352" font-size="10.5" fill="#6b7280">No confirmation attached to the sale</text>

    <rect x="40" y="374" width="392" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="396" font-size="11.5" font-weight="700" fill="#1F2937">🕐 Every sale is a manual step</text>
    <text x="60" y="414" font-size="10.5" fill="#6b7280">50 payments = 50 checks, every night</text>
  </g>

  <rect x="40" y="446" width="392" height="62" rx="12" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="236" y="470" font-size="11" font-weight="700" fill="#4b5563" text-anchor="middle">It worked — until a busy day</text>
  <text x="236" y="490" font-size="10" fill="#6b7280" text-anchor="middle">Busy days are exactly when it breaks</text>

  <!-- ============ RIGHT: integrated ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="504" y="82" width="440" height="22" fill="#15803d"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">With an integrated POS</text>

  <g font-size="11" fill="#374151">
    <rect x="528" y="126" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="148" font-size="11.5" font-weight="700" fill="#1F2937">⚡ Payment matches the sale instantly</text>
    <text x="548" y="166" font-size="10.5" fill="#6b7280">The webhook closes it the moment the PIN is in</text>

    <rect x="528" y="188" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="210" font-size="11.5" font-weight="700" fill="#1F2937">🌆 Close in minutes</text>
    <text x="548" y="228" font-size="10.5" fill="#6b7280">Cash, M-Pesa, and splits total themselves</text>

    <rect x="528" y="250" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="272" font-size="11.5" font-weight="700" fill="#1F2937">✅ Confirmed payments only</text>
    <text x="548" y="290" font-size="10.5" fill="#6b7280">A sale closes only when Kopo Kopo confirms</text>

    <rect x="528" y="312" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="334" font-size="11.5" font-weight="700" fill="#1F2937">📋 One record for everything</text>
    <text x="548" y="352" font-size="10.5" fill="#6b7280">The shift shows exactly where it didn't balance</text>

    <rect x="528" y="374" width="392" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="396" font-size="11.5" font-weight="700" fill="#1F2937">🧾 Receipts and stock, automatic</text>
    <text x="548" y="414" font-size="10.5" fill="#6b7280">The sale completes itself end to end</text>
  </g>

  <rect x="528" y="446" width="392" height="62" rx="12" fill="#15803d"/>
  <text x="724" y="470" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">The till does the matching, not your staff</text>
  <text x="724" y="490" font-size="10" fill="#d1fae5" text-anchor="middle">Your senior people stop being a reconciliation department</text>
</svg>
