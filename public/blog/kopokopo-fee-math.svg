<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The visible fee vs the hidden costs</text>

  <!-- ============ LEFT: visible cost ============ -->
  <rect x="16" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#6b7280"/>
  <rect x="16" y="82" width="440" height="22" fill="#6b7280"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">The visible cost</text>

  <!-- receipt -->
  <rect x="70" y="130" width="332" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="236" y="158" font-size="10" font-weight="700" letter-spacing="1.4" fill="#6b7280" text-anchor="middle">A MOBILE MONEY SALE</text>
  <line x1="96" y1="176" x2="376" y2="176" stroke="#f0f0f0"/>
  <text x="96" y="210" font-size="12" fill="#374151">Sale total</text>
  <text x="376" y="210" font-size="13" font-weight="700" fill="#1F2937" text-anchor="end">KES 1,500.00</text>
  <text x="96" y="242" font-size="12" fill="#374151">Channel fee (example 1.5%)</text>
  <text x="376" y="242" font-size="13" font-weight="700" fill="#b45309" text-anchor="end">− KES 22.50</text>
  <line x1="96" y1="266" x2="376" y2="266" stroke="#e5e7eb"/>
  <text x="96" y="298" font-size="13" font-weight="700" fill="#1F2937">You keep</text>
  <text x="376" y="298" font-size="15" font-weight="800" fill="#15803d" text-anchor="end">KES 1,477.50</text>
  <line x1="96" y1="324" x2="376" y2="324" stroke="#f0f0f0"/>
  <text x="236" y="356" font-size="9.5" fill="#6b7280" text-anchor="middle">The fee is one number — on your dashboard,</text>
  <text x="236" y="372" font-size="9.5" fill="#6b7280" text-anchor="middle">known in advance, the same every time.</text>

  <text x="236" y="430" font-size="9.5" fill="#9ca3af" text-anchor="middle">Example math with an illustrative rate — your actual rate</text>
  <text x="236" y="446" font-size="9.5" fill="#9ca3af" text-anchor="middle">lives in your Kopo Kopo dashboard.</text>

  <!-- ============ RIGHT: hidden costs ============ -->
  <rect x="504" y="56" width="440" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="504" y="82" width="440" height="22" fill="#15803d"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">The hidden costs — removed by integration</text>

  <g font-size="10" fill="#374151">
    <rect x="528" y="126" width="392" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="150" font-size="11" font-weight="700" fill="#1F2937">💳 Payment-module subscription</text>
    <text x="548" y="168" font-size="9.5" fill="#6b7280">A monthly software tax on taking M-Pesa — none with an integrated till</text>

    <rect x="528" y="200" width="392" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="224" font-size="11" font-weight="700" fill="#1F2937">🌙 Manual matching at close</text>
    <text x="548" y="242" font-size="9.5" fill="#6b7280">25 minutes a night of the owner's time — gone when payments match themselves</text>

    <rect x="528" y="274" width="392" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="298" font-size="11" font-weight="700" fill="#1F2937">⚠️ Disputes and write-offs</text>
    <text x="548" y="316" font-size="9.5" fill="#6b7280">'I paid' with no record — the confirmation on the sale settles it</text>

    <rect x="528" y="348" width="392" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="372" font-size="11" font-weight="700" fill="#1F2937">🕳️ Shortages nobody can explain</text>
    <text x="548" y="390" font-size="9.5" fill="#6b7280">Unmatched payments — every payment is matched before the shift ends</text>
  </g>

  <rect x="528" y="436" width="392" height="72" rx="12" fill="#15803d"/>
  <text x="724" y="464" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">Know the channel fee — and stop paying the hidden ones</text>
  <text x="724" y="486" font-size="9.5" fill="#d1fae5" text-anchor="middle">The fee is the cost of taking M-Pesa; the hidden costs are the cost of doing it wrong.</text>
</svg>
