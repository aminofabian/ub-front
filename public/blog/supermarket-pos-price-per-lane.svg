<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Supermarket POS price in Kenya scales with lanes</text>

  <!-- Card -->
  <rect x="16" y="64" width="928" height="352" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Header row -->
  <text x="92" y="100" font-size="11" font-weight="700" fill="#1F2937">Lanes</text>
  <text x="520" y="100" font-size="11" font-weight="700" fill="#6b7280">Typical total</text>
  <text x="700" y="100" font-size="11" font-weight="700" fill="#6b7280">What it buys</text>
  <line x1="40" y1="116" x2="920" y2="116" stroke="#e5e7eb"/>

  <!-- Row 1 -->
  <rect x="40" y="126" width="880" height="56" rx="8" fill="#f0fdf4"/>
  <circle cx="64" cy="154" r="15" fill="#15803d"/>
  <text x="64" y="159" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="92" y="159" font-size="11.5" font-weight="700" fill="#1F2937">Single lane</text>
  <text x="520" y="159" font-size="11" font-weight="700" fill="#15803d">KSh 60,000 – 150,000</text>
  <text x="700" y="152" font-size="10" fill="#6b7280">Terminal, scanner, printer,</text>
  <text x="700" y="168" font-size="10" fill="#6b7280">one software seat.</text>

  <!-- Row 2 -->
  <rect x="40" y="190" width="880" height="56" rx="8" fill="#ffffff"/>
  <circle cx="64" cy="218" r="15" fill="#A8842C"/>
  <text x="64" y="223" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="92" y="223" font-size="11.5" font-weight="700" fill="#1F2937">Two to three lanes</text>
  <text x="520" y="223" font-size="11" font-weight="700" fill="#A8842C">KSh 150,000 – 300,000</text>
  <text x="700" y="216" font-size="10" fill="#6b7280">The same, per checkout,</text>
  <text x="700" y="232" font-size="10" fill="#6b7280">plus back-office tools.</text>

  <!-- Row 3 -->
  <rect x="40" y="254" width="880" height="56" rx="8" fill="#f9fafb"/>
  <circle cx="64" cy="282" r="15" fill="#2563eb"/>
  <text x="64" y="287" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="92" y="287" font-size="11.5" font-weight="700" fill="#1F2937">Four or more lanes</text>
  <text x="520" y="287" font-size="11" font-weight="700" fill="#2563eb">KSh 300,000 – 500,000+</text>
  <text x="700" y="280" font-size="10" fill="#6b7280">Full store: lanes, seats,</text>
  <text x="700" y="296" font-size="10" fill="#6b7280">and multi-lane software.</text>

  <!-- Banner -->
  <rect x="40" y="324" width="880" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="352" font-size="12" font-weight="700" fill="#2563eb">You pay per checkout, not per store</text>
  <text x="64" y="376" font-size="10.5" fill="#374151">Each lane is its own terminal, scanner, printer, and software seat. Start with one lane and let a per-lane model grow the bill only when you grow.</text>

  <!-- Footer note -->
  <text x="480" y="472" font-size="10" fill="#6b7280" text-anchor="middle">Typical Kenyan prices for 2026 (ex-VAT), for planning — confirm with a supplier before you budget.</text>
  <text x="480" y="500" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="middle">Compare the three-year total per lane, not the day-one receipt.</text>
</svg>
