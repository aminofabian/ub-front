<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="36" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">What the best supermarket POS must do</text>
  <text x="480" y="58" font-size="11" fill="#6b7280" text-anchor="middle">Every lane on one stock count is the line that separates supermarket-ready from shop-grade.</text>

  <!-- Card -->
  <rect x="16" y="80" width="928" height="352" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Left column -->
  <circle cx="64" cy="124" r="12" fill="#15803d"/>
  <path d="M59 124 l3 4 6 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="120" font-size="11.5" font-weight="700" fill="#1F2937">Multi-lane, one stock count</text>
  <text x="88" y="138" font-size="10" fill="#6b7280">No lane may disagree with another.</text>

  <circle cx="64" cy="184" r="12" fill="#15803d"/>
  <path d="M59 184 l3 4 6 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="180" font-size="11.5" font-weight="700" fill="#1F2937">Fast 2D scanning</text>
  <text x="88" y="198" font-size="10" fill="#6b7280">Every second at a busy lane compounds.</text>

  <circle cx="64" cy="244" r="12" fill="#15803d"/>
  <path d="M59 244 l3 4 6 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="240" font-size="11.5" font-weight="700" fill="#1F2937">Back-office purchasing</text>
  <text x="88" y="258" font-size="10" fill="#6b7280">Stock and supplier orders in one place.</text>

  <circle cx="64" cy="304" r="12" fill="#15803d"/>
  <path d="M59 304 l3 4 6 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="300" font-size="11.5" font-weight="700" fill="#1F2937">Weigh-scale support</text>
  <text x="88" y="318" font-size="10" fill="#6b7280">Fresh produce and deli by weight.</text>

  <circle cx="64" cy="364" r="12" fill="#15803d"/>
  <path d="M59 364 l3 4 6 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="360" font-size="11.5" font-weight="700" fill="#1F2937">Offline selling with M-Pesa</text>
  <text x="88" y="378" font-size="10" fill="#6b7280">Lanes keep ringing when the line drops.</text>

  <!-- Right panel -->
  <rect x="560" y="104" width="360" height="308" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="584" y="136" font-size="11" font-weight="700" fill="#A8842C">Judge the software, not the box</text>
  <text x="584" y="162" font-size="10.5" fill="#374151">Lane terminals, scanners, and printers</text>
  <text x="584" y="180" font-size="10.5" fill="#374151">can be replaced. The system that keeps</text>
  <text x="584" y="198" font-size="10.5" fill="#374151">every lane on one count is forever.</text>

  <line x1="584" y1="220" x2="896" y2="220" stroke="#e5e7eb"/>

  <text x="584" y="248" font-size="10.5" font-weight="700" fill="#1F2937">Priced per lane you open</text>
  <text x="584" y="266" font-size="10" fill="#6b7280">Not a rigid tier that forces overbuying.</text>

  <text x="584" y="298" font-size="10.5" font-weight="700" fill="#1F2937">Start with one lane</text>
  <text x="584" y="316" font-size="10" fill="#6b7280">Add the second when the queue demands.</text>

  <text x="584" y="348" font-size="10.5" font-weight="700" fill="#1F2937">Loyalty across thousands of SKUs</text>
  <text x="584" y="366" font-size="10" fill="#6b7280">Promotions that hold across the catalogue.</text>

  <text x="584" y="396" font-size="10" font-weight="700" fill="#A8842C">Buy the brain, not the box.</text>

  <!-- Banner -->
  <rect x="40" y="456" width="880" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="484" font-size="12" font-weight="700" fill="#2563eb">One lane done properly, then grow</text>
  <text x="64" y="508" font-size="10.5" fill="#374151">Prove the stock control before you open a second checkout. Add a lane when the queue — not the ambition — is the bottleneck.</text>
</svg>
