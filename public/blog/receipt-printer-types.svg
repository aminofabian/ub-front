<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Receipt printers: 58mm vs 80mm</text>

  <!-- Card -->
  <rect x="16" y="60" width="928" height="404" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Column headers -->
  <text x="40" y="104" font-size="11" font-weight="700" fill="#1F2937">Compare</text>
  <rect x="300" y="80" width="320" height="34" rx="9" fill="#15803d"/>
  <text x="460" y="102" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">58mm compact</text>
  <rect x="640" y="80" width="304" height="34" rx="9" fill="#2563eb"/>
  <text x="792" y="102" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">80mm standard</text>
  <line x1="40" y1="126" x2="920" y2="126" stroke="#e5e7eb"/>

  <!-- Row 1 -->
  <rect x="40" y="138" width="880" height="46" rx="8" fill="#f9fafb"/>
  <text x="60" y="166" font-size="10.5" fill="#374151">Paper width</text>
  <text x="320" y="166" font-size="10.5" fill="#374151">58mm — compact slip</text>
  <text x="660" y="166" font-size="10.5" fill="#374151">80mm — full-width receipt</text>

  <!-- Row 2 -->
  <rect x="40" y="190" width="880" height="46" rx="8" fill="#ffffff"/>
  <text x="60" y="218" font-size="10.5" fill="#374151">Typical price</text>
  <text x="320" y="218" font-size="10.5" font-weight="700" fill="#15803d">KSh 4,000 – 9,000</text>
  <text x="660" y="218" font-size="10.5" font-weight="700" fill="#2563eb">KSh 8,000 – 15,000</text>

  <!-- Row 3 -->
  <rect x="40" y="242" width="880" height="46" rx="8" fill="#f9fafb"/>
  <text x="60" y="270" font-size="10.5" fill="#374151">Best for</text>
  <text x="320" y="270" font-size="10.5" fill="#374151">Small shops, low volume</text>
  <text x="660" y="270" font-size="10.5" fill="#374151">Most shops, busier counters</text>

  <!-- Row 4 -->
  <rect x="40" y="294" width="880" height="46" rx="8" fill="#ffffff"/>
  <text x="60" y="322" font-size="10.5" fill="#374151">Receipts</text>
  <text x="320" y="322" font-size="10.5" fill="#374151">Short, simple slips</text>
  <text x="660" y="322" font-size="10.5" fill="#374151">Fuller receipts with more detail</text>

  <!-- Row 5 -->
  <rect x="40" y="346" width="880" height="46" rx="8" fill="#f0fdf4"/>
  <text x="60" y="374" font-size="10.5" font-weight="700" fill="#1F2937">Verdict</text>
  <text x="320" y="374" font-size="10.5" font-weight="700" fill="#15803d">Cheapest way to print</text>
  <text x="660" y="374" font-size="10.5" font-weight="700" fill="#2563eb">The standard pick</text>

  <!-- Footer note -->
  <text x="480" y="428" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="middle">Both print thermally — no ink to refill. Buy one when customers expect paper; digital receipts work before you do.</text>
  <text x="480" y="446" font-size="10" fill="#6b7280" text-anchor="middle">Typical Kenyan prices for 2026 (ex-VAT), for planning — confirm with a supplier before you buy.</text>
</svg>
