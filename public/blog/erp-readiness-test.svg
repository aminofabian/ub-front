<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The five-question ERP readiness test</text>

  <!-- ============ LEFT: questions ============ -->
  <rect x="16" y="56" width="560" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <g font-size="11.5">
    <rect x="40" y="88" width="512" height="58" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="66" cy="117" r="13" fill="#f3f4f6"/>
    <text x="66" y="122" font-size="10.5" font-weight="700" fill="#4b5563" text-anchor="middle">1</text>
    <text x="92" y="112" font-size="12" font-weight="700" fill="#1F2937">Multiple warehouses or depots?</text>
    <text x="92" y="130" font-size="10.5" fill="#6b7280">Stock lives in more than one place, with transfers between them</text>
    <rect x="452" y="100" width="80" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="492" y="117" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Yes → ERP</text>

    <rect x="40" y="156" width="512" height="58" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="66" cy="185" r="13" fill="#f3f4f6"/>
    <text x="66" y="190" font-size="10.5" font-weight="700" fill="#4b5563" text-anchor="middle">2</text>
    <text x="92" y="180" font-size="12" font-weight="700" fill="#1F2937">Manufacturing — raw materials to finished goods?</text>
    <text x="92" y="198" font-size="10.5" fill="#6b7280">Bills of materials, routing, production planning</text>
    <rect x="452" y="168" width="80" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="492" y="185" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Yes → ERP</text>

    <rect x="40" y="224" width="512" height="58" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="66" cy="253" r="13" fill="#f3f4f6"/>
    <text x="66" y="258" font-size="10.5" font-weight="700" fill="#4b5563" text-anchor="middle">3</text>
    <text x="92" y="248" font-size="12" font-weight="700" fill="#1F2937">An HR department with payroll?</text>
    <text x="92" y="266" font-size="10.5" fill="#6b7280">Dozens of staff, shifts, salaries, statutory filings</text>
    <rect x="452" y="236" width="80" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="492" y="253" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Yes → ERP</text>

    <rect x="40" y="292" width="512" height="58" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="66" cy="321" r="13" fill="#f3f4f6"/>
    <text x="66" y="326" font-size="10.5" font-weight="700" fill="#4b5563" text-anchor="middle">4</text>
    <text x="92" y="316" font-size="12" font-weight="700" fill="#1F2937">A finance team wanting double-entry accounting?</text>
    <text x="92" y="334" font-size="10.5" fill="#6b7280">Auditors, lenders, and a chart of accounts</text>
    <rect x="452" y="304" width="80" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="492" y="321" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Yes → ERP</text>

    <rect x="40" y="360" width="512" height="58" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="66" cy="389" r="13" fill="#f3f4f6"/>
    <text x="66" y="394" font-size="10.5" font-weight="700" fill="#4b5563" text-anchor="middle">5</text>
    <text x="92" y="384" font-size="12" font-weight="700" fill="#1F2937">Five or more locations with separate teams?</text>
    <text x="92" y="402" font-size="10.5" fill="#6b7280">Franchise-style operations across many branches</text>
    <rect x="452" y="372" width="80" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="492" y="389" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Yes → ERP</text>
  </g>

  <text x="40" y="470" font-size="10.5" fill="#6b7280">Mostly "No"? A lean POS answers the counter's question today —</text>
  <text x="40" y="486" font-size="10.5" fill="#6b7280">and the ERP will still be there when the company earns it.</text>
  <text x="40" y="514" font-size="10" fill="#9ca3af">Answer honestly — this test has no wrong answers, only wrong timing.</text>

  <!-- ============ RIGHT: verdict ============ -->
  <rect x="604" y="56" width="340" height="480" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <rect x="628" y="88" width="292" height="150" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="652" y="116" font-size="12.5" font-weight="700" fill="#15803d">Mostly No → POS today</text>
  <g font-size="10.5" fill="#374151">
    <text x="652" y="142">· One or two counters, phone at the till</text>
    <text x="652" y="162">· M-Pesa-first, storefront-second</text>
    <text x="652" y="182">· Growth is better stock discipline, not more modules</text>
    <text x="652" y="202">· Live this week beats configured next quarter</text>
    <text x="652" y="226" fill="#6b7280">A POS gets you selling now, honestly, with numbers</text>
    <text x="652" y="244" fill="#6b7280">you can trust — which is what the ERP would ask for anyway.</text>
  </g>

  <rect x="628" y="258" width="292" height="150" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="652" y="286" font-size="12.5" font-weight="700" fill="#b91c1c">Mostly Yes → Time to talk ERP</text>
  <g font-size="10.5" fill="#7f1d1d">
    <text x="652" y="312">· Multi-warehouse logistics, manufacturing</text>
    <text x="652" y="332">· HR/payroll and a finance team</text>
    <text x="652" y="352">· You have the people to run an implementation</text>
    <text x="652" y="380" fill="#6b7280">The suite earns its keep when the company is</text>
    <text x="652" y="398" fill="#6b7280">complex enough to need it — not before.</text>
  </g>

  <rect x="628" y="428" width="292" height="84" rx="12" fill="#fefce8" stroke="#fde68a"/>
  <text x="652" y="454" font-size="11.5" font-weight="700" fill="#A8842C">The middle path</text>
  <text x="652" y="474" font-size="10.5" fill="#374151">Start lean, sell first, and let the business earn its</text>
  <text x="652" y="492" font-size="10.5" fill="#374151">upgrade. Choosing by today's reality — not a</text>
  <text x="652" y="508" font-size="10.5" fill="#374151">five-year daydream — is the whole trick.</text>
</svg>
