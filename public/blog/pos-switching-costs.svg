<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">What switching a POS really costs</text>

  <!-- ============ Left: the costs of moving ============ -->
  <rect x="16" y="64" width="560" height="400" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="40" y="96" font-size="12.5" font-weight="700" fill="#1F2937">What it costs you to move</text>

  <rect x="28" y="124" width="536" height="52" rx="8" fill="#f9fafb"/>
  <circle cx="48" cy="150" r="7" fill="#2563eb"/>
  <text x="68" y="146" font-size="11" font-weight="700" fill="#1F2937">Data migration</text>
  <text x="68" y="164" font-size="10" fill="#6b7280">Catalogue, stock, and customer credit, re-entered</text>

  <rect x="28" y="186" width="536" height="52" rx="8" fill="#ffffff"/>
  <circle cx="48" cy="212" r="7" fill="#A8842C"/>
  <text x="68" y="208" font-size="11" font-weight="700" fill="#1F2937">Retraining cashiers</text>
  <text x="68" y="226" font-size="10" fill="#6b7280">Hours until everyone is fluent again</text>

  <rect x="28" y="248" width="536" height="52" rx="8" fill="#f9fafb"/>
  <circle cx="48" cy="274" r="7" fill="#b91c1c"/>
  <text x="68" y="270" font-size="11" font-weight="700" fill="#1F2937">Downtime at the till</text>
  <text x="68" y="288" font-size="10" fill="#6b7280">Sales lost while you switch over</text>

  <rect x="28" y="310" width="536" height="52" rx="8" fill="#ffffff"/>
  <circle cx="48" cy="336" r="7" fill="#7c3aed"/>
  <text x="68" y="332" font-size="11" font-weight="700" fill="#1F2937">Stranded hardware</text>
  <text x="68" y="350" font-size="10" fill="#6b7280">A terminal that won't work with the new system</text>

  <rect x="28" y="372" width="536" height="52" rx="8" fill="#f9fafb"/>
  <circle cx="48" cy="398" r="7" fill="#6b7280"/>
  <text x="68" y="394" font-size="11" font-weight="700" fill="#1F2937">Lost history</text>
  <text x="68" y="412" font-size="10" fill="#6b7280">Old reports and trends start from zero</text>

  <!-- ============ Right: how to keep it cheap ============ -->
  <rect x="592" y="64" width="352" height="400" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="616" y="96" font-size="12.5" font-weight="700" fill="#1F2937">How to keep the switch cheap</text>

  <circle cx="620" cy="132" r="11" fill="#15803d"/>
  <text x="620" y="136" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="642" y="130" font-size="11" font-weight="700" fill="#1F2937">Portable data</text>
  <text x="642" y="150" font-size="10" fill="#6b7280">Check you can export your catalogue</text>
  <text x="642" y="166" font-size="10" fill="#6b7280">and stock before you buy.</text>

  <circle cx="620" cy="202" r="11" fill="#A8842C"/>
  <text x="620" y="206" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="642" y="200" font-size="11" font-weight="700" fill="#1F2937">Native M-Pesa</text>
  <text x="642" y="220" font-size="10" fill="#6b7280">Avoid re-integrating payments —</text>
  <text x="642" y="236" font-size="10" fill="#6b7280">and monthly module fees.</text>

  <circle cx="620" cy="272" r="11" fill="#2563eb"/>
  <text x="620" y="276" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="642" y="270" font-size="11" font-weight="700" fill="#1F2937">No hardware lock-in</text>
  <text x="642" y="290" font-size="10" fill="#6b7280">Run on a device you own, not a</text>
  <text x="642" y="306" font-size="10" fill="#6b7280">proprietary terminal.</text>

  <rect x="612" y="340" width="312" height="100" rx="10" fill="#fefce8" stroke="#fde68a"/>
  <text x="632" y="366" font-size="11.5" font-weight="700" fill="#A8842C">The rule</text>
  <text x="632" y="390" font-size="10.5" fill="#374151">Pick for the next three years, not</text>
  <text x="632" y="406" font-size="10.5" fill="#374151">this month. The cheapest switch is</text>
  <text x="632" y="422" font-size="10.5" fill="#374151">the one you never have to make.</text>
</svg>
