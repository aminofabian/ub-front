<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">The journey: stall → till → storefront</text>

  <!-- arrows -->
  <path d="M336 150 C 366 150, 366 150, 396 150" stroke="#A8842C" stroke-width="3.5" fill="none" marker-end="url(#jarr)"/>
  <path d="M672 150 C 702 150, 702 150, 732 150" stroke="#A8842C" stroke-width="3.5" fill="none" marker-end="url(#jarr)"/>
  <defs>
    <marker id="jarr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#A8842C"/>
    </marker>
  </defs>

  <!-- ============ Panel 1: the stall ============ -->
  <rect x="16" y="56" width="300" height="360" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="300" height="44" rx="14" fill="#6b7280"/>
  <rect x="16" y="82" width="300" height="18" fill="#6b7280"/>
  <text x="40" y="85" font-size="13" font-weight="700" fill="#ffffff">Chapter 1 · The stall</text>

  <!-- stall scene -->
  <rect x="40" y="120" width="252" height="150" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
  <rect x="56" y="140" width="84" height="110" rx="6" fill="#d97706"/>
  <text x="98" y="180" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">STALL</text>
  <text x="98" y="196" font-size="8.5" fill="#fef3c7" text-anchor="middle">cash box · notebook</text>
  <rect x="152" y="140" width="36" height="40" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="170" y="160" font-size="8" fill="#a3a3a3" text-anchor="middle">🥫</text>
  <text x="170" y="174" font-size="7" fill="#6b7280" text-anchor="middle">oil</text>
  <rect x="192" y="140" width="36" height="40" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="210" y="160" font-size="8" fill="#a3a3a3" text-anchor="middle">🍚</text>
  <text x="210" y="174" font-size="7" fill="#6b7280" text-anchor="middle">rice</text>
  <rect x="232" y="140" width="44" height="40" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="254" y="160" font-size="8" fill="#a3a3a3" text-anchor="middle">🧼</text>
  <text x="254" y="174" font-size="7" fill="#6b7280" text-anchor="middle">soap</text>
  <rect x="56" y="200" width="120" height="34" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="116" y="222" font-size="9" fill="#6b7280" text-anchor="middle">📓 notebook ledger</text>
  <rect x="184" y="200" width="92" height="34" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="230" y="222" font-size="9" fill="#6b7280" text-anchor="middle">💵 cash only</text>

  <g font-size="10.5" fill="#6b7280">
    <text x="40" y="296">· Every sale remembered, not recorded</text>
    <text x="40" y="314">· Counting at night by candlelight</text>
    <text x="40" y="332">· No numbers to show a supplier</text>
    <text x="40" y="350">· M-Pesa? A personal number and a prayer</text>
    <text x="40" y="374" fill="#374151" font-weight="700">It worked. It just never grew.</text>
  </g>

  <!-- ============ Panel 2: the till ============ -->
  <rect x="360" y="56" width="300" height="360" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="360" y="56" width="300" height="44" rx="14" fill="#15803d"/>
  <rect x="360" y="82" width="300" height="18" fill="#15803d"/>
  <text x="384" y="85" font-size="13" font-weight="700" fill="#ffffff">Chapter 2 · The till</text>

  <rect x="384" y="120" width="252" height="150" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <!-- phone -->
  <rect x="420" y="140" width="90" height="110" rx="12" fill="#0a0a0a"/>
  <rect x="426" y="146" width="78" height="98" rx="8" fill="#ffffff"/>
  <rect x="426" y="146" width="78" height="18" rx="8" fill="#15803d"/>
  <text x="465" y="158" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">Kiosk till</text>
  <rect x="434" y="172" width="30" height="10" rx="2" fill="#f3f4f6"/>
  <rect x="434" y="186" width="44" height="10" rx="2" fill="#f3f4f6"/>
  <rect x="434" y="200" width="36" height="10" rx="2" fill="#f3f4f6"/>
  <rect x="434" y="216" width="42" height="12" rx="6" fill="#28a745"/>
  <text x="540" y="160" font-size="10" font-weight="700" fill="#15803d">One tap → STK sent</text>
  <text x="540" y="178" font-size="9.5" fill="#374151">Customer's phone confirms,</text>
  <text x="540" y="192" font-size="9.5" fill="#374151">the till auto-credits.</text>
  <text x="540" y="216" font-size="9.5" fill="#374151">📦 Stock updates itself.</text>
  <text x="540" y="234" font-size="9.5" fill="#374151">🧾 Receipt prints or shares.</text>

  <g font-size="10.5" fill="#6b7280">
    <text x="384" y="296">· Products scanned in, prices set</text>
    <text x="384" y="314">· First M-Pesa sale — same afternoon</text>
    <text x="384" y="332">· Closing the shift takes minutes</text>
    <text x="384" y="350">· The numbers finally agree</text>
    <text x="384" y="374" fill="#374151" font-weight="700">The stall got a memory.</text>
  </g>

  <!-- ============ Panel 3: the storefront ============ -->
  <rect x="704" y="56" width="240" height="360" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="704" y="56" width="240" height="44" rx="14" fill="#A8842C"/>
  <rect x="704" y="82" width="240" height="18" fill="#A8842C"/>
  <text x="728" y="85" font-size="13" font-weight="700" fill="#ffffff">Chapter 3 · The store</text>

  <rect x="728" y="120" width="192" height="150" rx="10" fill="#fefce8" stroke="#fde68a"/>
  <rect x="748" y="140" width="152" height="20" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="758" cy="150" r="3" fill="#28a745"/>
  <text x="768" y="154" font-size="7.5" fill="#6b7280">wanjiku.minimart.kiosk.ke</text>
  <rect x="748" y="172" width="66" height="58" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="781" y="196" font-size="9" fill="#a3a3a3" text-anchor="middle">🥫</text>
  <text x="781" y="212" font-size="7.5" fill="#374151" text-anchor="middle">Oil 1L</text>
  <text x="781" y="224" font-size="7.5" font-weight="800" fill="#15803d" text-anchor="middle">KES 520</text>
  <rect x="822" y="172" width="66" height="58" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="855" y="196" font-size="9" fill="#a3a3a3" text-anchor="middle">🍚</text>
  <text x="855" y="212" font-size="7.5" fill="#374151" text-anchor="middle">Rice 2kg</text>
  <text x="855" y="224" font-size="7.5" font-weight="800" fill="#15803d" text-anchor="middle">KES 460</text>
  <rect x="748" y="242" width="152" height="18" rx="6" fill="#28a745"/>
  <text x="824" y="255" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Order now · pickup</text>

  <g font-size="10.5" fill="#6b7280">
    <text x="728" y="296">· The link goes on WhatsApp</text>
    <text x="728" y="314">· Orders land in the till record</text>
    <text x="728" y="332">· Shelf = website, one count</text>
    <text x="728" y="350">· Regulars order before they walk</text>
    <text x="728" y="374" fill="#374151" font-weight="700">Same stock. New reach.</text>
  </g>

  <!-- footer -->
  <rect x="96" y="448" width="768" height="72" rx="14" fill="#1F2937"/>
  <text x="480" y="476" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">No bigger ERP. No months of implementation.</text>
  <text x="480" y="498" font-size="11" fill="#d1d5db" text-anchor="middle">Just one stall, one till, and a storefront that finally matches the shelf.</text>
  <text x="480" y="514" font-size="10" fill="#9ca3af" text-anchor="middle">The journey isn't a project — it's an afternoon, repeated.</text>
</svg>
