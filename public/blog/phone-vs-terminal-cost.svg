<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">A phone till vs. a dedicated POS terminal</text>

  <!-- Card -->
  <rect x="16" y="60" width="928" height="460" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <!-- Column headers -->
  <text x="40" y="104" font-size="11" font-weight="700" fill="#1F2937">Compare</text>
  <rect x="320" y="80" width="310" height="34" rx="9" fill="#15803d"/>
  <text x="475" y="102" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Phone till</text>
  <rect x="650" y="80" width="294" height="34" rx="9" fill="#1F2937"/>
  <text x="797" y="102" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Dedicated terminal</text>
  <line x1="40" y1="126" x2="920" y2="126" stroke="#e5e7eb"/>

  <!-- ===== Row 1 ===== -->
  <rect x="40" y="138" width="880" height="44" rx="8" fill="#f9fafb"/>
  <text x="60" y="165" font-size="10.5" fill="#374151">Upfront cost</text>
  <text x="340" y="165" font-size="10.5" font-weight="700" fill="#15803d">KSh 0 — the phone you own</text>
  <text x="670" y="165" font-size="10.5" fill="#374151">KSh 40,000 – 120,000</text>

  <!-- ===== Row 2 ===== -->
  <rect x="40" y="186" width="880" height="44" rx="8" fill="#ffffff"/>
  <text x="60" y="213" font-size="10.5" fill="#374151">Running cost</text>
  <text x="340" y="213" font-size="10.5" fill="#374151">Your software plan only</text>
  <text x="670" y="213" font-size="10.5" fill="#374151">Plan + support + maintenance</text>

  <!-- ===== Row 3 ===== -->
  <rect x="40" y="234" width="880" height="44" rx="8" fill="#f9fafb"/>
  <text x="60" y="261" font-size="10.5" fill="#374151">Barcode scanning</text>
  <text x="340" y="261" font-size="10.5" fill="#374151">Camera free; add a scanner</text>
  <text x="670" y="261" font-size="10.5" fill="#374151">Built-in scanner (usually)</text>

  <!-- ===== Row 4 ===== -->
  <rect x="40" y="282" width="880" height="44" rx="8" fill="#ffffff"/>
  <text x="60" y="309" font-size="10.5" fill="#374151">Where you can sell</text>
  <text x="340" y="309" font-size="10.5" fill="#374151">Anywhere the shop is</text>
  <text x="670" y="309" font-size="10.5" fill="#374151">One fixed counter</text>

  <!-- ===== Row 5 ===== -->
  <rect x="40" y="330" width="880" height="44" rx="8" fill="#f9fafb"/>
  <text x="60" y="357" font-size="10.5" fill="#374151">If it is dropped</text>
  <text x="340" y="357" font-size="10.5" fill="#374151">Replace the phone</text>
  <text x="670" y="357" font-size="10.5" fill="#374151">Replace the terminal — costlier</text>

  <!-- ===== Row 6 ===== -->
  <rect x="40" y="378" width="880" height="44" rx="8" fill="#ffffff"/>
  <text x="60" y="405" font-size="10.5" fill="#374151">Lock-in</text>
  <text x="340" y="405" font-size="10.5" fill="#374151">None — your device, any software</text>
  <text x="670" y="405" font-size="10.5" fill="#374151">Often tied to one vendor</text>

  <!-- ===== Row 7 ===== -->
  <rect x="40" y="426" width="880" height="44" rx="8" fill="#f0fdf4"/>
  <text x="60" y="453" font-size="10.5" font-weight="700" fill="#1F2937">Best for</text>
  <text x="340" y="453" font-size="10.5" font-weight="700" fill="#15803d">Most Kenyan shops</text>
  <text x="670" y="453" font-size="10.5" fill="#374151">Fixed, high-volume counters</text>

  <!-- Footer note -->
  <text x="480" y="498" font-size="10.5" font-weight="700" fill="#1F2937" text-anchor="middle">Start with the phone. Buy a terminal only when a fixed, busy counter genuinely needs one.</text>
</svg>
