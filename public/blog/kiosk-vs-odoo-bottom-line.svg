<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="40" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle">The bottom line</text>
  <text x="480" y="64" font-size="12.5" fill="#6b7280" text-anchor="middle">It's not about which is "better". It's about which one sells things this week.</text>

  <!-- ============ LEFT CARD: Kiosk.ke ============ -->
  <rect x="16" y="96" width="440" height="360" rx="16" fill="#ffffff" stroke="#28a745" stroke-width="2.5"/>
  <rect x="16" y="96" width="440" height="56" rx="16" fill="#15803d"/>
  <rect x="16" y="128" width="440" height="24" fill="#15803d"/>
  <text x="40" y="132" font-size="16" font-weight="700" fill="#ffffff">Kiosk.ke — the right tool for the counter</text>

  <g font-size="12.5" fill="#374151">
    <path d="M52 172 l5 5 l9 -10" stroke="#28a745" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="178" font-size="12.5" font-weight="700" fill="#1F2937">Live in minutes, not months</text>
    <text x="78" y="196" font-size="11.5" fill="#6b7280">Till, storefront, and stock up before the day is over</text>

    <path d="M52 226 l5 5 l9 -10" stroke="#28a745" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="232" font-size="12.5" font-weight="700" fill="#1F2937">M-Pesa native, not bolted on</text>
    <text x="78" y="250" font-size="11.5" fill="#6b7280">STK Push works the moment you ring up a sale</text>

    <path d="M52 280 l5 5 l9 -10" stroke="#28a745" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="286" font-size="12.5" font-weight="700" fill="#1F2937">One inventory, zero reconciliation</text>
    <text x="78" y="304" font-size="11.5" fill="#6b7280">Counter, web shop, and supplier orders share one count</text>

    <path d="M52 334 l5 5 l9 -10" stroke="#28a745" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="340" font-size="12.5" font-weight="700" fill="#1F2937">Priced for a Kenyan shop</text>
    <text x="78" y="358" font-size="11.5" fill="#6b7280">No per-user ERP seat licences for a two-person counter</text>
  </g>

  <rect x="52" y="396" width="368" height="40" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="236" y="421" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Built for the business you run today</text>

  <!-- ============ RIGHT CARD: Odoo ============ -->
  <rect x="504" y="96" width="440" height="360" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="96" width="440" height="56" rx="16" fill="#374151"/>
  <rect x="504" y="128" width="440" height="24" fill="#374151"/>
  <text x="528" y="132" font-size="16" font-weight="700" fill="#ffffff">Odoo — the right tool for an enterprise</text>

  <g font-size="12.5" fill="#374151">
    <circle cx="57" cy="173" r="11" fill="#f3f4f6"/>
    <text x="57" y="178" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="middle">1</text>
    <text x="82" y="178" font-size="12.5" font-weight="700" fill="#1F2937">Brilliant at multi-warehouse &amp; manufacturing</text>
    <text x="82" y="196" font-size="11.5" fill="#6b7280">BOMs, routing, MRP — genuinely world-class</text>

    <circle cx="57" cy="227" r="11" fill="#f3f4f6"/>
    <text x="57" y="232" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="middle">2</text>
    <text x="82" y="232" font-size="12.5" font-weight="700" fill="#1F2937">One suite for HR, finance, CRM, and sales</text>
    <text x="82" y="250" font-size="11.5" fill="#6b7280">If you run dozens of staff and departments, it earns its keep</text>

    <circle cx="57" cy="281" r="11" fill="#f3f4f6"/>
    <text x="57" y="286" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="middle">3</text>
    <text x="82" y="286" font-size="12.5" font-weight="700" fill="#1F2937">Flexible to the point of needing engineers</text>
    <text x="82" y="304" font-size="11.5" fill="#6b7280">Customisation is a feature and a billable-hours trap</text>

    <circle cx="57" cy="335" r="11" fill="#f3f4f6"/>
    <text x="57" y="340" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="middle">4</text>
    <text x="82" y="340" font-size="12.5" font-weight="700" fill="#1F2937">Priced like a corporate system</text>
    <text x="82" y="358" font-size="11.5" fill="#6b7280">Per-app, per-user costs add up fast for a small shop</text>
  </g>

  <rect x="528" y="396" width="392" height="40" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="724" y="421" font-size="12" font-weight="700" fill="#4b5563" text-anchor="middle">Built for the business you hope to become</text>

  <!-- ============ Verdict bar ============ -->
  <rect x="96" y="480" width="768" height="56" rx="14" fill="#A8842C"/>
  <text x="480" y="504" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Right tool, right time — for most Kenyan shops, that's Kiosk.ke</text>
  <text x="480" y="524" font-size="11" fill="#f5ead3" text-anchor="middle">Enterprise scale is a "when", not a "now" — and Odoo will still be there when you get there.</text>
</svg>
