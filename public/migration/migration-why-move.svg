<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="960" height="560" fill="#FBF9F5"/>

  <!-- Title -->
  <text x="480" y="34" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Why we moved — the short version</text>

  <!-- ============ LEFT: the old street ============ -->
  <rect x="16" y="56" width="440" height="300" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="16" y="56" width="440" height="48" rx="14" fill="#6b7280"/>
  <rect x="16" y="82" width="440" height="22" fill="#6b7280"/>
  <text x="40" y="87" font-size="14" font-weight="700" fill="#ffffff">The old street · kiosk.co.ke</text>

  <g font-size="11" fill="#374151">
    <rect x="40" y="126" width="392" height="44" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="145" font-weight="700" fill="#1F2937">Built for the first shops</text>
    <text x="60" y="161" font-size="10" fill="#6b7280">Great for a thousand counters — tight for a hundred thousand</text>

    <rect x="40" y="180" width="392" height="44" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="199" font-weight="700" fill="#1F2937">Structure capped growth</text>
    <text x="60" y="215" font-size="10" fill="#6b7280">Every new feature meant a new workaround</text>

    <rect x="40" y="234" width="392" height="44" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="253" font-weight="700" fill="#1F2937">Shops outgrew the house</text>
    <text x="60" y="269" font-size="10" fill="#6b7280">Multi-branch, supplier portals, heavier M-Pesa traffic</text>
  </g>

  <rect x="40" y="300" width="392" height="32" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="236" y="321" font-size="10.5" font-weight="700" fill="#4b5563" text-anchor="middle">The house couldn't grow — so we built a new one</text>

  <!-- ============ RIGHT: the new street ============ -->
  <rect x="504" y="56" width="440" height="300" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="504" y="56" width="440" height="48" rx="14" fill="#15803d"/>
  <rect x="504" y="82" width="440" height="22" fill="#15803d"/>
  <text x="528" y="87" font-size="14" font-weight="700" fill="#ffffff">The new street · kiosk.ke</text>

  <g font-size="11" fill="#374151">
    <rect x="528" y="126" width="392" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="145" font-weight="700" fill="#1F2937">Built for scale</text>
    <text x="548" y="161" font-size="10" fill="#6b7280">Infrastructure that grows with every new shop</text>

    <rect x="528" y="180" width="392" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="199" font-weight="700" fill="#1F2937">Room for the roadmap</text>
    <text x="548" y="215" font-size="10" fill="#6b7280">New features land without breaking the old ones</text>

    <rect x="528" y="234" width="392" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="548" y="253" font-weight="700" fill="#1F2937">Faster &amp; steadier</text>
    <text x="548" y="269" font-size="10" fill="#6b7280">Snappier tills, fewer surprises at the counter</text>
  </g>

  <rect x="528" y="300" width="392" height="32" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="724" y="321" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Same promise, better foundation</text>

  <!-- ============ BOTTOM: the three promises ============ -->
  <rect x="16" y="380" width="928" height="156" rx="16" fill="#1F2937"/>
  <text x="480" y="416" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Three promises about the move</text>

  <g font-size="11">
    <rect x="40" y="436" width="280" height="80" rx="10" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="180" y="462" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1 · Nothing lost</text>
    <text x="180" y="482" font-size="10" fill="#d1d5db" text-anchor="middle">Products, stock, payments, team —</text>
    <text x="180" y="498" font-size="10" fill="#d1d5db" text-anchor="middle">your data moves, not rebuilds.</text>

    <rect x="340" y="436" width="280" height="80" rx="10" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="480" y="462" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2 · Simple to follow</text>
    <text x="480" y="482" font-size="10" fill="#d1d5db" text-anchor="middle">Update the link, sign in once,</text>
    <text x="480" y="498" font-size="10" fill="#d1d5db" text-anchor="middle">share the new address.</text>

    <rect x="640" y="436" width="280" height="80" rx="10" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="780" y="462" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3 · Worth the move</text>
    <text x="780" y="482" font-size="10" fill="#d1d5db" text-anchor="middle">Scale, speed, and the features</text>
    <text x="780" y="498" font-size="10" fill="#d1d5db" text-anchor="middle">your shop earns next.</text>
  </g>
</svg>
